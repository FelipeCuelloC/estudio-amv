pación: no son títulos valores, valores ni negociables", ["Valores negociables en bolsa que pueden transferirse libremente a otros inversionistas calificados", "Títulos valores a la orden, transferibles por endoso, que representan un derecho sobre el portafolio", "Acciones ordinarias del fondo, que otorgan voto en la asamblea y derecho a un dividendo anual"]], ["Las participaciones de un FIC cerrado son…", "Valores; pueden estar inscritas o no en el RNVE", ["No son valores: son derechos de participación no negociables y siempre sin inscripción en el RNVE", "Títulos de deuda pública que se inscriben automáticamente en el RNVE y se negocian en el MEC", "Valores siempre inscritos en bolsa, que deben negociarse a través de un sistema de negociación"]], ["Aportes en FIC abierto vs cerrado", "Abierto: solo dinero. Cerrado: dinero, pero el reglamento puede admitir aportes en especie", ["Abierto admite aportes en especie, siempre que lo autorice el reglamento; cerrado solo admite dinero", "Ambos admiten aportes únicamente en especie, valorados por un proveedor de precios autorizado", "Ambos aceptan aportes en especie libremente, sin necesidad de que el reglamento lo contemple"]], ["Permanencia mínima en FIC abierto", "Puede pactarse en el reglamento; las penalidades por retiro anticipado son ingreso para el FIC", ["No se puede pactar: el inversionista de un FIC abierto debe poder retirarse en cualquier momento", "Debe ser siempre de un año, y las penalidades por retiro anticipado ingresan a la administradora", "Se pacta en el reglamento, pero no puede superar 30 días y las penalidades las fija la SFC"]], ["Cinco FIC según su finalidad (Decreto 2555)", "Mercado monetario, capital privado (FCP), bursátiles (ETF), inmobiliarios (FICI) y de inversión del exterior", ["Renta fija, renta variable, mixtos, derivados y divisas (según el tipo de activos del portafolio)", "Abiertos, cerrados, mixtos, familiares y especiales (según su forma de redención de participaciones)", "Conservadores, moderados, agresivos, ETF y FICI (según el perfil de riesgo del inversionista objetivo)"]]]}, {"name": "FIC por finalidad (mercado monetario, ETF, FCP, FICI)", "cards": [["FIC del mercado monetario: plazo máximo promedio ponderado de los valores", "No puede superar 365 días", ["180 días calculados como promedio simple", "730 días", "90 días"]], ["FIC del mercado monetario: redención", "Al día hábil siguiente de la solicitud", ["Al final del plazo previsto en el reglamento", "En 30 días comunes", "Mensual"]], ["Inversiones admisibles de un FIC monetario", "Valores en pesos inscritos en RNVE con calificación mínima de grado de inversión, o deuda de la Nación, BanRep o Fogafín (sin calificación)", ["Acciones y derivados con calificación mínima, o proyectos inmobiliarios con garantía de la Nación", "Inmuebles y proyectos de infraestructura inscritos en el RNVE, con calificación mínima de AA", "Activos no inscritos en el RNVE denominados en pesos, con calificación mínima de grado de inversión asignada por una calificadora local, o deuda externa"]], ["Fondo bursátil (ETF)", "FIC que replica o sigue un índice nacional o internacional con un portafolio de algunos o todos los activos de su canasta", ["FIC que invierte principalmente en inmuebles y títulos de derechos fiduciarios sobre proyectos inmobiliarios y replica un índice de bienes raíces nacional", "FIC de deuda privada que invierte en bonos corporativos con calificación mínima AA+ y plazo largo", "FIC del mercado monetario que invierte en valores de corto plazo en pesos con alta liquidez"]], ["Concentración mínima de un ETF en activos del índice", "75% de los activos totales", ["50%", "100%", "66,6% de los activos totales, medido al cierre del mes"]], ["¿Se negocian los ETF?", "Sí: las participaciones son valores negociados en sistemas de negociación (tiempo real), como acciones", ["No: sus participaciones solo se redimen con la administradora, al valor de la unidad del día", "Solo en el mercado OTC, mediante comisionistas, con precio pactado entre las partes en cada operación", "Solo con la sociedad administradora, que actúa como contraparte de los inversionistas del fondo"]], ["¿Los ETF requieren ficha técnica y extractos de cuenta?", "No, sus administradores no están obligados a generarlos", ["Sí: deben generarlos mensualmente, igual que los demás FIC que se ofrecen al público", "Solo la ficha técnica, que debe publicarse mensualmente y estar disponible para los inversionistas", "Solo los extractos de cuenta, que deben enviarse trimestralmente a cada uno de los inversionistas"]], ["Fondo de capital privado (FCP): inversión mínima en activos distintos a valores del RNVE", "Al menos dos terceras partes (2/3) de los aportes", ["Al menos el 50% de los aportes, con un periodo de maduración de un año desde que se constituye", "Al menos tres cuartas partes (75%) de los aportes, medido sobre el valor total del portafolio", "Al menos el 10% de los aportes, y el resto puede estar en valores inscritos en el RNVE"]], ["FCP: ¿necesita autorización previa de la SFC para constituirse?", "No; basta entregar documentación, reglamento y perfil del gestor profesional (si lo hay)", ["Sí, siempre: la SFC debe aprobar el reglamento y el perfil del gestor antes de su funcionamiento", "Solo si es cerrado, porque los FCP abiertos se constituyen con la simple notificación a la SFC", "Solo si tiene más de 100 inversionistas, pues por debajo de ese número no se requiere trámite"]], ["FCP: tope de inversión de un cliente inversionista", "No superior al 20% de sus ingresos anuales o de su patrimonio, el que resulte mayor", ["No superior al 5% de su patrimonio, sin importar los ingresos anuales del cliente inversionista", "No superior al 50% de sus ingresos anuales o de su patrimonio, el que resulte menor", "Sin límite, siempre que el cliente haya recibido la recomendación profesional de un asesor certificado"]], ["FCP: permanencia mínima del aportante y concentración", "Mínimo 1 año; un inversionista no puede superar el 10% del patrimonio", ["Mínimo 30 días; un inversionista no puede tener más del 60% del patrimonio del fondo", "Mínimo 6 meses; un inversionista no puede tener más del 25% del patrimonio del fondo", "Sin permanencia mínima; un inversionista puede llegar a tener hasta el 100% del patrimonio"]], ["Cantidad mínima de inversionistas en un FCP", "Dos inversionistas", ["Cinco inversionistas como mínimo", "Diez", "Uno"]], ["Tipologías de FCP por propósito", "Adquisición/crecimiento, capital emprendedor, impacto, inmobiliario, infraestructura y recursos naturales", ["Solo infraestructura, que es el único propósito que la regulación admite para estos fondos", "Monetario, bursátil y exterior, según los activos en los que invierta el portafolio del fondo", "Renta fija y renta variable, según la clase de valores en los que invierte el gestor profesional"]], ["FICI: ¿qué son?", "FIC inmobiliarios: invierten en inmuebles, titularizaciones, derechos fiduciarios inmobiliarios, otros FICI y proyectos inmobiliarios", ["FIC que invierten en deuda pública y títulos de corto plazo, con liquidez inmediata para el inversionista y calificación mínima AAA en todos sus activos", "FIC del mercado monetario con calificación AAA, cuyas inversiones son depósitos y valores a la vista", "ETF de bienes raíces que replican un índice inmobiliario y se negocian en un sistema de negociación"]], ["FICI administrado: endeudamiento máximo", "Créditos hasta 2 veces el valor patrimonial del fondo (pueden garantizarse con los inmuebles)", ["Créditos hasta 5 veces el valor patrimonial del fondo, garantizados con el flujo de caja de los inmuebles", "Créditos de hasta el 50% del patrimonio del fondo, siempre que no estén garantizados con inmuebles", "No puede endeudarse: la regulación prohíbe todo tipo de apalancamiento en los FICI administrados"]], ["FICI: tope por aportante y mínimo de inversionistas", "Aportes no superiores al 50% del patrimonio tras los primeros 6 meses; mínimo 2 inversionistas tras 6 meses", ["Aportes no superiores al 10% del patrimonio desde el inicio y mínimo 5 inversionistas siempre", "Aportes no superiores al 25% del patrimonio tras el primer año; mínimo un inversionista desde el día uno", "Sin tope por aportante ni mínimo de inversionistas, porque son fondos de inversión de acceso restringido"]], ["Fondos de inversión del exterior", "Vehículos que operan en otra jurisdicción con autorización de su supervisor, que debe tener convenios de intercambio de información con la SFC; la supervisión sigue en el país de origen", ["Supervisados directamente por la SFC, que verifica sus reglamentos y portafolios en cada periodo", "Fondos creados en Colombia por sociedades administradoras locales para invertir en valores del exterior", "No pueden ofrecerse en Colombia: solo se admite la inversión directa de residentes en fondos del exterior, sin intermediación de entidades vigiladas ni distribución local"]]]}, {"name": "Familias de fondos", "cards": [["Familia de FIC", "Agrupación de más de un FIC bajo una misma sociedad administradora (art. 3.1.1.2.5)", ["Un FIC con varios tipos de participación que tienen comisiones y derechos distintos para cada inversionista", "Fusión de dos sociedades administradoras cuyos FIC se agrupan bajo un solo reglamento de inversión", "Un FIC con varios gestores externos que administran por separado distintos portafolios del mismo fondo"]], ["¿Qué debe autorizar la SFC en una familia?", "La familia y el primer FIC de la misma; los siguientes solo se informan a la SFC dentro de 5 días desde su funcionamiento", ["Cada FIC nuevo debe autorizarse por separado, con el mismo trámite del primer FIC de la familia", "Ninguno: la familia y todos sus FIC se constituyen con solo notificar a la SFC al inicio de operación", "Solo el primer fondo; la familia se constituye por decisión de la junta directiva de la administradora, que informa a la SFC al iniciar operación de cada uno"]], ["Condiciones para familias de FIC (una de ellas)", "Inversiones solo en bonos o acciones inscritos en RNVE (o extranjeros listados) sin apalancamiento; ETF que sigan índices reconocidos; o FICI con destinación definida por la SFC", ["Fondos de capital privado apalancados, siempre que la junta directiva autorice la inversión", "Cualquier FIC que cuente con la aprobación del gerente y la certificación del revisor fiscal", "FIC con inversiones ilimitadas en derivados, que el reglamento defina y la SFC apruebe en cada caso, siempre con apalancamiento y sin límites por emisor"]], ["¿Una familia puede estar formada por otras familias?", "No", ["Sí, siempre", "Solo con autorización de la SFC", "Solo si son ETF"]], ["Los activos de cada FIC de una familia son…", "Patrimonio independiente y separado de los demás FIC de la familia", ["Un patrimonio común, administrado conjuntamente por el gerente para todos los FIC de la familia", "Propiedad del gestor externo, que responde por ellos ante los inversionistas de cada fondo", "Propiedad de la asamblea de inversionistas de la familia, que decide sobre el portafolio común"]]]}, {"name": "Participaciones, valor de unidad y órganos", "cards": [["Fórmula del valor de la unidad del FIC", "V = (A − P) / N, es decir (activos − pasivos) / número de unidades", ["V = (A + P) / N: se suman activos y pasivos y se divide entre el número de unidades", "V = A / P: el valor de la unidad es la razón entre los activos y los pasivos del fondo", "V = N × (A − P): el patrimonio neto multiplicado por el número de unidades en circulación"]], ["Net Asset Value (NAV)", "Valor de los activos netos del fondo: activos menos pasivos", ["Solo el valor de los activos del fondo, sin descontar los pasivos ni las comisiones causadas", "El valor de los pasivos del fondo, es decir, las obligaciones que tiene frente a terceros", "El patrimonio de la sociedad administradora, que respalda las obligaciones del fondo a los inversionistas"]], ["¿Por qué razones cambia el patrimonio de un FIC?", "Entradas/salidas de inversionistas y variaciones en el valor de mercado de los activos del portafolio", ["Solo por los rendimientos del portafolio, que aumentan el valor de las participaciones", "Solo por los retiros de los inversionistas, que reducen el número de unidades en circulación", "Por decisión de la asamblea de inversionistas, que fija el patrimonio objetivo de cada periodo"]], ["Tipos de participación en un FIC", "Un mismo reglamento puede tener varios tipos de participación (por tipo de inversionista) con derechos y comisiones distintos; cada tipo genera un valor de unidad independiente", ["Todos los inversionistas deben tener el mismo tipo de participación, con las mismas comisiones", "Un solo valor de unidad siempre, aunque el reglamento defina distintas comisiones por inversionista, y los derechos son iguales para todos los tipos de participación", "Solo está permitido en FIC cerrados, porque en los abiertos se exige un único tipo de participación"]], ["Órganos de los FIC", "Junta directiva, gerente, comité de inversiones, revisor fiscal y asamblea de inversionistas", ["Solo el gerente y el revisor fiscal, porque los demás órganos son propios de la administradora", "Junta directiva, gerente, custodio y comité de riesgos, sin asamblea de inversionistas", "Comité de riesgos, auditor interno y asamblea de inversionistas, sin gerente ni comité de inversiones"]], ["Funciones de la junta directiva de la administradora (ejemplos)", "Definir políticas de la actividad, designar el custodio, definir valoración, definir conflictos de interés, nombrar gerente del FIC y suplente, autorizar emisión de bonos", ["Ejecutar las inversiones del FIC y decidir diariamente la compra y venta de los activos del portafolio, con base en la política de inversión y los cupos aprobados", "Presentar la información a la asamblea de inversionistas y convocar sus reuniones ordinarias cada año", "Valorar el portafolio diariamente con base en los precios publicados por el proveedor de precios"]], ["Gerente del FIC: características", "Persona natural de dedicación exclusiva con suplente, inscrito en el RNPMV, nombrado por la junta directiva", ["Persona jurídica de dedicación exclusiva, designada por la asamblea de inversionistas del fondo, sin suplente y sin necesidad de inscripción en el RNPMV", "Persona natural elegida por la asamblea, que no tiene que estar inscrita en el RNPMV", "Persona natural sin dedicación exclusiva, con suplente opcional y sin inscripción en el RNPMV"]], ["Función principal del gerente", "Ejecutar la gestión del portafolio como experto prudente y diligente según política de inversión, reglamento y normas", ["Aprobar el reglamento del fondo y sus modificaciones, que luego informa a la SFC y a los inversionistas dentro de los plazos fijados por la norma vigente", "Custodiar los valores del portafolio y garantizar su segregación respecto de los de la administradora", "Convocar la asamblea de inversionistas y presentar ante ella el informe de gestión de cada periodo"]], ["¿El gerente puede serlo de varios FIC?", "Sí, de múltiples FIC o familias; el suplente solo actúa en ausencias del principal", ["No: solo puede ser gerente de un FIC, para garantizar su dedicación exclusiva al portafolio", "Solo de FIC cerrados, porque los abiertos exigen un gerente propio con dedicación total al fondo", "Solo de FIC de la misma familia; el suplente actúa también en la gestión ordinaria del portafolio"]], ["Comité de inversiones: funciones", "Analizar inversiones y emisores y definir cupos y políticas de adquisición/liquidación; sus miembros se consideran administradores (Ley 222/1995)", ["Auditar los estados financieros del FIC y emitir el dictamen sobre sus cuentas cada periodo", "Convocar la asamblea de inversionistas y fijar el orden del día de cada una de sus reuniones", "Valorar diariamente el portafolio y registrar el precio en el sistema de negociación correspondiente, con los insumos del proveedor de precios autorizado"]], ["Revisor fiscal del FIC", "Equipo dirigido por un revisor fiscal (persona natural o jurídica); sus informes del FIC son independientes de los de la administradora; el FIC puede contratar auditor externo", ["Es nombrado por el gerente del FIC y sus informes forman parte de los de la administradora", "Solo existe en los FIC cerrados, porque en los abiertos la revisión la hace el custodio de valores", "Es el mismo custodio de valores, que verifica el cumplimiento del reglamento y los límites de inversión, y reporta a la SFC cada vez que detecte un incumplimiento"]], ["Asamblea de inversionistas: quórum deliberatorio", "Número plural de inversionistas con mínimo 51% de las participaciones", ["Número plural de inversionistas con mínimo 25% de las participaciones en circulación", "Número plural de inversionistas con mínimo 75% de las participaciones en circulación", "Número plural de inversionistas con mínimo 10% de las participaciones en circulación"]], ["Asamblea: mayoría decisoria", "Mitad más una de las participaciones presentes (el reglamento puede subir hasta 70% de las presentes)", ["Dos terceras partes de todas las participaciones en circulación, sin importar las presentes", "Unanimidad de las participaciones presentes, excepto para cambios del reglamento de inversión", "Mayoría simple de los asistentes, sin importar el número de participaciones que cada uno represente"]], ["¿La participación de la administradora como inversionista cuenta en el quórum?", "No: no cuenta para quórum ni da derecho a voto", ["Sí, cuenta", "Cuenta solo para decisiones de liquidación", "Cuenta doble"]], ["¿Quién puede convocar la asamblea?", "Administradora, gestor externo, revisor fiscal, inversionistas con mínimo 25% de las participaciones o la SFC", ["Solo la sociedad administradora, que es la única que conoce la situación del fondo y su portafolio y puede fijar la fecha, la hora y el orden del día", "Solo el gerente del FIC, que lo hace por solicitud del comité de inversiones y de la junta", "Cualquier inversionista, sin importar el porcentaje de participaciones que represente en el fondo"]], ["Funciones de la asamblea de inversionistas", "Designar auditor externo, cambiar de administrador, decretar liquidación, aprobar fusión, solicitar remoción del gestor externo", ["Nombrar al gerente y al comité de inversiones, y aprobar las políticas de inversión del fondo, junto con el presupuesto de gastos de cada ejercicio anual", "Valorar el portafolio y aprobar los estados financieros del FIC al cierre de cada ejercicio", "Fijar el patrimonio mínimo del fondo y las comisiones que cobra la sociedad administradora"]], ["Consulta universal", "Alternativa a la asamblea: consulta escrita a todos los inversionistas, prevista en el reglamento", ["Encuesta de satisfacción que la administradora aplica a los inversionistas para mejorar su servicio", "Asamblea virtual obligatoria que reemplaza a la presencial cuando el fondo tiene más de 100 inversionistas", "Consulta escrita dirigida únicamente a la SFC, para que apruebe las decisiones propias de la asamblea"]]]}, {"name": "Valoración, prohibiciones y conflictos", "cards": [["Periodicidad de valoración del FIC", "Diaria", ["Semanal", "Mensual", "Trimestral"]], ["Objetivo de la valoración", "Calcular, registrar y revelar el valor o precio justo de intercambio del activo en una fecha determinada", ["Maximizar la rentabilidad del portafolio reconociendo en cada fecha las ganancias de mercado no realizadas", "Fijar la comisión de administración que se cobra a los inversionistas con base en el valor de los activos", "Determinar el costo histórico de los activos para registrarlos en la contabilidad de la administradora"]], ["Circular Externa 006 de 2021 (SFC)", "Cambió desde el 1 de junio de 2021 la valoración de participaciones de FIC cerrados, FCP, etc. para usar precios de proveedores de precios que incorporan señales de mercado", ["Prohibió los FIC cerrados y obligó a liquidarlos antes del 1 de junio de 2021 con aprobación de la SFC, en adelante solo se permiten los abiertos", "Creó los ETF y fijó las reglas de negociación de sus participaciones en los sistemas de negociación", "Fijó el patrimonio mínimo de los FIC en UVB y ordenó actualizarlo cada año con la inflación"]], ["Prohibición: préstamos con dinero del FIC", "No se pueden conceder, salvo repos activos, simultáneas activas y TTV", ["Se permiten préstamos a la matriz de la administradora, con aprobación de la junta directiva", "Se permiten préstamos a los inversionistas del FIC, con garantía de sus propias participaciones", "Se permiten préstamos sin límite a emisores con calificación AAA inscritos en el RNVE"]], ["Prohibición: participaciones como garantía", "No aceptar participaciones del FIC como garantía de créditos a sus inversionistas", ["Es permitido con aprobación de la junta directiva y bajo el cupo de crédito de la administradora", "Solo está prohibido para los FIC cerrados; los abiertos pueden aceptarlas como garantía de créditos", "Solo está permitido para inversionistas institucionales, con constancia en el libro de órdenes"]], ["Prohibición: invertir en valores de la propia administradora", "No invertir en valores cuyo emisor, avalista, aceptante, garante u originador sea la administradora o el gestor externo", ["Es obligatorio invertir en ellos, para mostrar la confianza de la administradora en sus propios valores y alinear sus intereses con los de los inversionistas", "Se permite hasta el 50% del portafolio, siempre que el emisor cuente con calificación de riesgo mínima", "Se permite si los valores tienen calificación AAA y están inscritos en el RNVE y en un sistema"]], ["Prohibición: contraparte", "No actuar directa o indirectamente como contraparte del FIC que administra", ["Puede ser contraparte con la aprobación del gerente, siempre que informe en el siguiente informe de gestión", "Solo puede serlo en operaciones de reporto o simultáneas, siempre que se haga a precios de mercado", "Solo con los ETF que administre, porque sus precios se determinan en un sistema de negociación"]], ["Prohibición: operaciones con partes vinculadas", "No comprar ni vender activos del FIC con socios, representantes legales, empleados o sus parientes (2º consanguinidad, 2º afinidad, único civil) o sociedades donde tengan ≥25% del capital", ["Se permite con precio de mercado y con aprobación de la junta directiva de la administradora", "Solo está prohibido con los familiares del gerente del FIC; los demás vinculados, como socios y empleados, pueden operar con el fondo a precios de mercado", "Se permite hasta un 10% del patrimonio del FIC, siempre que se informe a los inversionistas"]], ["Conflicto: órdenes concurrentes de varios FIC", "Distribuir sin favorecer a ningún FIC en detrimento de otros, según el código de gobierno corporativo", ["Favorecer al FIC de mayor tamaño, porque genera más ingresos por comisión para la administradora", "Favorecer al FIC con mayor comisión de administración, pues el costo se reparte entre sus inversionistas", "Ejecutar primero las órdenes del FIC de la matriz, y luego las de los demás fondos administrados"]], ["Inversión en valores de la matriz o subordinadas: límites", "Solo vía sistemas de negociación autorizados; máx. 10% de los activos del FIC (hasta 30% con autorización de la asamblea), excepto ETF", ["Solo vía sistemas de negociación autorizados; máximo 50% de los activos del FIC, sin tope adicional", "Solo vía operaciones OTC con precio acordado; máximo 5% de los activos del FIC en cualquier caso", "Sin límite alguno, siempre que el emisor tenga calificación mínima de AAA y se informe a los inversionistas en la ficha técnica y en el informe de rendición de cuentas"]], ["FIC con valores de un único emisor", "Mínimo 80% en ese emisor; el resto en fondos del mercado monetario o depósitos a la vista", ["100% en ese emisor, sin posibilidad de mantener recursos en depósitos o en fondos monetarios", "50% en ese emisor; el resto puede estar en cualquier valor inscrito en el RNVE con calificación", "20% en ese emisor, y el 80% restante en valores de renta fija con calificación de grado de inversión"]], ["Depósitos en cuentas de la matriz o subordinadas", "Máx. 10% de los activos del FIC; en los primeros 6 meses puede llegar a 30%", ["Están prohibidos totalmente: el FIC no puede abrir cuentas en la matriz ni en sus subordinadas", "Máximo 50% de los activos del FIC; en los primeros 6 meses puede llegar hasta el 100%", "Sin límite alguno, siempre que la matriz tenga calificación AAA y pague una tasa de mercado"]], ["Operaciones apalancadas con matriz o subordinadas", "Nunca superan el 10% de los activos del FIC", ["Nunca superan el 30% de los activos del FIC, y se miden diariamente con el precio de mercado", "Nunca superan el 50% de los activos del FIC, y se miden mensualmente con el costo histórico", "Nunca superan el 25% de los activos del FIC, y se miden al cierre de cada trimestre calendario"]], ["Inversión de la administradora en sus propios FIC", "Máximo 15% del valor del fondo; debe conservar participaciones al menos 1 año (o la mitad del plazo si el FIC dura menos de 1 año)", ["Máximo 50% del valor del fondo; no tiene que conservar las participaciones por ningún plazo", "Máximo 5% del valor del fondo; debe conservar las participaciones al menos durante 30 días", "Está prohibido totalmente: la administradora no puede invertir recursos propios en los FIC que administra, para evitar conflictos de interés con los inversionistas"]], ["En FIC emisores de bonos, ¿cuánto de la emisión puede suscribir la administradora, matriz o subordinadas?", "Hasta 10% del monto total de la emisión", ["30% del monto total de la emisión", "50%", "25%"]]]}, {"name": "Fusión, liquidación, gastos y política", "cards": [["Fusión de FIC administrados por distintas sociedades", "Requiere autorización de la SFC", ["Solo notificación", "Solo aprobación de la junta directiva de cada sociedad", "No se permite"]], ["Convocatoria a asamblea para aprobar fusión", "Comunicación escrita con el compromiso de fusión, tras 15 días hábiles del envío de la comunicación", ["Con un día de anticipación, mediante aviso en la página web de la administradora y de la SFC", "Con 30 días calendario, mediante publicación en un diario de amplia circulación y en la web", "Solo por publicación en la página web de la administradora, sin comunicación escrita individual"]], ["Derecho de los inversionistas que no estén de acuerdo con la fusión", "Pedir la redención de sus participaciones dentro de 1 mes desde la asamblea", ["Ninguno: la decisión de la asamblea obliga a todos los inversionistas, aun a quienes votaron en contra", "Votar nuevamente en una segunda asamblea convocada por la SFC para decidir sobre la fusión", "Pedir una indemnización a la SFC por el perjuicio que genera la fusión de los fondos de inversión"]], ["Causales de liquidación (ejemplos)", "Vencimiento del término, decisión de la asamblea, decisión motivada de la junta, imposibilidad de la administradora, patrimonio < 39.500 UVT, toma de posesión, incumplir límites de participación tras 1 año", ["Rentabilidad negativa del FIC durante tres meses consecutivos frente a su índice de referencia", "Decisión unilateral del gerente del FIC, con aviso posterior a la junta directiva de la administradora, cuando considere que el fondo ya no es viable", "Solicitud de un inversionista que tenga al menos el 10% de las participaciones en circulación"]], ["Comunicación de una causal de liquidación", "Inmediatamente a la SFC, bolsas y sistemas de negociación; a inversionistas por los medios del reglamento, a más tardar el día siguiente", ["En un plazo de 30 días, mediante comunicación escrita dirigida a la SFC y a los inversionistas, y luego se informa a las bolsas y a los sistemas de negociación", "Solo a la SFC, que decide si informa a los inversionistas y a los sistemas de negociación", "En el próximo informe de rendición de cuentas, con corte al 30 de junio o al 31 de diciembre"]], ["Mientras subsista la causal de liquidación el FIC no puede…", "Constituir nuevas participaciones ni atender redenciones", ["Pagar sus gastos, incluidos los de custodia y de revisoría fiscal, hasta que cese la causal", "Valorar el portafolio diariamente, que es una función que se suspende mientras dure la causal", "Reunir la asamblea de inversionistas, que solo puede convocarse una vez cese la causal"]], ["Asamblea tras una causal distinta al vencimiento o decisión de asamblea", "Se convoca para celebrarse entre 5 y 10 días calendario siguientes; si falla por quórum, nueva reunión entre 3 y 6 días con cualquier quórum", ["Se convoca para celebrarse dentro de los 30 días calendario siguientes, con cualquier quórum", "Se convoca para celebrarse dentro del año siguiente, con la mayoría de participaciones del fondo y sin posibilidad de una segunda reunión por falta de quórum", "Se convoca para celebrarse en 15 días hábiles, con un quórum del 75% de las participaciones"]], ["Plazo para liquidar las inversiones del portafolio", "El señalado en el reglamento, máximo 1 año; luego la asamblea se reúne en máx. 4 meses", ["Máximo 6 meses; luego la asamblea se reúne dentro de los 2 meses siguientes a decidir el cierre", "Máximo 2 años; luego la asamblea se reúne dentro de los 6 meses siguientes a rendir las cuentas", "Máximo 3 meses; luego la asamblea se reúne dentro de un mes para aprobar el informe final"]], ["Pago a inversionistas tras liquidar inversiones", "Máximo 15 días hábiles", ["5 días calendario siguientes a la liquidación", "30 días", "1 año"]], ["Gastos a cargo del FIC", "Custodia, depósito, comisión de administración, revisoría fiscal, asambleas, seguros, comisiones de transacciones, calificación del FIC, tributos, coberturas, etc.; los no listados en el reglamento los asume la administradora", ["Todos los gastos de la administradora, incluidos los de su operación general y de sus áreas comerciales, sin importar si están o no en el reglamento del fondo", "Los salarios del gerente del FIC y de los demás empleados que apoyan la gestión del portafolio", "Los gastos de publicidad de la administradora y de distribución de las participaciones de cada fondo"]], ["Contenido de la política de inversión", "Plan de inversiones, parámetros del mercado monetario, política de depósitos, perfil de riesgo y política de gestión de riesgos", ["Solo el plan de inversiones, con los activos admisibles y los límites máximos por emisor", "Solo el perfil del inversionista objetivo, con su tolerancia al riesgo y el horizonte de inversión", "Solo las comisiones, los gastos y la política de redención de participaciones del fondo de inversión, junto con el perfil del gerente y de los miembros del comité"]]]}, {"name": "Administración, gestión y distribución", "cards": [["Tres actividades de la administración de FIC", "Gestión, distribución y custodia de valores", ["Gestión, asesoría y corretaje", "Valoración, auditoría y liquidación de las operaciones", "Venta, marketing y servicio"]], ["¿Cuáles actividades pueden contratarse con terceros?", "Gestión y distribución; la custodia debe ser ejercida por sociedades fiduciarias autorizadas", ["Solo la gestión, porque la distribución y la custodia deben ser ejercidas directamente por la administradora", "Las tres: gestión, distribución y custodia pueden contratarse con cualquier tercero autorizado", "Ninguna: la administradora debe ejecutar todas las actividades directamente con su propio personal"]], ["Grado de responsabilidad de la sociedad administradora", "Hasta la culpa leve: diligencia de un experto prudente", ["Solo hasta el dolo: la administradora responde únicamente cuando actúa con intención de dañar", "Solo hasta la culpa grave: se exige un cuidado mínimo en la gestión de los recursos del fondo", "Ninguna responsabilidad si se contrata un gestor externo, que responde ante los inversionistas"]], ["¿La responsabilidad se mantiene si contrata gestor externo?", "Sí, frente a los inversionistas y en la escogencia y seguimiento del gestor y custodio", ["No: la responsabilidad se traslada íntegramente al gestor externo, que actúa como experto", "Solo parcialmente: responde por la escogencia, pero no por el seguimiento del gestor y del custodio", "Se traslada al custodio, que vigila el cumplimiento del reglamento y de los límites de inversión"]], ["Obligaciones de la administradora (ejemplos)", "Actuar solo en interés de inversionistas, gestionar riesgos, valorar, contabilidad separada por FIC, independencia de funciones, no discriminar inversionistas, informar a SFC y AMV", ["Maximizar sus comisiones, siempre que el FIC cumpla el reglamento y se informe a los inversionistas", "Llevar una contabilidad consolidada de todos los FIC que administra, para facilitar su seguimiento", "Tratar de forma distinta a los inversionistas grandes, que aportan más recursos y pagan más comisión, siempre que no se afecte el patrimonio del fondo ni a la SFC"]], ["Gestión de portafolios de FIC", "Decisiones de inversión/desinversión y gestión de riesgos; la hace la administradora o un gestor externo/extranjero", ["Solo la custodia de los valores del portafolio y la salvaguarda de los derechos que ellos confieren", "Solo la distribución de las participaciones y la vinculación de los inversionistas al fondo", "Solo la contabilidad del fondo y la elaboración de sus estados financieros y sus informes periódicos, que la hace un tercero contratado por la administradora"]], ["¿Quiénes pueden ser gestores externos?", "Sociedades fiduciarias, comisionistas de bolsa y sociedades administradoras de inversión", ["Solo bancos, que tienen la infraestructura y capital para gestionar los portafolios de los FIC", "Cualquier empresa con experiencia en gestión de inversiones, aunque no esté vigilada por la SFC", "Solo aseguradoras, que cuentan con áreas especializadas en gestión de portafolios de largo plazo"]], ["Informe del gestor externo a la administradora", "Periódico, por lo menos una vez al mes", ["Anual", "Semestral", "Trimestral, dentro de los 15 días del cierre"]], ["Distribución de FIC: ¿qué es y quién la hace?", "Promoción de FIC para vincular inversionistas; solo por administradoras o distribuidores especializados (cuentas ómnibus o bancos)", ["Cualquier persona natural, siempre que cuente con certificación ante el AMV y un contrato escrito con la administradora, sin necesidad de ser distribuidor especializado", "Solo el gestor externo, que es quien conoce el portafolio y puede explicarlo a los inversionistas", "Solo la bolsa de valores, a través de las comisionistas con las que tenga contrato de uso de red"]], ["Medios de distribución", "Fuerza de ventas directa, contrato de uso de red y contrato de corresponsalía", ["Solo contrato de corresponsalía, que es el único medio habilitado para vincular a nuevos inversionistas", "Solo fuerza de ventas, siempre que sus integrantes estén inscritos en el RNPMV y certificados", "Solo internet, mediante las plataformas virtuales de las administradoras y de los distribuidores"]], ["Información necesaria y suficiente en la promoción", "Estructura, términos y características del FIC; precios, comparación de beneficios y riesgos; riesgos inherentes", ["Solo la rentabilidad histórica del fondo, que es el dato que más importa a los inversionistas", "Solo las comisiones y los gastos, que permiten comparar el costo de los distintos fondos del mercado", "Solo la calificación del fondo, que resume su calidad crediticia y su riesgo de mercado y de liquidez, más su rentabilidad histórica en los últimos tres años"]], ["Obligaciones de la fuerza de ventas", "Identificarse como promotor, verificar que el inversionista entienda y acepte reglamento y prospecto, no hacer afirmaciones engañosas, remitir órdenes oportunamente", ["Garantizar rendimientos mínimos, para que el inversionista conozca el resultado esperado de su aporte y pueda comparar el fondo con otros productos del mercado", "Ocultar los costos menores, para simplificar el mensaje y facilitar la decisión de vinculación", "Asesorar sin necesidad de perfil, cuando el inversionista ya conoce el producto y solicita vincularse"]], ["¿Quién responde por errores de la fuerza de ventas?", "La sociedad administradora o el distribuidor especializado", ["El promotor únicamente, que debe responder con su patrimonio ante el inversionista afectado", "El inversionista, que debe verificar la información recibida antes de aceptar el reglamento y prospecto", "La SFC, que vigila las actividades de promoción y sanciona a la administradora y al distribuidor"]], ["Información promocional debe ser…", "Veraz, verificable, actualizada, exacta, entendible, completa; con denominación de la administradora y mención de vigilancia de la SFC; rentabilidades en tasas efectivas anuales", ["Atractiva y breve, para captar la atención del inversionista y destacar la rentabilidad del fondo, sin necesidad de mencionar los riesgos ni a la SFC como supervisor", "Presentada solo en tasas nominales anuales, porque son las más simples de comparar entre fondos", "Sin mención de la SFC, para no sugerir que existe una garantía estatal sobre la inversión"]], ["Prohibiciones en promoción", "Asegurar rendimientos, hacer pronósticos, tomar como definitivos fenómenos transitorios, atribuir características que no son propias del FIC, omitir calificaciones", ["Mostrar rentabilidades históricas con la advertencia de que no garantizan resultados futuros", "Mencionar el nombre del custodio y de la administradora, con el número de resolución de la SFC", "Presentar el reglamento y el prospecto del fondo, con sus costos y los riesgos a los que se expone, y entregar la ficha técnica actualizada al inversionista potencial"]]]}, {"name": "Revelación de información y asesoría", "cards": [["Cinco mecanismos de revelación de información", "Reglamento, prospecto, ficha técnica, extracto de cuenta e informe de rendición de cuentas", ["Reglamento, balance, memoria, boletín y circular, que se publican cada año en la página web", "Prospecto, contrato, factura, extracto y póliza, que se entregan al inversionista al vincularse", "Ficha técnica, auditoría, cotización, acta y registro, que la SFC exige a las administradoras"]], ["Prospecto del FIC", "Documento imprescindible para comercializar; debe darse a conocer antes de vincular inversionistas, con constancia de aceptación y entendimiento", ["Informe semestral de gestión que se envía a los inversionistas con corte a junio y diciembre", "Documento interno de la administradora, que sirve de guía para sus áreas comercial y operativa", "Resumen de la ficha técnica que se entrega a los inversionistas junto con el extracto de cuenta, y que reemplaza el reglamento en las comunicaciones comerciales"]], ["Ficha técnica: periodicidad", "Se actualiza y publica mensualmente, dentro de los 5 días hábiles siguientes al último día calendario del mes", ["Diaria: se publica cada día hábil con el valor de la unidad y la rentabilidad del fondo", "Anual: se publica dentro de los 30 días siguientes al cierre del ejercicio de cada año", "Trimestral: se publica dentro de los 15 días hábiles siguientes al cierre de cada trimestre y se mantiene en la página web durante seis meses completos"]], ["Extracto de cuenta", "Informa periódicamente a cada inversionista aportes, retiros y rentabilidad del periodo", ["Resumen de todos los inversionistas del fondo, con sus aportes, retiros y rentabilidad del periodo", "Informe que la administradora envía a la SFC con los aportes y retiros de cada inversionista", "Estado de resultados del FIC con ingresos, gastos y utilidades del periodo, certificado por el revisor"]], ["Informe de rendición de cuentas: periodicidad y plazo", "Al menos cada 6 meses con corte 30 de junio y 31 de diciembre; envío máximo 15 días comunes tras el corte", ["Anual con corte al 31 de diciembre; envío máximo dentro de los 60 días calendario siguientes", "Mensual con corte al último día calendario; envío máximo dentro de los 5 días hábiles siguientes", "Trimestral con corte a marzo, junio, septiembre y diciembre; envío máximo dentro de 60 días"]], ["Contenido del informe de rendición de cuentas", "Gestión de los bienes, balance general y estado de resultados del FIC", ["Solo la rentabilidad del fondo, comparada con el índice de referencia que defina el reglamento", "Solo la composición del portafolio, con los emisores y plazos de cada una de sus inversiones", "Solo las comisiones y gastos del periodo, con el detalle de lo cobrado a los inversionistas"]], ["Datos de la ficha técnica (ejemplos)", "Valor del FIC, número de inversionistas, calificación, política, permanencia mínima, comisiones, rentabilidad, volatilidad, custodio, composición, hoja de vida del gerente", ["Solo la rentabilidad y las comisiones, que son los datos que el inversionista compara entre fondos, junto con el valor de la unidad al último día del mes", "Datos personales de los inversionistas, como nombre, identificación y monto de cada aporte", "Estados financieros de la administradora, con su patrimonio técnico y su calificación de riesgo"]], ["Ventajas de invertir en FIC", "Acceso con bajos montos, diversificación, liquidez (FIC abiertos), administración profesional, oferta amplia, supervisión (SFC y AMV), comodidad", ["Rentabilidad garantizada por la administradora y respaldada con el patrimonio de la sociedad", "Ausencia de riesgo, porque los activos del fondo están segregados de los de la administradora", "Cero comisiones, porque los gastos del fondo se cubren con los rendimientos de sus inversionistas y la administradora no cobra por la gestión profesional del portafolio"]], ["Etapas de la asesoría", "Perfil del inversionista, perfil del producto, análisis de conveniencia, recomendación profesional, entrega de información y distribución", ["Solo recomendación y venta, porque el perfil del inversionista se obtiene al vincularlo al producto y el análisis de conveniencia lo realiza el propio cliente", "Perfil del inversionista y distribución, sin evaluar el producto ni el análisis de conveniencia", "Análisis de conveniencia y cobro de la comisión de asesoría, una vez el inversionista acepta"]], ["¿Qué es un FIC universal?", "FIC simple dirigido a cualquier inversionista; su distribución no exige perfilamiento, análisis de conveniencia ni recomendación profesional", ["Cualquier FIC cerrado, porque sus participaciones son valores que se negocian en el mercado", "FIC dirigido solo a inversionistas profesionales, con una distribución que exige perfilamiento previo, análisis de conveniencia y recomendación profesional siempre", "FIC de capital privado, cuya distribución exige perfilamiento y recomendación profesional siempre"]], ["FIC clasificados como productos complejos (ejemplos)", "FCP, inmobiliarios no negociados en bolsa, los que inviertan en activos no inscritos/listados, commodities sin valor, apalancados, ETF con índices no reconocidos", ["FIC del mercado monetario, que invierten en valores de corto plazo con alta calificación crediticia y se redimen al día hábil siguiente a la solicitud", "ETF sobre índices de bolsas reconocidas, que se negocian en sistemas y tienen precio en tiempo real", "FIC que invierten en deuda pública, con liquidez a la vista y una calificación de riesgo AAA"]], ["Recomendación profesional: ¿cuándo debe darse en FIC?", "Para la vinculación al fondo; durante la permanencia lo define el reglamento, pero siempre si el cliente la pide o hay circunstancia sustancial", ["Nunca en FIC, porque es un producto simple que no exige recomendación en ninguna etapa", "Solo en la salida del fondo, cuando el inversionista decide retirar sus participaciones", "Solo cuando el cliente es un inversionista profesional, que puede renunciar a ella por escrito, y nunca cuando se trata de un cliente inversionista persona natural"]], ["La recomendación profesional debe ser…", "Personalizada, dirigida a un inversionista identificado y basada en perfil del cliente y del producto", ["Genérica y aplicable a todos los clientes, para facilitar su entrega masiva por la fuerza de ventas", "Basada solo en la rentabilidad pasada del fondo, que es la mejor señal de sus resultados futuros", "Verbal y sin soporte, porque lo importante es la conversación y no la constancia de la recomendación"]], ["Vinculación a un FCP: ¿requiere recomendación profesional?", "No (la comercialización primaria de FCP no es distribución de FIC), pero sí perfilamiento, entrega del reglamento e información de riesgos", ["Sí, siempre, porque el FCP es un producto complejo y su vinculación es distribución de FIC", "No requiere nada: basta la firma del contrato de vinculación y la entrega de la ficha técnica", "Solo perfilamiento si el cliente es profesional, que es el único que puede vincularse a un FCP, sin entrega del reglamento ni información sobre los riesgos del fondo"]], ["Negociación secundaria de participaciones de FCP", "Al ser producto complejo y valor, aplican las reglas de asesoría", ["No requiere reglas especiales, porque la negociación secundaria es una operación entre inversionistas", "Solo se debe informar a la SFC cada operación de negociación secundaria, dentro del día hábil siguiente", "Está prohibida: las participaciones de los FCP solo pueden redimirse al final del plazo del fondo"]]]}, {"name": "Custodia de valores", "cards": [["Custodia de valores", "Actividad por la cual el custodio (sociedad fiduciaria autorizada por la SFC) cuida y vigila los valores y recursos del custodiado, con mínimo salvaguarda, compensación/liquidación y derechos patrimoniales", ["Venta de valores por cuenta del inversionista, con liquidación en el sistema de compensación", "Gestión del portafolio del custodiado, tomando las decisiones de inversión y desinversión", "Valoración de los valores custodiados con los precios de los proveedores de precios autorizados, y la gestión de las inversiones del custodiado según su política"]], ["Normas que crearon la custodia como actividad independiente", "Decretos 1243 y 1498 de 2013", ["Decreto 119 de 2017", "Decreto 2555 de 2010 y Ley 964 de 2005", "Circular 006 de 2021"]], ["Decreto 119 de 2017 en custodia", "Definió el servicio de custodia para inversionistas extranjeros", ["Creó los FIC y definió su régimen de patrimonio mínimo, órganos y obligaciones de la administradora", "Reguló la valoración de las inversiones de los FIC con precios de proveedores autorizados", "Reguló el funcionamiento de los ETF y la negociación de sus participaciones en los sistemas"]], ["Servicios obligatorios de custodia", "Salvaguarda de valores y compensación y liquidación de operaciones (más anotación en cuenta, derechos patrimoniales, etc.)", ["Solo contabilidad del custodiado, que debe llevarse de forma independiente de la del custodio, y la valoración de los valores custodiados con un proveedor de precios", "Solo valoración del portafolio, con base en los precios de un proveedor de precios autorizado", "Gestión del portafolio, incluidas las decisiones de inversión y desinversión del custodiado"]], ["Servicios especiales para FIC", "Valoración del portafolio y participaciones, y contabilidad del FIC custodiado", ["Compensación y liquidación de las operaciones, que se cumplen con los recursos del custodiado", "Derechos políticos de los valores, como el voto en las asambleas de accionistas de los emisores", "Gestión de inversión del FIC, que el custodio ejerce por delegación de la sociedad administradora"]], ["Servicios complementarios (ejemplos)", "Administración de derechos políticos, TTV, obligaciones fiscales y cambiarias", ["Compensación y liquidación, que el custodio presta a todos los custodiados sin costo adicional", "Valoración del FIC, con base en los precios de los proveedores autorizados por la SFC", "Contabilidad del FIC, con estados financieros separados de los de la sociedad administradora"]], ["Principios de la custodia (art. 2.37.1.1.5)", "Independencia, segregación y profesionalidad", ["Transparencia, lealtad y reserva", "Liquidez, rentabilidad y seguridad de los valores custodiados", "Diligencia, prudencia y probidad"]], ["Segregación en custodia", "Los valores custodiados son patrimonio independiente: no son activos del custodio ni prenda de sus acreedores y quedan excluidos de procesos concursales", ["Son parte de la masa de bienes del custodio y concurren a su liquidación con los demás acreedores", "Se mezclan con los activos propios del custodio, pero se registran por separado en su contabilidad, y pueden ser perseguidos por los acreedores de éste en un concurso", "Pueden usarse como garantía de las obligaciones del custodio, con autorización del custodiado"]], ["Reporte diario del custodio", "Debe reportar diariamente al custodiado los movimientos realizados por sus instrucciones", ["Anual: un reporte consolidado con los movimientos del año, dentro de los 30 días siguientes", "Semanal: un reporte con los movimientos de la semana, el último día hábil de cada una", "Solo cuando el custodiado lo solicite por escrito, con 5 días hábiles de antelación"]], ["Informe mensual especial del custodio de FIC", "Escrito a la SFC, AMV y junta directiva de la administradora, describiendo eventos que impidieron la labor o implicaron incumplimientos", ["Solo a la SFC cada año, con un resumen de los incumplimientos del ejercicio anterior", "A los inversionistas trimestralmente, con los eventos que afectaron la custodia de los valores y el resultado de las verificaciones realizadas por el custodio", "A la bolsa de valores mensualmente, con las operaciones cumplidas y las pendientes de cumplir"]], ["Anotación en cuenta de valores de un FIC custodiado", "A nombre de la sociedad administradora del FIC, seguido del nombre o identificación del FIC", ["A nombre del custodio, seguido del nombre del FIC, porque este es quien guarda los valores", "A nombre del gerente del FIC, que es el responsable de la gestión del portafolio custodiado", "A nombre de cada inversionista, en proporción a sus participaciones en el fondo de inversión"]]]}]}, {"id": "aaee", "title": "Análisis Económico y Financiero", "code": "AAEE", "sections": [{"name": "Conceptos básicos de economía", "cards": [["Microeconomía vs. macroeconomía", "Micro: comportamiento individual de consumidores y empresas. Macro: actividad económica agregada de un país", ["Micro: la economía de un país entero y sus cuentas fiscales. Macro: el comportamiento de una sola empresa", "Micro: el comportamiento de los mercados financieros. Macro: el de las familias que consumen y ahorran", "Son equivalentes: ambas estudian la actividad económica agregada, pero con periodos de análisis distintos"]], ["Bienes de capital vs. bienes de consumo", "Capital: equipos, máquinas e inmuebles que aumentan la capacidad de producción. Consumo: adquiridos por consumidores para satisfacer necesidades", ["Capital: alimentos y ropa que consumen los hogares. Consumo: máquinas y equipos que usan las empresas", "Capital: bienes que se compran para satisfacer necesidades de los hogares. Consumo: equipos que aumentan la capacidad de producción de las empresas", "Ambos son bienes intermedios que se transforman en el proceso productivo de las empresas de cada sector"]], ["Factores clásicos de producción", "Capital, trabajo y tierra", ["Dinero, precio y mercado", "Oferta, demanda y precio", "Capital, deuda y patrimonio"]], ["Precio nominal vs. precio relativo", "Nominal: unidades de dinero por unidad de bien. Relativo: cuántas unidades de un bien B se dan por una unidad del bien A", ["Nominal: unidades de dinero ajustadas por la inflación del periodo. Relativo: precio de un bien expresado en dólares de un año base", "Nominal: cuántas unidades del bien B se dan por una del A. Relativo: unidades de dinero por unidad", "Son iguales: ambos expresan el precio de un bien en la moneda local del país donde se transa"]], ["Competencia perfecta", "Muchos compradores y vendedores precio-aceptantes, producto homogéneo, información perfecta y libre entrada/salida; beneficios cero a largo plazo (el mercado de divisas se parece)", ["Un solo vendedor controla el mercado, el producto es único y existen barreras altas a la entrada", "Pocos vendedores con producto diferenciado, información parcial, barreras de entrada moderadas y beneficios positivos a largo plazo en el mercado", "El Gobierno fija los precios, hay pocos oferentes y se limita la entrada de nuevos participantes"]], ["Competencia imperfecta: monopolio y oligopolio", "Monopolio: un solo vendedor; oligopolio: pocos vendedores. Producen menos y a mayor precio que en competencia, con pérdida de eficiencia", ["Muchos vendedores con producto homogéneo; producen más y a menor precio que en competencia perfecta", "Producen más y a menores precios que en competencia perfecta, con mejora del bienestar social", "Monopolio: pocos vendedores; oligopolio: un solo vendedor. Producen igual cantidad que en competencia y a un precio similar, sin pérdida de eficiencia"]], ["Ley de la demanda", "Relación inversa entre precio y cantidad demandada (movimiento a lo largo de la curva)", ["Relación directa entre precio y cantidad demandada: al subir el precio aumenta lo que se compra", "No hay relación entre precio y cantidad demandada, porque el consumo depende del gusto del consumidor", "Depende únicamente del ingreso del consumidor: el precio no altera la cantidad que desea comprar"]], ["Ley de la oferta", "Relación directa entre precio y cantidad ofrecida", ["Relación inversa entre precio y cantidad ofrecida: al subir el precio, los productores ofrecen menos", "La oferta no depende del precio, sino únicamente de los costos de los insumos de cada productor", "Solo depende del ingreso de los consumidores, que fijan la cantidad que los productores deben ofrecer"]], ["Equilibrio de mercado", "Precio y cantidad en que cantidad demandada = ofrecida; el mercado se vacía (sin excesos)", ["Precio y cantidad en que el precio es mínimo y la cantidad ofrecida supera a la demandada", "Punto donde existe exceso de demanda y los precios tienden a subir para equilibrar el mercado", "Punto en que la oferta es cero y la demanda se ajusta con el precio máximo que se paga"]], ["Elasticidad-precio de la demanda", "ε = %ΔQd / %ΔP; |ε| > 1 elástica, < 1 inelástica, = 1 unitaria", ["ε = %ΔP / %ΔQd; |ε| > 1 inelástica, < 1 elástica, = 1 unitaria (se invierte el cociente)", "ε = %ΔQd / %ΔP; |ε| > 1 inelástica, < 1 elástica, = 1 unitaria (se invierten las categorías)", "ε = %ΔQd / %ΔP, y su valor siempre es positivo porque la cantidad y el precio varían igual"]], ["Precio sube 2% y cantidad cae 10%: elasticidad", "|ε| = 5 → demanda relativamente elástica", ["0,2 → demanda inelástica, porque la cantidad cae menos que el precio", "5 → inelástica", "1 → unitaria"]], ["Bienes Veblen y Giffen", "Elasticidad-precio positiva: al subir el precio sube la cantidad (Veblen: lujo; Giffen: inferiores sin sustitutos)", ["Bienes normales: la cantidad demandada sube cuando baja el precio y cuando sube el ingreso del consumidor, con elasticidad negativa", "Bienes sustitutos: al subir el precio de uno, aumenta la cantidad demandada del otro bien", "Bienes de capital: la demanda aumenta cuando el precio sube porque mejora la productividad"]], ["Aumento de la demanda (ceteris paribus)", "Sube el precio y la cantidad de equilibrio", ["Baja el precio y sube la cantidad de equilibrio, porque los productores ofrecen más a menor precio", "Sube el precio y baja la cantidad de equilibrio, porque los consumidores compran menos a mayor precio", "No cambia nada: el equilibrio solo se altera cuando se desplazan ambas curvas al mismo tiempo"]], ["Aumento de la oferta (ceteris paribus)", "Baja el precio y sube la cantidad de equilibrio", ["Sube el precio", "Sube el precio y baja la cantidad de equilibrio, porque los productores ofrecen más a mayor precio", "No cambia nada"]], ["Ventaja comparativa vs. ventaja competitiva", "Comparativa (Ricardo, 1817): menor costo relativo de producir un bien. Competitiva (Porter): crear mayor valor mediante especialización, diferenciación y liderazgo en costos", ["Comparativa (Porter): crear valor mediante especialización y diferenciación. Competitiva (Ricardo, 1817): menor costo relativo de producir un bien", "Ambas son de Ricardo (1817): la ventaja competitiva es el menor costo absoluto de producir un bien", "Comparativa: menor costo absoluto de producir. Competitiva: especialización por diferenciación"]], ["OMC (WTO)", "Creada en 1995 para regular el comercio internacional; en 2023 tenía 164 miembros (98% del comercio)", ["Creada en 1944 para regular los pagos internacionales y las divisas; en 2023 tenía 190 miembros", "Creada en 1995 para fijar las tasas de cambio de los países; en 2023 tenía 164 miembros", "Creada en 1995 para regular el comercio internacional; en 2023 tenía 50 miembros (50% del comercio)"]], ["Commodities: categorías (FMI)", "Energía, agricultura, fertilizantes y metales; el índice PCPI incluye 68 commodities", ["Solo petróleo y café, que son los dos principales productos de exportación de Colombia en el índice", "Acciones y bonos, que se negocian en los mercados internacionales y se incluyen en el índice PCPI", "Divisas y derivados, que el FMI agrupa en un índice de 68 contratos para medir los precios"]], ["Alto precio del petróleo y el peso colombiano", "Mayor entrada de dólares → tendencia a apreciación del peso", ["Menor entrada de dólares, lo que genera una tendencia a la devaluación del peso colombiano", "No afecta la tasa de cambio, porque el petróleo se paga en moneda local en las exportaciones", "Solo sube la inflación, sin efecto en la tasa de cambio porque el Banco de la República interviene"]]]}, {"name": "Variables e indicadores macroeconómicos", "cards": [["Variable vs. indicador macroeconómico", "Variable: fenómeno de la economía (ej. inflación). Indicador: técnica para medirlo (ej. IPC o IPP)", ["Son sinónimos: ambos términos designan el fenómeno económico que se quiere medir en el país", "Indicador: el fenómeno de la economía (ej. inflación). Variable: la técnica para medirlo (ej. IPC)", "Solo existen indicadores: las variables macroeconómicas no se pueden definir de manera separada"]], ["PIB: definición", "Valor a precios de mercado de bienes y servicios finales producidos dentro del territorio en un periodo", ["Suma del valor de los bienes intermedios y finales producidos dentro del territorio en un periodo", "Ingreso que reciben los residentes del país por sus inversiones y trabajo en el exterior", "Valor de las exportaciones de bienes y servicios que un país realiza durante un periodo determinado"]], ["Cuatro métodos de cálculo del PIB", "Producto, valor agregado, ingresos de factores y gasto", ["Consumo, ahorro, deuda e inflación, que se suman para calcular el valor de la producción del país", "Oferta, demanda, precio y tasa de interés, que se combinan para hallar el producto de equilibrio", "Solo el método del gasto, porque es el único que se puede calcular a partir de las cuentas nacionales"]], ["PIB por el lado del gasto", "Consumo + inversión + gasto público + exportaciones − importaciones", ["C + I + G + M: consumo más inversión más gasto público más importaciones, sin las exportaciones", "C + G − X: consumo más gasto público menos exportaciones, sin considerar la inversión del sector privado", "I + X + M: inversión más exportaciones más importaciones, sin consumo ni gasto público"]], ["PIB nominal vs. real", "Nominal: a precios corrientes; real: a precios constantes de un año base (descuenta inflación); su variación % es el crecimiento económico", ["Nominal: a precios constantes de un año base. Real: a precios corrientes sin descontar la inflación", "Nominal: descuenta la inflación con un año base. Real: a precios corrientes del periodo; su variación % es el crecimiento económico del país", "Ambos son iguales cuando el año base coincide con el año de cálculo y la inflación es positiva"]], ["Valor agregado", "Ingreso por ventas − costo de bienes intermedios", ["Ingreso por ventas, sin descontar el costo de los bienes intermedios que utilizó la empresa", "Costos totales de producción, incluidos los bienes intermedios, salarios e impuestos de la empresa", "Ventas menos salarios pagados, sin considerar el costo de los bienes intermedios consumidos"]], ["IPC: ¿qué es y quién lo calcula?", "Número índice de precios de la canasta familiar; lo calcula el DANE mensualmente (443 artículos, 12 divisiones, 38 ciudades)", ["Índice de precios al productor de la canasta industrial; lo calcula el DANE trimestralmente en 13 ciudades con 443 artículos agrupados en 12 divisiones", "Número índice de la canasta familiar que calcula el Banco de la República mensualmente en 38 ciudades", "Mide la variación del PIB real de cada trimestre; lo calcula el DANE con 443 artículos y 12 divisiones"]], ["Encuesta que define la canasta del IPC", "Encuesta Nacional de Presupuestos de los Hogares (ENPH), cada 10 años", ["GEIH, la Gran Encuesta Integrada de Hogares, que el DANE aplica cada año para actualizar la canasta", "Encuesta de Opinión del Consumidor, que se realiza cada trimestre con una muestra de 1.200 hogares", "Censo agropecuario nacional, que se aplica cada 10 años y define las ponderaciones de la canasta"]], ["IPP: ¿qué mide?", "Precios de bienes en la primera etapa de comercialización (productor); ponderación: 67% manufactura, 19% minería, 14% agropecuario; excluye servicios; lo calcula el DANE desde 2007", ["Precios al consumidor final de la canasta familiar, con ponderación de 67% servicios y 33% bienes", "Precios de bienes y servicios en la primera etapa de comercialización; incluye servicios y minería sin ponderación y lo calcula el BanRep desde 2007", "Precios de bienes en la segunda etapa de comercialización, con 50% manufactura y 50% agropecuario"]], ["Fórmula de la tasa de inflación", "(IPC t+1 − IPC t) / IPC t × 100", ["IPC t+1 / IPC t, expresado en veces y no en porcentaje", "IPC × 100", "IPC t − IPC t+1"]], ["Canasta pasa de $650.000 a $820.000: inflación", "26,15% (IPC 126,15 con base 100)", ["12,5%", "20,75% (IPC 120,75 con base 100)", "100%"]], ["Deflación", "Disminución sostenida y generalizada del nivel de precios; puede ser peligrosa (caen ingresos y salarios)", ["Aumento sostenido y generalizado del nivel de precios, que reduce el poder adquisitivo de los salarios", "Caída del precio del dólar frente al peso, que abarata las importaciones y reduce la inflación", "Inflación baja pero positiva, que se mantiene por debajo de la meta del Banco de la República"]], ["Hiperinflación (Mankiw)", "Inflación superior al 50% mensual", ["Superior al 10% anual", "Superior al 5% mensual", "Superior al 100% anual solamente"]], ["Estanflación", "Cae el PIB y simultáneamente sube la inflación; el peor escenario macro (desempleo alto)", ["Crece el PIB y baja la inflación al mismo tiempo, el mejor escenario macroeconómico posible", "Deflación con crecimiento del PIB, que reduce el nivel de precios y aumenta los salarios reales", "Inflación alta con pleno empleo, que el Banco de la República corrige subiendo las tasas de interés"]], ["Tasas de captación vs. colocación y margen de intermediación", "Captación: la que pagan a ahorradores; colocación: la que cobran por préstamos; margen = diferencia", ["Captación: la que cobran las entidades en sus préstamos; colocación: la que pagan a los ahorradores", "Margen = captación + colocación: la suma de las dos tasas que fijan las entidades financieras", "Ambas son iguales: el margen de intermediación es cero cuando el mercado es competitivo"]], ["Tasa de usura en Colombia", "Máxima tasa legal de colocación: 1,5 veces el interés bancario corriente certificado por la SFC", ["Máxima tasa legal de colocación: 2 veces el IBR a un mes certificado por el Banco de la República", "Máxima tasa legal de captación: DTF más 5 puntos porcentuales, certificada por la SFC cada mes", "Máxima tasa legal de colocación: 1,5 veces la inflación anual certificada por el DANE cada trimestre"]], ["Tasa de interés real", "r = [(1+i)/(1+π) − 1] × 100", ["r = i − π siempre, restando simplemente la inflación a la tasa nominal", "r = i × π", "r = (1+i)(1+π)"]], ["Nominal 10% e inflación 4%: tasa real", "5,77%", ["6,00%", "14,4%", "4,00%"]], ["Tasa de desocupación", "Población desocupada / población económicamente activa (PEA) × 100; DANE por la GEIH", ["Desocupados / población total × 100; la calcula el DANE con base en la GEIH mensualmente", "Ocupados / población económicamente activa × 100; la calcula el DANE con base en la GEIH", "Informales / ocupados × 100; la calcula el DANE con base en el Censo Nacional de Población"]], ["Demanda agregada (DA)", "DA = C + I + G + X − M = PIB", ["DA = C + I", "DA = G + M", "DA = ahorro + consumo + inversión extranjera neta"]], ["Gasto público en el PIB: exclusiones", "Excluye intereses de deuda y transferencias (son ingreso de los hogares)", ["Incluye las pensiones y demás transferencias, porque son un gasto que realiza el Gobierno cada año", "Incluye los subsidios a hogares y empresas, porque son recursos que el Estado destina a la economía", "Incluye los intereses de la deuda pública, porque son un pago que el Gobierno hace por sus créditos"]], ["Superávit/déficit comercial", "Superávit: exportaciones > importaciones; déficit: exportaciones < importaciones", ["Superávit: importaciones > exportaciones; déficit: importaciones < exportaciones (al contrario)", "Siempre hay equilibrio, porque la balanza comercial se compensa con la cuenta financiera", "Es el resultado del presupuesto del Gobierno: ingresos fiscales menos gastos corrientes y de inversión"]], ["Balance fiscal (ahorro público)", "Sg = T − G − TR (impuestos − gasto − transferencias); positivo = superávit, negativo = déficit", ["Sg = T + G + TR: impuestos más gasto más transferencias; positivo = déficit, negativo = superávit", "Sg = G − T: gasto menos impuestos; positivo = superávit y negativo = déficit del Gobierno", "Sg = X − M: exportaciones menos importaciones; positivo = superávit y negativo = déficit"]], ["Ingresos del PGN", "Corrientes (tributarios: renta, patrimonio, IVA, GMF; y no tributarios) y recursos de capital (excedentes de empresas del Estado, crédito, rendimientos, diferencial cambiario)", ["Solo impuestos de renta, patrimonio, IVA y GMF, porque el crédito y los excedentes de empresas del Estado no se consideran ingresos del Presupuesto General", "Solo recursos de crédito interno y externo, que financian el déficit del Presupuesto General", "Solo regalías de minería e hidrocarburos, que son la principal fuente de ingresos del Estado"]], ["Gastos corrientes vs. de inversión", "Corrientes (80–90% del total): personal, pensiones, intereses, funcionamiento; de inversión: bienes de capital e infraestructura", ["De inversión (80–90% del total): bienes de capital e infraestructura; corrientes: personal, pensiones, intereses y gastos de funcionamiento del Estado", "Corrientes (80–90% del total): bienes de capital e infraestructura; inversión: personal y pensiones", "Son iguales: ambos se ejecutan en proporciones similares y financian los mismos programas del Estado"]], ["Balanza de pagos: saldo", "Siempre cero por partida doble, aunque sus componentes no estén equilibrados", ["Siempre positivo, porque las exportaciones superan a las importaciones en una economía abierta", "Siempre negativo, porque los pagos al exterior son mayores que los ingresos de la economía", "Depende del país: en economías con déficit comercial el saldo es negativo y en las demás positivo"]], ["Cuenta corriente", "Exportaciones e importaciones de bienes y servicios, renta de los factores (ingreso primario) y transferencias (ingreso secundario)", ["Flujos de capital: inversión directa, de portafolio, créditos externos y variación de reservas", "Reservas internacionales y derivados financieros, que se registran por el valor neto de cada operación, junto con la inversión de portafolio y los créditos", "Solo los flujos de inversión extranjera directa y los créditos que obtiene el sector público"]], ["Cuenta financiera", "Inversión directa, de portafolio, créditos externos, derivados y variación de reservas internacionales", ["Remesas, transferencias y renta de factores, que se registran como ingreso secundario del país", "Turismo, fletes y seguros, que se contabilizan como exportaciones e importaciones de servicios", "Exportaciones e importaciones de bienes, que se contabilizan al valor FOB de cada operación"]], ["Riesgo de un déficit alto en cuenta corriente", "Presión a la depreciación de la moneda y riesgo de reducción súbita del financiamiento externo", ["Presión a la apreciación de la moneda y mayor entrada de capitales que financian el déficit", "Reducción de la inflación y aumento de las reservas internacionales del Banco de la República", "Aumento del ahorro externo, que mejora la capacidad de financiación del sector privado"]], ["Tasa de cambio nominal y par de divisas", "Cantidad de moneda nacional por unidad extranjera; en 4.000 USD/COP la moneda base es USD y la cotizada COP", ["Cantidad de moneda extranjera por unidad de moneda nacional; en 4.000 USD/COP la base es COP", "Precio relativo de los bienes locales frente a los extranjeros; en 4.000 USD/COP la moneda base es COP y la cotizada USD en el mercado local", "Siempre se expresa como EUR/USD, que es el par de referencia en el mercado cambiario"]], ["TRM", "Promedio ponderado por monto del precio del dólar en operaciones entre intermediarios, con cumplimiento el mismo día; la calcula y certifica la SFC con transacciones del día hábil anterior", ["Promedio simple de las cotizaciones de las casas de cambio; la calcula el Banco de la República", "Tasa fijada semanalmente por la Junta del Banco de la República para las operaciones de divisas", "Tasa de intervención del Banco de la República, que se usa para las operaciones de mercado abierto y es certificada semanalmente por la Superfinanciera"]], ["Códigos ISO 4217", "USD dólar, EUR euro, COP peso colombiano, CLP peso chileno, CHF franco suizo, GBP libra, ZAR rand, JPY yen, KRW won", ["USD = euro, EUR = dólar, COP = peso chileno, CLP = peso colombiano y GBP = libra esterlina", "USD dólar, EUR euro, COP peso colombiano, CLP peso mexicano, CHF yen, GBP libra, ZAR won", "USD dólar, EUR euro, COP peso colombiano, GBP yen, JPY libra, KRW rand, CHF franco suizo, ZAR peso mexicano, CLP peso argentino"]], ["Tasa de cambio real", "ε = (E × P*) / P: bienes locales por unidad de bien extranjero", ["ε = E + P*: la tasa nominal más el nivel de precios externo, expresado en moneda local", "ε = P / P*: la relación entre precios locales y externos, sin considerar la tasa nominal", "ε = E / P: la tasa de cambio nominal dividida entre el nivel de precios local de los bienes"]], ["Ejemplo: P = 1.500.000 COP/carga café, P* = 75.000 USD/máquina, E = 4.000", "ε = 200 cargas de café por máquina", ["50 cargas", "20 cargas", "2.000 cargas de café por máquina, si se usa la tasa de cambio sin dividir"]], ["Depreciación real vs. apreciación real", "Depreciación real: ε sube (ej. 200→300 cargas); apreciación real: ε baja", ["Depreciación real: ε baja; apreciación real: ε sube (se invierte el sentido de la variación)", "Ambas hacen subir ε, porque la tasa real siempre aumenta cuando cambia la nominal", "No se miden con ε: se miden con la variación de la tasa de cambio nominal frente al dólar"]], ["ITCR", "Índice de la tasa de cambio real que calcula el BanRep con canastas de productos", ["Índice de precios al consumidor que calcula el DANE con canastas de productos de 13 ciudades", "Tasa de intervención del Banco de la República que sirve de referencia para el mercado monetario", "Índice del dólar que calcula la Superfinanciera con las transacciones diarias entre intermediarios"]]]}, {"name": "Mercados financieros y análisis macro", "cards": [["Características de mercados financieros eficientes", "Transparencia, amplitud, profundidad, eficiencia y libertad", ["Oligopolio, opacidad, baja profundidad y restricciones a la entrada de nuevos participantes", "Liquidez y rentabilidad garantizadas, con baja volatilidad y supervisión de la autoridad", "Solo profundidad: un gran número de órdenes de compra y venta a distintos niveles de precio"]], ["Mercado primario vs. secundario", "Primario: se negocia por primera vez la emisión; secundario: renegociación de títulos ya emitidos", ["Primario: se revenden los títulos ya emitidos; secundario: se negocian por primera vez las emisiones", "Secundario: la emisión inicial de los títulos; primario: renegociación de los ya existentes", "Son lo mismo: ambos designan la negociación de valores en la bolsa durante el mismo día"]], ["Mercado monetario", "Activos de corto plazo (< 1 año): CDT, créditos de tesorería, papeles comerciales, repos, aceptaciones; bajo riesgo y mayor liquidez", ["Activos de largo plazo, con vencimientos superiores a cinco años, como bonos y acciones", "Solo acciones, que representan una participación en el capital de las sociedades emisoras", "Derivados exóticos, que se negocian de forma bilateral y tienen riesgo alto y poca liquidez, con vencimientos de corto plazo y subyacentes no estandarizados"]], ["Mercado interbancario", "Entidades financieras se prestan a muy corto plazo; el IBR es su tasa de referencia", ["Mercado de deuda pública de largo plazo, donde el Gobierno coloca sus TES con vencimiento mayor", "Mercado de divisas, donde los bancos compran y venden dólares a la tasa de cambio del día", "Mercado de acciones, donde las entidades financieras compran títulos de renta variable entre sí"]], ["Mercado de capitales", "Activos de largo plazo (> 1 año): deuda (bonos) y participación (acciones); segmentos intermediado y no intermediado (mercado público de valores)", ["Activos de corto plazo (< 1 año): CDT, papeles comerciales y repos, con bajo riesgo, alta liquidez y negociación en los sistemas del mercado monetario", "Solo acciones, que se negocian en bolsa en el segmento intermediado a través de comisionistas", "Solo el segmento intermediado, donde las entidades financieras captan y colocan recursos"]], ["Mercado cambiario: características", "Mayor volumen mundial, descentralizado (sin cámara central) y con participantes diversos; en Colombia opera a través de intermediarios autorizados por el BanRep", ["Centralizado en una cámara que compensa todas las operaciones, con participación solo de bancos centrales y entidades autorizadas por el regulador local", "De poco volumen mundial, con pocos participantes y operaciones cerradas en una bolsa organizada", "Opera solo entre bancos centrales, que fijan la tasa de cambio con subastas periódicas de divisas"]], ["Indicadores coincidentes", "Varían al ritmo de la economía: producción industrial, manufactura, balanza comercial, ingresos personales", ["Anticipan los movimientos del PIB, como los índices bursátiles, las licencias de construcción y la confianza del consumidor en cada periodo", "Confirman los ciclos económicos una vez estos han ocurrido, como el desempleo y la inflación", "Son rezagados: varían después de la economía, como los salarios y las tasas de interés"]], ["Indicadores adelantados", "Se conocen antes del PIB y anticipan tendencias: índices bursátiles, licencias de construcción, consumo de energía, confianza del consumidor, ventas de autos", ["Desempleo e inflación, que se conocen antes que el PIB y anticipan la tendencia de la economía", "Producción industrial y balanza comercial, que se mueven al mismo ritmo que la economía", "El PIB trimestral, que se conoce antes que el resto de variables y anticipa la tendencia del ciclo, junto con la producción industrial y las exportaciones"]], ["Indicadores rezagados", "Confirman los ciclos: PIB, salarios, desempleo, inflación, tasas de interés, utilidades", ["Licencias de construcción y ventas de autos, que se conocen antes y anticipan la tendencia", "Confianza del consumidor e índices bursátiles, que anticipan los cambios de ciclo económico", "Producción industrial y manufactura, que varían al ritmo de la economía en cada periodo"]], ["Ley de Okun", "Relación inversa entre el crecimiento del PIB y el desempleo", ["Relación directa entre el crecimiento del PIB y el desempleo: si el PIB sube, también sube el desempleo", "Relación inversa entre la inflación y las tasas de interés de política que fija el Banco Central", "Relación directa entre la oferta y la demanda de bienes en cada uno de los mercados"]], ["Curva de Phillips", "Relación inversa entre desempleo e inflación", ["Relación directa entre desempleo e inflación: cuando sube el desempleo, sube también la inflación", "Relación inversa entre el PIB y la tasa de cambio real del país frente a sus socios comerciales", "Relación entre las tasas de interés de los bonos y los precios en el mercado de deuda pública"]], ["Ciclo económico", "Expansión → auge → recesión → depresión/recuperación; en el auge hay DA alta, desempleo bajo e inflación al alza", ["Solo crecimiento sostenido: el ciclo económico no incluye fases de caída de la producción", "Solo recesión: la producción cae de forma continua y el desempleo sube de forma permanente", "Sin fases definidas: el ciclo cambia de forma aleatoria sin patrones de demanda ni inflación y no se puede asociar con el nivel de empleo ni con el crédito"]], ["Variables procíclicas vs. contracíclicas", "Procíclicas siguen el ciclo (ventas de autos); contracíclicas van en sentido contrario (desempleo, bienes inferiores)", ["Procíclicas van en sentido contrario al ciclo (desempleo, bienes inferiores); contracíclicas lo siguen (ventas de autos y de bienes de lujo)", "Ambas siguen el ciclo, pero las contracíclicas lo hacen con un rezago de varios trimestres", "Ninguna depende del ciclo: su comportamiento lo determinan solo factores de oferta de largo plazo"]], ["Relación precio de bono y tasa de interés", "Inversa: si la tasa baja, el precio del bono sube (ej. VF 100: 89,29 a tales, que buscan mejores rentabilidades en el exterior, y devaluación del peso"]], ["Paridad de tasas de interés", "Al inversionista le es indiferente invertir local o en el exterior (rentabilidades iguales en moneda local)", ["Las tasas de interés son iguales en todos los países, sin importar la tasa de cambio esperada", "Aumento de las reservas internacionales cuando el capital externo ingresa a un país con tasas altas", "Arbitraje cambiario: ganancia sin riesgo por comprar divisas baratas en un mercado y venderlas en otro"]]]}, {"name": "Políticas macro y autoridades", "cards": [["Política monetaria: objetivo y niveles", "Regular liquidez para controlar inflación; objetivo operativo: tasa de intervención; intermedio: cantidad de dinero y expectativas; largo plazo: estabilidad de precios", ["Solo regular la tasa de cambio, con la meta de mantener la moneda estable frente al dólar", "Maximizar el PIB y el empleo, con la tasa de intervención como único instrumento de largo plazo y la cantidad de dinero como objetivo operativo", "Fijar los impuestos y el gasto público para controlar la demanda agregada y la inflación"]], ["Meta de inflación en Colombia", "3% anual con margen de ±1 punto porcentual", ["2% anual con margen de ±1 punto porcentual, definida por la Junta del Banco de la República", "5% anual con margen de ±2 puntos porcentuales, definida por el Ministerio de Hacienda", "4% anual fija, sin margen, definida cada año por el Congreso en el Plan Nacional de Desarrollo"]], ["Teoría cuantitativa del dinero", "MV = PY; en variaciones ΔM + ΔV = ΔP + ΔY", ["M + V = P + Y; en variaciones ΔM + ΔV = ΔP + ΔY (la suma de los componentes)", "MP = VY; en variaciones ΔM + ΔP = ΔV + ΔY (se intercambian los pares de variables)", "M = P + Y; en variaciones ΔM = ΔP + ΔY (se elimina la velocidad de circulación del dinero)"]], ["M crece 10% y PIB real 3% (V constante): inflación esperada", "7%", ["13%", "3%", "10%"]], ["Política monetaria expansiva", "Aumenta oferta monetaria,
