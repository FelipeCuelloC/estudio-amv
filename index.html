se cierran a tasas de mercado y se compensan en el DCV, y operaciones de contado de bajo monto en el sistema"]], ["Estabilización de precios legítima", "No es infracción (contratos de liquidez, formadores de liquidez, adjudicación adicional con TTV)", ["Siempre es infracción: toda intervención sobre el precio de un valor se considera manipulación", "Solo es válida con autorización previa de la SFC, que la otorga caso por caso al emisor", "Está prohibida: ni siquiera el formador de liquidez puede actuar para estabilizar el precio"]], ["Elementos para distinguir manipulación", "Conducta, dolo o intención, motivación y efecto artificial en el mercado", ["Solo el precio: si cambia, hay manipulación, sin importar la intención del operador", "Solo el volumen: si supera el promedio del día, se presume la manipulación de la cotización", "Solo la hora de la operación: las ejecutadas al cierre del mercado se consideran manipulativas"]], ["Delito de manipulación fraudulenta (art. 317 CP)", "Prisión de 32 a 108 meses y multa hasta 50.000 SMMLV", ["Prisión de 1 a 3 años y multa de hasta 500 SMMLV, sin consideración al efecto en el precio", "Prisión de 10 a 30 años y multa de 1.000 a 50.000 SMMLV, igual que el lavado de activos", "Sin pena privativa de libertad: la conducta solo da lugar a sanciones administrativas y de AMV"]], ["Defraudación (art. 49.1)", "Obtener provecho indebido para sí o un tercero, afectando a un tercero o al mercado, en actividades de intermediación; ej. churning", ["Cualquier ganancia que obtenga el intermediario, sin importar si afecta a un tercero o al mercado, siempre que se haya obtenido con operaciones por cuenta propia", "Solo cobrar comisión por una operación, aunque el cliente la haya autorizado e informado", "Operar con la autorización del cliente, aun cuando se obtenga una ventaja excesiva para sí"]], ["Churning", "Operaciones excesivas por cuenta del cliente para generar comisiones/márgenes", ["Cobertura de riesgos con derivados, para proteger el valor del portafolio frente al mercado", "Operación cruzada en que el mismo operador compra y vende un valor entre dos clientes", "Arbitraje entre mercados, que aprovecha diferencias de precio de un mismo valor para obtener ganancia"]], ["Abuso de derechos (art. 49.3)", "Operaciones con apariencia de legalidad que agravian intereses protegidos, o ejercer un derecho sin interés legítimo", ["Operaciones normales de mercado realizadas con transparencia y a precios razonables", "Operaciones cruzadas entre clientes que se informan previamente a la bolsa y a la SFC", "Registro tardío de operaciones OTC, que se corrige con una carta al administrador del sistema, y el incumplimiento de deberes formales de información"]], ["Operaciones cruzadas en renta variable", "Permitidas salvo cuando se omite informar a la SFC y bolsa con 1 mes (acuerdo previo de clientes), o dos comisionistas por cuenta propia pactan la operación, o mismo beneficiario real sin informar 5 días antes", ["Siempre prohibidas, porque el mismo beneficiario real no puede estar en ambos lados de la operación, aunque se informe previamente a la SFC y a la bolsa", "Siempre permitidas, sin ningún requisito, cuando las partes son clientes del mismo intermediario", "Solo permitidas para fondos de inversión, que pueden cruzar operaciones entre portafolios propios"]], ["Prácticas inseguras y no autorizadas (ejemplos)", "Usar activos de clientes para operaciones de otros, ofrecer rentabilidad garantizada, que un tercero asuma riesgos de cuenta propia, ejercer cargos sin posesión ante la SFC", ["Publicar las tarifas y los medios de contacto de la entidad para que los clientes los conozcan", "Registrar las operaciones en el sistema de negociación el mismo día y mantener las grabaciones", "Valorar los portafolios con el precio del proveedor autorizado y conservar el soporte del cálculo, junto con la separación de los activos de los clientes"]], ["Exceso de mandato", "Actuar fuera de instrucciones o facultades (ej. operar sin orden del cliente); el buen resultado no lo justifica", ["Está permitido si la operación genera ganancias al cliente, porque lo importante es el resultado", "Es una forma de mejor ejecución, en la que el operador busca el precio más favorable al cliente", "Solo es una falta leve, que se subsana pidiendo al cliente la ratificación posterior de la operación, siempre que la operación genere ganancias para el cliente"]], ["Uso indebido de recursos del cliente (art. 1271 C.Co.)", "El mandatario no puede emplear los fondos en negocios propios ni darles destino distinto; debe pagar interés legal e indemnizar", ["Puede usarlos temporalmente en negocios propios, siempre que los devuelva con rendimientos", "Solo con autorización verbal del cliente, que debe constar luego en el extracto de la cuenta, y siempre que el mandatario devuelva los fondos en 30 días", "No hay sanción: el mandatario responde únicamente cuando el cliente demuestra el perjuicio"]], ["Ejercicio indebido de cargo", "Actuar sin certificación o inscripción en el RNPMV, o estando suspendido o expulsado", ["Operar con la certificación vigente y la inscripción en el RNPMV, pero sin informar al intermediario", "Actuar con un permiso verbal del jefe, aunque la certificación esté vencida o en trámite", "Tener dos cargos en la misma entidad, aunque cuente con la certificación de cada uno"]], ["Investigaciones económicas (art. 50)", "Deben revelar vínculos con el emisor, si actúa como colocador y las inversiones en los valores; leyenda de que no es recomendación profesional", ["No requieren revelaciones: los informes de investigación son opiniones generales del analista, que no tienen que advertir vínculos ni inversiones propias en los valores", "Son recomendaciones profesionales siempre, y deben cumplir las reglas de la asesoría", "Solo aplica a las entidades vigiladas por la SFC; las demás pueden omitir los vínculos"]], ["Sanos usos y prácticas (art. 46)", "Responsabilidad por comentarios públicos, política de información personal, no ingreso de terceros a mesas, grabación de comunicaciones sincronizadas con la hora oficial", ["Libre ingreso de terceros a las mesas de negociación, siempre que estén acompañados de un operador, y grabación de las comunicaciones solo cuando el cliente lo solicite", "Sin grabación de las comunicaciones: basta con los registros escritos de cada una de las órdenes", "Cada operador usa la hora de su equipo, porque no se exige sincronización con la hora oficial"]], ["Delito de lavado de activos (art. 323 CP)", "Prisión de 10 a 30 años y multa de 1.000 a 50.000 SMMLV", ["Prisión de 1 a 3 años y multa de 5 a 50 SMMLV, igual que la información privilegiada", "Prisión de 32 a 108 meses y multa hasta 50.000 SMMLV, igual que la manipulación fraudulenta", "Prisión de 5 años y multa de 100 SMMLV, que se reduce si el infractor colabora con la justicia"]], ["SARLAFT", "Sistema de administración del riesgo de lavado de activos y financiación del terrorismo (arts. 102 y ss. EOSF); incumplirlo es infracción (lit. s Ley 964)", ["Sistema de pagos que compensa y liquida las operaciones cerradas en los sistemas de negociación", "Sistema de custodia y administración de los valores de los clientes del intermediario", "Sistema contable para el registro de las operaciones propias y de terceros, con la valoración diaria de los valores, regulado por los arts. 102 y ss. del EOSF"]], ["Delito de pánico económico (art. 302 CP)", "Divulgar información falsa o inexacta que afecte la confianza en entidades vigiladas o esquemas de inversión colectiva: prisión de 32 a 144 meses", ["Es solo una falta disciplinaria que sanciona AMV con multa o suspensión de la persona", "Solo lo comete un empleado de la entidad vigilada, nunca un tercero ajeno a ella", "Requiere que se produzca el resultado, es decir, que se cause una pérdida a los inversionistas, y su pena es de prisión de 1 a 3 años y multa de 5 a 50 SMMLV"]], ["Estafa (art. 246) vs. abuso de confianza (art. 249)", "Estafa: provecho ilícito induciendo a error con artificios o engaños; abuso de confianza: apropiarse de un bien entregado voluntariamente por un título no traslativo de dominio", ["Son iguales: ambas consisten en el engaño para obtener un provecho patrimonial ilícito", "Estafa: apropiarse de lo confiado voluntariamente por un título no traslativo de dominio; abuso de confianza: inducir a error con artificios o engaños para obtener provecho", "Abuso de confianza: inducir a error con artificios; estafa: apropiarse de un bien entregado"]], ["Hurto vs. abuso de confianza", "Hurto: se apropia contra la voluntad del dueño; abuso de confianza: el bien se entregó voluntariamente para un fin específico", ["Son iguales: en ambos delitos la persona se apropia de un bien ajeno sin que medie engaño", "Hurto: apropiarse de un bien entregado voluntariamente; abuso de confianza: contra la voluntad", "Abuso de confianza: la apropiación se hace contra la voluntad del dueño; hurto: el bien se entregó por el dueño para un fin específico y se destina a otro"]]]}]}, {"id": "remv", "title": "Reglamentación del Mercado de Valores", "code": "REMV", "sections": [{"name": "Conceptos generales: valor, oferta y emisores", "cards": [["Definición de valor (art. 2 Ley 964/2005)", "Todo derecho de naturaleza negociable que haga parte de una emisión, cuando tenga como objeto o efecto la captación de recursos del público", ["Todo contrato mercantil que tenga por objeto la transferencia de bienes, sea o no negociable", "Todo título valor regulado por el Código de Comercio, con o sin captación de recursos del público, y que se transfiera mediante endoso o entrega de documento", "Cualquier inversión de naturaleza financiera que un inversionista realice con recursos propios"]], ["Características de un valor", "Derecho negociable, parte de una emisión y captación de recursos del público", ["Solo ser negociable, sin importar si hace parte de una emisión ni si capta recursos del público", "Solo captar recursos del público, aunque el derecho no sea negociable ni forme parte de una emisión", "Ser una acción, que es el único derecho que la ley considera valor en el mercado colombiano"]], ["¿Se consideran valores las pólizas de seguros y títulos de capitalización?", "No", ["Sí, siempre", "Solo si se negocian", "Solo en bolsa"]], ["Derivados como valores", "Son valores si son estandarizados y negociables en bolsa u otro sistema; solo se ofrecen si están inscritos en el RNVE", ["Todos los derivados son valores, aunque no sean estandarizados ni se negocien en un sistema", "Ningún derivado es valor: son contratos que se regulan por el Código de Comercio", "Solo los derivados OTC, que se pactan bilateralmente y se registran en un sistema de registro, y que deben inscribirse previamente en el RNVE para ofrecerse"]], ["Valores de financiación colaborativa (crowdfunding)", "Emitidos solo por entidades autorizadas (SOFICO, bolsas, sistemas de negociación/registro); no son oferta pública ni se inscriben en el RNVE; su negociación no es intermediación", ["Se ofrecen mediante oferta pública inscrita en el RNVE y se negocian en el mercado principal", "Los emite cualquier empresa que lo desee, sin necesidad de entidad autorizada que los intermedie", "Se inscriben en el RNVE y se negocian en el mercado principal con las reglas de la oferta pública, y su negociación se considera una actividad de intermediación"]], ["Aportantes calificados en crowdfunding (ejemplos)", "Personas jurídicas vigiladas por la SFC, con patrimonio ≥ 263.130,20 UVT, portafolio ≥ 131.565,10 UVT, o certificación de operador, organismos financieros extranjeros o multilaterales", ["Cualquier persona natural que tenga interés en financiar proyectos y cuente con ahorros disponibles, siempre que lo declare ante la entidad que administra la plataforma", "Solo bancos y entidades financieras vigiladas por la SFC, sin importar su patrimonio", "Solo inversionistas extranjeros, que cuenten con una certificación de su país de origen"]], ["Clasificación por forma de transferencia", "Nominativos (inscripción en el registro del emisor), a la orden (endoso y entrega) y al portador (entrega)", ["Públicos y privados, según la naturaleza jurídica de la entidad que emite cada valor", "Mercantiles y civiles, según la clase de contrato de que se derive el valor negociado y la naturaleza jurídica de la entidad que lo emite en el mercado", "Mercantiles y financieros, según el sector de la economía del emisor que los coloca"]], ["Clasificación por derecho que incorporan", "De deuda, de participación y de tradición o representativos de mercancías", ["De capital, de ahorro y de consumo, según el destino de los recursos captados por el emisor", "Fijos y variables, según el flujo de rendimientos que reciba el inversionista durante el plazo", "Locales y externos, según el mercado en el que se emitan y se negocien los valores"]], ["Renta fija vs. renta variable", "Renta fija: flujo regular y predeterminado (fija o variable por indicador); renta variable: depende del desempeño o cotización", ["Renta fija: su flujo sube y baja con el mercado; renta variable: tiene un flujo regular predeterminado, sin depender del desempeño ni de la cotización del valor", "Renta variable: flujo fijo y conocido desde la emisión; renta fija: depende de su cotización", "Son iguales: en ambas el rendimiento depende de la cotización del valor en el mercado secundario"]], ["Actividades del mercado de valores (art. 3)", "Emisión y oferta, intermediación, administración de fondos, depósito y administración, administración de sistemas de negociación/registro, compensación y liquidación, asesoría, calificación, autorregulación y suministro de información", ["Solo intermediación y custodia, que son las dos actividades que supervisa la SFC en el mercado", "Solo emisión y oferta de valores, porque las demás actividades son auxiliares del emisor", "Solo calificación de valores y suministro de información, que son las actividades de apoyo al mercado, junto con la emisión y la oferta de valores en el exterior"]], ["¿Qué actividades pueden hacerse desde el exterior?", "Emisión y oferta de valores y suministro de información; las demás solo por entidades constituidas en Colombia", ["Todas las actividades pueden hacerse desde el exterior, siempre que se informe a la SFC y la entidad extranjera cuente con autorización de su supervisor local", "Ninguna: todas deben realizarse por entidades constituidas y domiciliadas en Colombia", "Solo la intermediación de valores, que se ejerce con entidades extranjeras autorizadas"]], ["Oferta pública de valores (OPV)", "Dirigida a 100 o más personas determinadas o a personas no determinadas, para valores emitidos en serie o masa", ["Dirigida a 10 o más personas determinadas, para valores emitidos en serie o masa", "Dirigida a 50 o más personas determinadas, para valores emitidos en serie o masa", "Dirigida a un solo inversionista determinado, para valores emitidos en serie o masa, o a menos de 100 personas determinadas, según el monto de la emisión"]], ["Ofertas que NO son públicas (ejemplos)", "Acciones o BOCEAS a accionistas (menos de 500 destinatarios), capitalización ordenada por autoridad, programas de beneficios a empleados, emisiones de crowdfunding", ["Ofertas de bonos dirigidas al público en general, inscritos en el RNVE y negociados en bolsa, a más de 100 personas determinadas, para valores en serie", "Ofertas de TES hechas por el Ministerio de Hacienda en subasta a los creadores de mercado", "Ofertas de participaciones de FIC abiertos que realizan las sociedades administradoras"]], ["Oferta pública en mercado secundario", "Solo a personas no determinadas y sin condiciones adicionales (ej. cantidad mínima o máxima); trámites especiales: OPA y democratización", ["Dirigida a personas determinadas, con cantidad mínima o máxima de compra por inversionista, y sujeta a la aprobación de la SFC en cada oferta que se realice", "Con una cantidad mínima y una máxima, definidas por el oferente de acuerdo con su interés", "No existen: en el mercado secundario las ofertas son siempre privadas entre inversionistas"]], ["Compraventa de acciones ≥ 66.000 UVR", "Debe hacerse en los sistemas transaccionales de la bolsa, salvo excepciones (mismo beneficiario real, readquisición, enajenaciones de la Nación o Fogafín, etc.)", ["Puede hacerse OTC, con registro posterior en un sistema de registro de operaciones", "Siempre en bolsa, sin ninguna excepción, aun cuando el beneficiario real de las acciones sea el mismo, o la enajenación la realicen la Nación o Fogafín", "No hay regla: las partes pueden pactar libremente el lugar de negociación de las acciones"]], ["Emisor (normativo)", "Quien tiene valores inscritos en el RNVE; si hará oferta pública o negociará en un sistema, debe inscribirse con la emisión", ["Quien vende acciones en la bolsa y recibe el dinero de los inversionistas compradores", "Quien invierte en valores inscritos en el RNVE y recibe los rendimientos del emisor", "El intermediario que coloca los valores y responde por su calidad ante los inversionistas, así como la persona que los adquiere en el mercado secundario"]], ["¿La inscripción en el RNVE implica calificación o aval de la SFC?", "No: no implica calificación ni responsabilidad de la SFC sobre el precio, la bondad del valor ni la solvencia del emisor", ["Sí: es un aval de la SFC sobre la calidad del valor y la solvencia del emisor", "Garantiza el pago de las obligaciones del emisor, porque la SFC supervisa su cumplimiento, y certifica la solvencia y el precio justo del valor ofrecido", "Garantiza la liquidez del valor, porque la inscripción asegura que se negocie en bolsa"]], ["Prospecto de información", "Contiene datos del emisor, el valor, la emisión y la oferta; debe estar en la web del emisor, de la SFC y del sistema de negociación", ["Documento interno del emisor que solo se entrega a la SFC al solicitar la autorización de la oferta, y que no se publica en la página web de nadie más", "Documento exclusivo de la SFC, que lo usa para verificar el cumplimiento de requisitos del emisor", "Es opcional: el emisor decide si lo elabora y lo publica antes de ofrecer los valores"]], ["Información material", "La que tendría en cuenta un inversionista prudente y diligente al comprar, vender o conservar valores o ejercer derechos políticos", ["Cualquier información que el emisor decida divulgar al mercado en sus comunicados", "Solo información financiera de los estados financieros auditados del emisor al cierre de cada ejercicio, sin considerar los hechos que afecten sus derechos políticos", "Solo información contable, que se refleja en los resultados y en el balance del emisor"]]]}, {"name": "Tipos de valores", "cards": [["Acción ordinaria", "Derechos económicos (dividendos, cuota de liquidación) y políticos (voto, asambleas, inspección de libros)", ["Derechos económicos, sin voto en las asambleas ni derecho de inspección sobre los libros de la sociedad", "Derechos de la ordinaria más un privilegio económico, como prioridad en dividendos o reembolso", "Solo derecho a dividendos, sin derecho a cuota de liquidación ni a participar en las asambleas"]], ["Acción privilegiada", "Derechos de la ordinaria más un privilegio económico, p.ej. prioridad en dividendos o en el reembolso del capital", ["Sin derechos económicos ni políticos: su titular solo recibe el valor nominal al liquidarse la sociedad", "Derecho al voto en las asambleas, pero sin derecho a recibir dividendos por las utilidades", "Sin derecho a voto y sin privilegio económico: solo recibe los dividendos que decrete la asamblea"]], ["Acción preferencial sin derecho a voto", "Prioridad en pago de dividendos y en reembolso del capital, sin voto", ["Con derecho a voto en las asambleas, además de la prioridad en dividendos y en el reembolso", "Sin derecho a dividendos: el único beneficio es la prioridad en el reembolso del capital", "Sin reembolso preferente: su único privilegio es el voto cuando se decretan los dividendos"]], ["Derecho de preferencia", "Los accionistas pueden suscribir acciones nuevas en proporción a su participación; no opera en la negociación de acciones inscritas en bolsa", ["Aplica en la negociación de acciones inscritas en bolsa, donde el vendedor debe ofrecerlas primero a los demás accionistas, en proporción a su participación", "Es obligatorio comprar las acciones nuevas en proporción a la participación que se tenga", "No existe: la ley colombiana no reconoce a los accionistas un derecho de suscripción preferente"]], ["Periodo exdividendo", "Entre el primer día hábil de pago y los 4 días hábiles bursátiles anteriores: quien compra no recibe el dividendo pendiente (es del vendedor)", ["10 días hábiles anteriores al pago: quien compra en ese periodo recibe el dividendo de todos modos, porque la titularidad se transfiere al cierre de la operación", "Periodo en que el comprador siempre recibe el dividendo, sin importar la fecha de negociación", "El mes anterior al pago del dividendo, en el cual no se pueden negociar las acciones del emisor"]], ["CDT", "Título valor nominativo (art. 1393 C.Co.) que representa un depósito a plazo; no redimible antes del vencimiento; si no se redime, se prorroga por igual término", ["Se redime en cualquier momento, por solicitud del titular, sin penalidad ni descuento alguno", "Es al portador: se transfiere con la sola entrega del documento a un nuevo inversionista", "Lo emiten las fiduciarias para captar recursos de los inversionistas con plazos de uno a cinco años, y se negocian al portador en el mercado mostrador"]], ["Bonos: plazo y tipos", "Valores de deuda con plazo mínimo de 1 año; con cupones periódicos o cupón cero; el emisor en mora no puede pagar dividendos", ["Valores de deuda con plazo menor a un año, con cupones periódicos o cupón cero", "Valores sin interés que se pagan al vencimiento por su valor nominal y sin ninguna rentabilidad", "Valores que se pagan al final siempre: no admiten cupones periódicos y el emisor en mora puede pagar dividendos, con plazo mínimo de 90 días desde la emisión"]], ["Monto mínimo de una emisión de bonos", "52.626,04 UVT (convertir a UVB desde 2024; UVB 2024 = $10.951)", ["10.000 UVT por emisión, que debe colocarse en un solo tramo ante el público", "1.000 SMMLV por emisión, que debe colocarse en un solo tramo ante inversionistas", "No hay mínimo: el emisor define el monto libremente al presentar el prospecto a la SFC"]], ["Representante legal de tenedores de bonos", "Obligatorio; solo bancos, corporaciones financieras y fiduciarias autorizadas; lo paga el emisor y lo designa la asamblea de tenedores o el emisor inicialmente", ["Es opcional: el emisor puede asumir la representación de los tenedores en las asambleas, siempre que lo apruebe la SFC y sea una entidad vigilada por ella", "Lo paga el inversionista de forma proporcional a su tenencia y lo designa la SFC", "Puede ser una persona natural con experiencia en el mercado, designada por el emisor"]], ["Bonos convertibles en acciones", "Obligatoriamente convertibles (BOCEAS) y facultativamente convertibles; el emisor debe tener acciones en reserva; no se colocan por debajo del valor nominal", ["No pueden colocarse a la par: siempre deben colocarse con descuento sobre su valor nominal, y el emisor no necesita tener acciones en reserva para convertirlos", "No requieren acciones en reserva: la conversión se atiende con una emisión posterior", "Solo facultativos: la regulación no admite los obligatoriamente convertibles en acciones"]], ["Bonos hipotecarios", "Ley 546/1999; emitidos por establecimientos de crédito, respaldados por créditos hipotecarios pero obligación personal del emisor; los estructurados respaldan créditos ya creados", ["Emitidos por MinHacienda para financiar el presupuesto de vivienda; los respalda el Gobierno", "Sin respaldo: son valores que solo respaldan la solvencia general del emisor y no tienen garantía, ni créditos hipotecarios que los respalden en el patrimonio", "Los paga directamente el deudor hipotecario, sin que el emisor responda por las obligaciones"]], ["Bonos de riesgo", "Emitidos por empresas en acuerdos de reestructuración (Decreto 1074/2015); pueden convertirse en acciones; no requieren representante de tenedores", ["Requieren representante de tenedores, que debe ser un banco, una corporación o una fiduciaria", "No se pueden convertir en acciones, porque su objeto es solo financiar la reestructuración", "Solo se emiten y negocian en bolsa, con calificación mínima de AA por una calificadora de riesgo, y deben contar con representante legal de los tenedores"]], ["Papeles comerciales", "Pagarés ofrecidos públicamente; plazo > 15 días y < 1 año; monto mínimo 52.626 UVT; emisión única o rotativa (máx. 2 años); no financian actividades propias ni adquisición de acciones", ["Pagarés con plazo superior a un año; monto mínimo 52.626 UVT; emisión única o rotativa", "Pagarés sin monto mínimo; plazo de hasta 15 días; emisión rotativa sin límite de tiempo", "Pagarés con plazo mayor a 15 días; emisión rotativa sin límite de tiempo; financian la actividad del emisor y la adquisición de acciones de otras sociedades"]], ["Aceptaciones bancarias", "Un banco garantiza el pago de una letra de cambio derivada de operaciones de comercio; plazo máximo 1 año", ["Un banco garantiza una letra de cambio con plazo máximo de 5 años de comercio exterior", "Títulos de pensiones que emiten los bancos para financiar las obligaciones de sus empleados y de los pensionados, con plazo de cinco años desde su emisión", "Valores de deuda pública que emite el Banco de la República para regular la liquidez"]], ["TES", "Títulos de deuda pública (Ley 51/1990), a la orden; emitidos por MinHacienda y administrados por el BanRep; clases A y B", ["Títulos de deuda pública emitidos por el Banco de la República y administrados por MinHacienda, a la orden, en pesos, UVR o dólares, con cupones semestrales", "Títulos al portador de deuda pública (Ley 51/1990), emitidos por MinHacienda en pesos o UVR", "Títulos de deuda emitidos solo en dólares por MinHacienda y administrados por el BanRep"]], ["Titularización: partes", "Originadora, agente de manejo, colocadora y administradora", ["Emisor e inversionista, que acuerdan las condiciones del valor titularizado y su forma de pago", "Solo la fiduciaria, que actúa como originadora, administradora y colocadora de los valores", "Banco y bolsa, que estructuran y negocian los valores sobre los activos del originador"]], ["Modalidades de títulos de titularización", "Valores de participación, de contenido crediticio y mixtos", ["Solo de contenido crediticio, que dan derecho al pago de capital e intereses sobre los activos", "Solo de participación, que dan derecho a las utilidades generadas por el patrimonio autónomo", "Bonos y acciones, que se emiten a nombre del originador con respaldo en el patrimonio autónomo"]], ["Activos titularizables", "Inmobiliarios, títulos de deuda y valores inscritos, productos agropecuarios y flujos de dinero (cartera, rentas futuras)", ["Solo cartera de crédito de las entidades financieras, que se transfiere a un patrimonio autónomo", "Solo inmuebles, que se aportan a un patrimonio autónomo que emite valores respaldados", "Solo acciones inscritas en el RNVE, que se transfieren a un patrimonio autónomo para emitir valores, sin incluir cartera ni inmuebles ni flujos futuros"]], ["Normas de titularización hipotecaria y no hipotecaria", "Hipotecaria: Ley 546/1999; no hipotecaria: art. 72 Ley 1328/2009 (modificado por art. 169 Ley 1753/2015)", ["Ley 964 de 2005 para ambas modalidades, que regula las actividades del mercado de valores, y la Ley 100 de 1993 para la titularización de cartera pensional", "Decreto 1074 de 2015 para ambas, que reglamenta la titularización de cartera hipotecaria", "Ley 100 de 1993 para la hipotecaria y la Ley 546 de 1999 para la no hipotecaria"]], ["Certificado de depósito de mercancías y bono de prenda", "CDM: título expedido por un almacén general de depósito que representa mercancía; bono de prenda: da calidad de acreedor prendario sobre mercancías (≤70% del CDM, vigencia ≤ término del depósito)", ["CDM: lo emite un banco y representa mercancía; bono de prenda: sin límite frente al CDM", "Son lo mismo: el CDM y el bono de prenda dan al tenedor la propiedad de la mercancía", "CDM: da calidad de acreedor prendario sobre las mercancías; bono de prenda: representa la mercancía depositada en un almacén general de depósito"]]]}, {"name": "Clasificación del mercado, sistemas y compensación", "cards": [["Mercado mostrador (OTC) vs. mercados organizados", "OTC: fuera de sistemas de negociación, reglas bilaterales, información restringida. Organizados: multilaterales, ciegos, información oportuna (MEC y SEN)", ["OTC es multilateral y ciego, con información pública; los organizados son bilaterales y reservados", "Organizados: bilaterales, no ciegos y con información restringida; OTC: multilaterales y ciegos", "OTC es transparente, con información oportuna para todos; los organizados tienen información reservada, reglas bilaterales y precios que se pactan entre las partes"]], ["Mercado primario vs. secundario", "Primario: valores adquiridos directamente del emisor por primera vez; secundario: entre inversionistas sobre valores ya emitidos", ["Primario: entre inversionistas con valores ya emitidos; secundario: directamente del emisor", "Ambos son entre inversionistas: la diferencia es el tipo de valores que se negocian en cada uno, pues el primario solo admite renta fija y el secundario acciones", "Ambos son del emisor: la diferencia es el plazo de los valores que se colocan en cada uno"]], ["Mercado principal vs. segundo mercado", "Principal: público en general; segundo mercado: solo inversionistas calificados o profesionales, con requisitos menos estrictos para emisores", ["Principal: solo inversionistas profesionales; segundo mercado: público en general, con requisitos más estrictos para los emisores que los del mercado principal", "Segundo mercado: público en general, con requisitos más estrictos para los emisores que el principal", "Son iguales: ambos están dirigidos al público en general y tienen los mismos requisitos para emisores"]], ["Sistemas de negociación: transparencia (art. 2.15.2.2.1)", "Debe estar disponible para afiliados, autorreguladores y público la información de ofertas, precios/tasas y volumen; se informa diariamente apertura, promedio, mínimo, máximo y cierre", ["Es reservada: solo los afiliados tienen acceso a la información de ofertas, precios y volumen", "Solo disponible para los afiliados, sin acceso al público ni a los autorreguladores del mercado", "Se informa mensualmente la apertura, el promedio, el mínimo, el máximo y el cierre de las operaciones, solo a los afiliados al sistema y a las autoridades"]], ["Sistemas de registro de operaciones", "Reciben y registran operaciones del OTC; en corretaje registra el intermediario; entre afiliado y no afiliado registra el afiliado; omitir el registro oportuno es conducta contraria a la integridad", ["Negocian en firme ofertas de compra y venta de forma multilateral entre sus afiliados", "Fijan los precios de referencia de los valores con base en las operaciones del día", "Compensan y liquidan las operaciones registradas, garantizando su cumplimiento a las partes, y administran las garantías que aportan los afiliados al sistema"]], ["Compensación y liquidación", "Compensación: establece obligaciones de entrega de valores y transferencia de fondos; liquidación: cumple definitivamente las obligaciones (entrega de valores contra dinero)", ["Son lo mismo: ambos términos designan el cumplimiento de la operación entre las partes", "Liquidación: calcula las prestaciones netas; compensación: transfiere los valores y el dinero", "Compensación: entrega los valores contra pago; liquidación: calcula las obligaciones de cada parte y establece las prestaciones netas entre los afiliados"]], ["Etapas de la compensación y liquidación", "Cierre (acuerdo de términos), compensación (cálculo de prestaciones: bruta, neta o contrapartida central) y liquidación (transferencia)", ["Solo liquidación: transferencia de valores contra dinero, sin acuerdo previo ni cálculo de prestaciones, porque el sistema ejecuta cada operación por separado", "Solo cierre: acuerdo de las condiciones de la operación entre las partes en el sistema", "Registro y custodia de los valores, previos a la anotación en cuenta del inversionista"]], ["Principio de finalidad (art. 10 Ley 964)", "Una vez aceptada la operación por el sistema, es firme, irrevocable, exigible y oponible a terceros; no puede anularse ni impugnarse", ["Se puede anular o impugnar, si alguna de las partes lo solicita dentro de los 3 días hábiles", "Es revocable por mutuo acuerdo de las partes, mientras no se haya liquidado la operación", "Solo aplica a los derivados: las operaciones de contado pueden revocarse hasta su liquidación, si ambas partes lo solicitan al administrador del sistema"]], ["Garantías en compensación y liquidación", "No pueden ser objeto de reivindicación ni medidas cautelares, y se aplican a las obligaciones garantizadas aun si el otorgante está en proceso concursal", ["Son embargables por los acreedores del otorgante, aunque estén afectas a las obligaciones garantizadas, y pueden reivindicarse cuando el otorgante entra en concurso", "No aplican en el concurso del otorgante: se integran a la masa de bienes en proceso de liquidación", "Se devuelven siempre al otorgante al día siguiente, aun cuando existan obligaciones pendientes"]], ["Quiénes administran sistemas de compensación y liquidación", "CRCC, bolsas de valores y de commodities, Banco de la República, DCV y entidades autorizadas", ["Solo la bolsa de valores, a través de su cámara de compensación de operaciones", "Solo el Banco de la República, que administra los sistemas de pago del país", "Solo la CRCC, que es la única entidad autorizada para compensar y liquidar valores, junto con el Banco de la República para los títulos de deuda pública"]], ["Cámara de Riesgo Central de Contraparte (CRCC)", "Servicio de contraparte central: se constituye en acreedora y deudora recíproca de las operaciones aceptadas; exige y administra garantías; exposición de crédito cero en operaciones aceptadas", ["Solo liquida las operaciones cerradas por los afiliados, sin asumir riesgo de contraparte", "Es un banco que presta recursos a los intermediarios para cumplir las operaciones pendientes, y asume el riesgo de crédito de las operaciones no aceptadas", "Negocia valores por cuenta propia para dar liquidez a los mercados de renta fija y variable"]], ["Miembros de la CRCC", "Liquidadores (acceso directo y liquidan por sí o por otros) y no liquidadores (acceso directo pero liquidan vía un liquidador)", ["Solo liquidadores, que tienen acceso directo y liquidan por sí mismos las operaciones aceptadas, y los clientes de éstos, que no participan en la cámara", "Solo clientes, que son las entidades que operan por conducto de un intermediario con acceso", "Comisionistas y fiduciarias, que acceden de forma directa y liquidan siempre a través del DCV"]], ["Depósitos centralizados de valores (DCV)", "Sociedades autorizadas con ese único objeto; el BanRep administra el DCV de títulos propios y deuda pública; anotaciones electrónicas (desmaterializados)", ["Custodios de valores físicos, que guardan los títulos en bóvedas y expiden certificados", "Bolsas de valores, que además de negociar administran las anotaciones electrónicas de los valores, y los almacenes generales de depósito autorizados por la SFC", "Bancos autorizados por la SFC, que llevan los registros de los valores de sus propios clientes"]], ["Principios de registro en depósitos", "Prioridad, tracto sucesivo, rogación, buena fe y fungibilidad", ["Solo fungibilidad: los valores del mismo emisor y clase son intercambiables entre los titulares", "Lealtad y reserva, que protegen la información de los titulares de los valores depositados", "Prudencia y diligencia en la custodia y administración de los valores depositados en el DCV"]], ["Funciones de la bolsa de valores (ejemplos)", "Inscribir valores, administrar sistemas transaccionales, establecer cotización efectiva, seleccionar miembros, reportar infracciones y organizar martillos", ["Calificar a los emisores y publicar sus calificaciones de riesgo en el boletín diario", "Certificar a los profesionales del mercado y mantener el registro de las personas certificadas, además de fijar las tarifas de los intermediarios y calificar emisores", "Fijar la tasa de interés de referencia de las operaciones y publicarla en su sitio de internet"]], ["Proveedores de infraestructura", "Bolsas, depósitos, CRCC, sistemas de negociación/registro, compensación/liquidación, almacenes generales de depósito, sistemas de pago de bajo valor, divisas", ["Solo bolsas de valores, que administran los sistemas de negociación y de registro de operaciones, junto con las cámaras de compensación de derivados del mercado", "Solo bancos, que prestan los servicios de pago y de compensación de las operaciones del mercado", "Intermediarios de valores, que ejecutan y registran las operaciones por cuenta de sus clientes"]], ["Integración BVC–BVL–BCS", "Holding regional; en 2023 se autorizó la constitución de la Holding Regional y la adquisición del 94,99% de la BVC", ["Fusión de AMV con la Bolsa de Valores de Lima para crear un autorregulador regional", "Creación de la CRCC como cámara regional de compensación de derivados entre los tres países", "Compra del DCV por la holding regional, para integrar los depósitos de valores de los países, y creación de una cámara regional de compensación para los tres mercados"]]]}, {"name": "Intermediación y clientes", "cards": [["Actividad de intermediación (art. 7.1.1.1.1)", "Operaciones que acercan oferentes y demandantes en sistemas de negociación o mercado mostrador, por cuenta propia o ajena", ["Solo comprar valores por cuenta propia, con recursos de la entidad y sin acercar a las partes, o vender los que se mantienen en el balance de la entidad", "Solo asesorar a los inversionistas sobre los valores en los que pueden invertir su patrimonio", "Solo custodiar los valores de los clientes y administrar sus derechos económicos y políticos"]], ["¿Quién es intermediario de valores?", "Entidad vigilada por la SFC con acceso directo a un sistema de negociación o de registro de operaciones", ["Cualquier persona natural o jurídica que realice operaciones sobre valores con ánimo de lucro, aunque no esté vigilada por la SFC ni tenga acceso a un sistema", "Entidad no vigilada por la SFC con acceso a un sistema de negociación mediante contrato", "El emisor que coloca sus valores directamente entre los inversionistas, sin intermediación"]], ["Operaciones de intermediación (ejemplos)", "Comisión, colocación, administración de portafolios/FIC/fondos, corretaje, fiducia de inversión, cuenta propia, asesoría", ["Solo comisión, porque es la única operación que se ejecuta por cuenta de los clientes", "Solo corretaje, porque es la única operación que acerca a oferentes y demandantes", "Solo cuenta propia, porque es la única operación que se realiza con recursos de la entidad, y la comisión que se ejecuta siempre por cuenta de terceros"]], ["¿Qué entidades pueden afiliarse a un sistema de negociación?", "Entidades vigiladas por la SFC y entidades públicas que puedan acceder a estos sistemas", ["Cualquier persona natural o jurídica que cumpla los requisitos de patrimonio exigidos", "Solo personas naturales con certificación vigente ante AMV y cuenta en un depósito de valores", "Solo emisores de valores inscritos en el RNVE que quieran negociar sus propios valores"]], ["Colocación en firme vs. garantizada", "En firme: la comisionista suscribe toda o parte de la emisión y la ofrece al público; garantizada: se compromete a colocar y suscribe el remanente no colocado en el plazo", ["Al revés: la garantizada suscribe toda la emisión; la colocación en firme es al mejor esfuerzo, sin obligación de suscribir lo que no se coloque en el plazo", "Ambas son iguales: la comisionista suscribe lo que no se coloca en los dos casos", "Garantizada: al mejor esfuerzo, sin obligación de suscribir el remanente de la emisión"]], ["Cliente inversionista vs. inversionista profesional", "Cliente inversionista: quien no es profesional (recibe asesoría); profesional: tiene experiencia y conocimientos y cumple requisitos de patrimonio/operaciones", ["Cliente inversionista: el que invierte grandes sumas; profesional: el que invierte sumas pequeñas, y por eso recibe siempre asesoría del intermediario con quien opera", "El profesional siempre recibe asesoría, porque sus conocimientos se limitan a productos simples", "Son iguales: ambos reciben el mismo trato y las mismas protecciones por parte del intermediario"]], ["Requisitos para ser inversionista profesional", "Patrimonio ≥ 157.878,12 UVT y una de: portafolio ≥ 78.939,06 UVT, o ≥15 operaciones en 60 días por ≥ 552.573,41 UVT; también certificados como operador, entidades vigiladas, organismos extranjeros/multilaterales", ["Patrimonio ≥ 1.000 UVT y alguna operación realizada en los últimos 12 meses con el intermediario, o certificación como operador ante AMV de la persona natural", "Ser extranjero con cuenta en el exterior y portafolio ≥ 10.000 UVT, sin otros requisitos", "Tener cuenta bancaria y haber suscrito un contrato de comisión con un intermediario de valores"]], ["El profesional puede pedir tratamiento de cliente inversionista", "Sí, de forma general o para un tipo de operaciones; debe constar por medio verificable escrito", ["No puede: la clasificación como profesional es definitiva y no admite solicitud de cambio", "Solo una vez en su vida, para todas las operaciones y con aprobación de la SFC", "Sí, de forma verbal y sin necesidad de dejar registro en un medio verificable por el intermediario"]], ["Deberes especiales de los intermediarios", "Información, gestión de conflictos de interés, documentación, reserva, separación de activos, valoración, mejor ejecución y asesoría", ["Solo información al cliente, que es el único deber especial que exige el reglamento", "Solo reserva de la información del cliente, que es el deber de mayor relevancia", "Solo mejor ejecución de las órdenes, que se aplica a las operaciones por cuenta de terceros, y la reserva de la información de los clientes de la entidad"]], ["Operaciones con vinculados en OTC", "El Decreto 1239 permite a los intermediarios realizar operaciones en el OTC con vinculados (con reglas y límites)", ["Siempre prohibidas: los intermediarios no pueden hacer operaciones en el OTC con vinculados", "No existe regulación: los intermediarios pactan libremente estas operaciones sin reglas ni límites, y no se requiere registrarlas en un sistema de registro", "Solo con autorización previa y escrita del cliente, que debe constar en el libro de órdenes"]], ["Casos donde se aplica el deber de asesoría", "Asesoría principal, corretaje/comisión, administración de portafolios de terceros, distribución de FIC, vinculación a FVP, negocios fiduciarios de inversión y cuentas de margen", ["Solo comisión, que es la única operación en la que el intermediario actúa por cuenta ajena", "Solo distribución de FIC, que es el único producto colectivo para el que se exige asesoría", "Solo vinculación a FVP, porque se trata de recursos de pensiones voluntarias de los partícipes, y la distribución de FIC para clientes que no son profesionales"]], ["Contrato de comisión (art. 1287 C.Co.)", "Mandato no representativo: el comisionista actúa en nombre propio y por cuenta y riesgo del comitente; obligación de medio, no de resultado; consensual", ["El comisionista actúa en nombre del cliente y por cuenta y riesgo de este último", "Genera obligación de resultado: el comisionista garantiza la utilidad de la operación", "Es solemne: debe constar por escritura pública para que se perfeccione entre las partes, y el comisionista actúa en nombre del comitente y a su cuenta"]], ["Obligaciones del comisionista", "Cumplir el encargo, obedecer órdenes, informar y rendir cuentas, asesorar, guardar reserva, no usar fondos del comitente, desarrollar personalmente el encargo", ["Garantizar la rentabilidad de las operaciones que realiza por cuenta de sus clientes", "Delegar libremente el encargo en terceros, sin informar al comitente ni obtener su autorización, y usar los fondos del cliente para operaciones propias", "Usar los fondos propios del cliente como capital de trabajo mientras se cumple la operación"]], ["Obligaciones del comitente", "Pagar la comisión y proveer los recursos necesarios e indemnizar perjuicios", ["Garantizar la utilidad del comisionista por cada una de las operaciones que le encargue", "Ejecutar personalmente las operaciones en el sistema de negociación, según su criterio", "Registrar las órdenes en el libro electrónico de órdenes, el mismo día de su recepción"]], ["¿Cuándo se perfecciona el contrato de comisión en la práctica?", "Desde que la entidad recibe la orden del cliente", ["Con la liquidación de la operación en el sistema, cuando se transfieren valores y dinero", "Al firmar el prospecto de información que entrega el intermediario al inversionista", "Al pagar la comisión pactada, que se descuenta del valor de la primera operación"]], ["LEO (libro electrónico de órdenes)", "Registro consecutivo y cronológico de órdenes que recibe un intermediario por cuenta de terceros; las SCB deben llevarlo; AMV fija los lineamientos mínimos", ["Registro de la bolsa de valores, que consolida las órdenes de todos sus afiliados", "Libro de accionistas de la comisionista, que lleva el control de sus propietarios", "Reporte mensual a la SFC con las operaciones propias y de terceros de cada comisionista, que consolida AMV y que reemplaza el registro de órdenes"]], ["Principios del procesamiento de órdenes", "Trazabilidad, equidad, revelación del sistema e integridad y seguridad de la documentación", ["Rapidez y precio, que son los dos factores que determinan la ejecución de cada orden", "Reserva y lealtad, que protegen al cliente y a la entidad en el manejo de cada orden", "Diligencia y prudencia, que son los deberes generales del intermediario frente a sus clientes"]], ["Contenido mínimo de una orden", "Fecha/hora, cliente y ordenante, quien la recibe, tipo, cantidad o monto, fecha de cumplimiento, valor, vigencia, tipo (compra/venta/repo/simultánea/TTV) y si es OPA o martillo", ["Solo la cantidad, porque el precio y los demás datos se definen en la ejecución", "Solo el precio, porque define el momento en que debe ejecutarse la orden en el mercado", "Solo el cliente, porque los demás datos los determina el intermediario según su criterio al ejecutar la orden en el sistema y no se registran en el libro"]], ["Medios para recibir órdenes", "Verbal (medio verificable), escrita con formato firmado, o digital con identificación cierta; sin medio verificable no hay orden", ["Cualquier mensaje que el cliente envíe, sin necesidad de que exista un registro verificable ni de que se identifique con claridad al ordenante de la operación", "Solo por escrito, con formato firmado por el cliente, porque no admite otros medios", "Verbal sin grabar, que el operador anota en su cuaderno personal como soporte de la orden"]], ["Quién puede registrar órdenes en el LEO", "Certificados como directivos, digitadores, operadores y asesores (con la especialidad correspondiente) o el cliente vía ruteo electrónico", ["Cualquier empleado de la entidad, sin necesidad de certificación ante AMV", "Solo los directivos, que son quienes tienen autoridad para ordenar operaciones en el sistema, sin que participen los digitadores, los operadores ni el cliente", "Solo los digitadores, que son los únicos autorizados para ingresar órdenes al libro"]], ["Cuentas de margen", "Contratos que permiten operar de contado por sumas mayores a los recursos aportados; margen mínimo definido por la SFC; solo SCB (comisión/APT) y fiduciarias; valores de alta liquidez; en sistemas autorizados", ["Operaciones apalancadas libres, sin límite de margen ni autorización previa de la SFC", "Solo para FIC, que pueden operar de contado por sumas mayores a las aportadas", "Sin margen mínimo: el intermediario define cuánto exige a cada cliente en cada operación, y puede abrirlas con valores de baja liquidez fuera de los sistemas"]], ["Llamado al margen", "Cuando el margen cae por debajo del 50% del requerido; si no se atiende, se cierran obligatoriamente las posiciones", ["Cuando el margen cae por debajo del 25% del requerido; si no se atiende, se informa a la SFC", "Cuando el margen cae por debajo del 100% del requerido; las posiciones se cierran el mismo día, sin que el cliente pueda reponer el margen faltante", "Cuando el margen cae por debajo del 10% del requerido; el cliente tiene 5 días para reponerlo"]], ["Prohibiciones en cuentas de margen (ejemplos)", "Operaciones similares sin requisitos, por personas obligadas a registrarse en el RNPMV, y contratos con discrecionalidad de la sociedad", ["Discrecionalidad permitida: la sociedad puede decidir las operaciones de la cuenta de margen por su cuenta, siempre que informe al cliente en el extracto mensual", "Solo con clientes institucionales, porque las personas naturales no pueden abrir cuentas", "Margen opcional: el cliente decide cuánto aporta, sin un mínimo definido por la SFC"]], ["Corretaje", "El corredor relaciona a dos o más personas sin estar vinculado a las partes (art. 1340 C.Co.); SCB con autorización de la SFC sobre valores del RNVE no inscritos en bolsa", ["Actúa por cuenta propia, con recursos de la entidad, y asume el riesgo de la operación", "Es vinculado a las partes y recibe una comisión por la operación cerrada entre ellas", "Es lo mismo que la comisión: el corredor actúa en nombre propio y por cuenta del cliente, y está vinculado a una de las partes de la operación"]]]}, {"name": "Cuenta propia, APT, fiducia, FIC y fondos", "cards": [["Operaciones por cuenta propia de SCB", "Primario: colocación en firme/garantizada y adquisición de valores de la Nación, vigilados y RNVE; secundario: para dar liquidez y estabilidad, atender ofertas y reducir márgenes; requieren autorización y capital de la Ley 510/1999", ["No permitidas: las SCB solo pueden actuar por cuenta de terceros y nunca con recursos propios, salvo en las colocaciones en firme de valores de la Nación", "Solo con recursos de clientes, que autorizan expresamente la operación por cuenta de la SCB", "Sin autorización de la SFC: basta con que la SCB cumpla el capital mínimo de la Ley 510"]], ["Financiación de valores por la SCB", "Autorización expresa de la SFC; plazo ≤ 1 año; pasivos ≤ 3 veces el patrimonio técnico; garantía ≥100% del préstamo (valores aceptados hasta 80%); créditos a un beneficiario ≤ 15% de la capacidad y ≤ 3% de las acciones de una sociedad", ["Plazo de hasta 5 años, pasivos hasta 10 veces el patrimonio técnico y garantía del 150%", "Garantía de solo 50% del préstamo y créditos a un beneficiario hasta el 50% de la capacidad, con plazo hasta de 3 años y pasivos de hasta 10 veces el patrimonio", "Sin límites: la SCB decide el plazo, la garantía y el monto, según su perfil de riesgo"]], ["Operador de distribución", "Representa una entidad como contraparte de clientes, sin discrecionalidad para decisiones de inversión ni posiciones abiertas", ["Opera con discrecionalidad en las decisiones de inversión por cuenta de sus clientes", "Opera por cuenta propia, con posiciones abiertas, para dar liquidez a los clientes", "Ejecuta las órdenes de los clientes en el sistema, con criterio propio sobre el precio, y toma posiciones abiertas por cuenta de la entidad que representa"]], ["Administración de portafolios de terceros (APT)", "La SCB administra un portafolio según criterio con los lineamientos del cliente; requiere autorización de la SFC; extractos mensuales (valor total, rentabilidad neta, composición)", ["Sin autorización de la SFC: basta con el contrato escrito con el cliente y su perfil", "Extractos anuales con el valor total, la rentabilidad neta y la composición del portafolio, sin necesidad de autorización de la SFC para administrarlo", "Sin lineamientos del cliente: la SCB decide con total libertad sobre la composición"]], ["Prohibiciones de la SCB en APT (ejemplos)", "Invertir en activos de la propia SCB, dar liquidez a vinculadas, actuar como contraparte, comprar activos de socios o empleados y parientes (25%+), gravar activos sin autorización", ["Usar los recursos como reciprocidad por créditos o negocios de la SCB con el cliente", "Invertir en el mercado de valores los recursos de los clientes, según sus lineamientos, y actuar como contraparte del portafolio cuando el cliente lo autorice", "Entregar a los clientes los extractos mensuales con la composición de su portafolio"]], ["Fiducia mercantil de inversión", "Fideicomisos con finalidad de invertir; el fiduciario actúa como vocero y administrador del patrimonio autónomo; no obligaciones de resultado", ["Genera obligación de resultado: el fiduciario garantiza la rentabilidad de la inversión y responde con su patrimonio por las pérdidas que sufra el fideicomiso", "El fiduciario es dueño de los bienes fideicomitidos y responde con su patrimonio", "Sin patrimonio autónomo: los bienes se mantienen en el balance del fideicomitente"]], ["FIC según redención", "Abiertos (redimen en cualquier momento; pacto de permanencia posible) y cerrados (al final del plazo); se asume abierto si no se dice otra cosa", ["Cerrado por defecto: se asume que el FIC redime solo al final del plazo, salvo pacto en contrario, y la permanencia mínima es siempre de un año calendario", "Solo cerrados: la regulación exige que las participaciones se redimen al final del plazo", "Solo abiertos: los cerrados se eliminaron del ordenamiento con el Decreto 2555 de 2010"]], ["Clases de FIC (Decreto 2555)", "Mercado monetario, bursátiles (ETF), capital privado (2/3 en activos no RNVE) e inmobiliarios (75% en activos inmobiliarios, no exigido los primeros 6 meses)", ["Solo monetarios, que son los únicos que admiten participaciones de inversionistas no profesionales, junto con los ETF, que se negocian en bolsa en tiempo real", "Solo ETF, que se negocian en el mercado secundario y replican un índice de referencia", "Renta fija y renta variable, según el tipo de activos en los que invierte cada fondo"]], ["Familia de FIC", "Agrupa más de un FIC; solo el primero debe ser autorizado por la SFC", ["Todos los FIC de la familia requieren autorización previa de la SFC antes de operar", "Ninguno requiere autorización: la familia se constituye con la simple notificación a la SFC", "Solo el último fondo que se incorpore, porque es el que modifica el reglamento de la familia"]], ["Quiénes administran FIC", "Sociedades comisionistas de bolsa, fiduciarias y sociedades administradoras de inversión", ["Solo bancos, que cuentan con la infraestructura para administrar recursos de terceros", "Solo AFP, que son las únicas con experiencia en gestión de recursos de largo plazo", "Solo comisionistas de bolsa, que son las únicas autorizadas para administrar portafolios"]], ["Fondos mutuos de inversión", "Personas jurídicas con aportes de trabajadores y empresas (Decreto 2968/1960); acciones hasta 80% del activo; repos y TTV hasta 30%; la SFC controla sus actividades de mercado", ["Fondos del Estado que administran los recursos de las entidades públicas y los empleados oficiales, con acciones hasta el 30% del activo y repos hasta el 80%", "Solo de empresas públicas, que reúnen aportes de los trabajadores de entidades estatales", "Sin límites: pueden invertir la totalidad de su activo en acciones, repos y TTV, sin restricción"]], ["Fondos de pensiones obligatorias (FPO)", "Patrimonio autónomo de propiedad de los afiliados (cuentas individuales); multifondos conservador, moderado, mayor riesgo y retiro programado; AFP garantizan rentabilidad mínima", ["Patrimonio de la AFP, que responde con sus recursos por las pérdidas de los afiliados", "Solo conservador: la regulación no permite a los afiliados elegir entre varios fondos", "Sin rentabilidad mínima: las AFP no tienen obligación de garantizar un retorno a los afiliados, que asumen todo el riesgo de pérdida sobre su cuenta individual"]], ["Fondos voluntarios de pensión (FVP)", "Aportes de partícipes y patrocinadores; se rigen en varios aspectos por normas de FIC desde el Decreto 1207 de 2020 (custodio, prospecto, ficha); alternativas estandarizadas, flexibles y autogestionadas", ["No tienen custodio: los valores los guarda la administradora en sus propias bóvedas", "Sin prospecto: el documento descriptivo solo se exige en los fondos obligatorios", "Solo planes institucionales: los abiertos fueron eliminados por el Decreto 1207 de 2020, y los fondos no tienen custodio ni prospecto de información al afiliado"]], ["Fondos de cesantías", "Administrados por AFC; dos portafolios (corto y largo plazo); fuentes: auxilio de cesantía, aportes voluntarios independientes, rendimientos y ventas de activos", ["Solo largo plazo: el portafolio de corto plazo se eliminó con la Ley 1328 de 2009", "Sin portafolios: los recursos se mantienen en una única cuenta de ahorros de la AFC", "Una AFC administra un solo fondo, en el que se mezclan los recursos de todos los trabajadores, con un único portafolio de largo plazo y sin retiros parciales"]], ["Administración de valores (SCB)", "Con autorización de la SFC y del mandante: cobrar rendimientos y capital, reinvertir según instrucciones, valorar a mercado y suscripción preferencial; responde hasta culpa leve", ["Sin instrucciones: la SCB decide por su cuenta cómo reinvertir los rendimientos recibidos", "Responde solo por dolo: la ley la exime de responsabilidad por culpa grave o leve", "No valora: la valoración a mercado le corresponde al mandante y no a la sociedad comisionista, que responde únicamente por dolo y por culpa grave en su gestión"]]]}, {"name": "Operaciones: contado, plazo, repo, simultánea, TTV, derivados, OPA", "cards": [["Operación de contado vs. a plazo", "Contado: compensación y liquidación t+0 hasta t+3; a plazo: más de 3 días hábiles (t+4 en adelante)", ["Contado: compensación y liquidación hasta t+5; a plazo: más de 5 días hábiles", "A plazo: hasta t+3; contado: más de 3 días hábiles desde el cierre de la operación", "Sin diferencia: ambas se cumplen en la misma fecha y solo cambia el sistema de negociación"]], ["Repo (reporto)", "El enajenante transfiere valores a cambio de un monto inicial y el adquirente los retorna a cambio de un monto final; plazo ≤ 1 año (salvo CRCC); puede haber descuento (haircut); pueden sustituirse valores y restringirse su movilidad", ["Sin descuento posible: el monto inicial siempre equivale al valor de mercado de los valores", "No pueden sustituirse valores durante la vigencia de la operación ni restringirse su movilidad, y el monto inicial nunca puede tener descuento sobre el mercado", "Plazo ilimitado siempre: las partes pueden prorrogarlo cuantas veces quieran sin límite"]], ["Simultánea", "Igual que el repo pero el monto inicial no puede tener descuento, no pueden sustituirse valores ni restringirse su movilidad; plazo ≤ 1 año (salvo CRCC)", ["Con descuento sobre el valor de mercado, y pueden sustituirse los valores durante la operación y restringirse su movilidad, con plazo máximo de dos años", "Pueden sustituirse los valores y restringirse su movilidad; plazo máximo de 3 años", "Plazo de 5 años, con descuento y posibilidad de sustituir los valores objeto de la operación"]], ["TTV (transferencia temporal de valores)", "El originador transfiere valores y el receptor entrega otros valores, dinero o garantías; si hay garantías, debe hacerse en sistemas o bolsas autorizados; puede pactarse rendimiento por el dinero", ["Es una venta definitiva de los valores, sin obligación de devolución por parte del receptor, que adquiere la titularidad y el derecho a los rendimientos que paguen", "No usa garantías: el receptor solo entrega dinero y no puede entregar otros valores", "No hay plazo: el receptor puede devolver los valores cuando lo considere conveniente"]], ["Dividendos o amortizaciones durante repo/simultánea/TTV", "El adquirente/receptor debe transferir su importe al enajenante/originador en la misma fecha del pago", ["Se los queda el adquirente o receptor, que es el titular de los valores durante la operación", "Se pagan al vencimiento de la operación, junto con el monto final pactado entre las partes", "No se transfieren: son un ingreso del adquirente por la custodia de los valores recibidos"]], ["Venta en corto", "Venta de valores que el vendedor no posee; debe cubrirse el mismo día (TTV); en Colombia se usa solo en renta fija; precio mínimo = último precio de negociación para acciones", ["Siempre prohibida: la regulación colombiana no permite vender valores que no se poseen", "Se usa en renta variable, sin necesidad de cubrirla el mismo día con una TTV", "Sin cobertura: el vendedor puede mantener la posición abierta por varios días sin ninguna restricción, y en Colombia solo se permite sobre acciones de alta liquidez"]], ["Instrumento financiero derivado", "Operación cuyo precio justo depende de uno o más subyacentes y cuyo cumplimiento es posterior (efectivo o financiero); fines: cobertura, especulación o arbitraje", ["Sin subyacente: su valor depende solo de la oferta y demanda del propio derivado", "Siempre de contado: el cumplimiento de la operación ocurre el mismo día de su cierre", "Solo para especular: la regulación prohíbe usarlos con fines de cobertura o de arbitraje, y su cumplimiento debe ser siempre de contado y por entrega física"]], ["Costo de reposición, exposición potencial futura y exposición crediticia", "Reposición: precio justo del derivado si es positivo (si no, cero); potencial futura: pérdida posible por incumplimiento; crediticia: suma de ambos (no menor a cero)", ["Son lo mismo: los tres conceptos miden el precio justo del derivado a la fecha de valoración, y solo cambia la contraparte con la que se haya pactado", "Crediticia: solo el costo de reposición, sin sumar la exposición potencial futura", "Potencial: precio de mercado del derivado a la fecha de cierre, más la prima pagada"]], ["Forward, futuro, swap y opción", "Forward: a la medida (OTC); futuro: estandarizado en bolsa con CRCC; swap: intercambio de flujos; opción: derecho (no obligación) de comprar o vender", ["Futuro: a la medida y OTC; forward: estandarizado y negociado en bolsa con garantía de la CRCC; swap: derecho de comprar; opción: intercambio de flujos", "Opción: obligación de comprar o vender; swap: derecho a intercambiar flujos con la contraparte", "Forward: se negocia en bolsa y liquida con la CRCC; futuro: contrato OTC a la medida"]], ["Swaps básicos", "IRS (tasas de interés), CCS (monedas) o combinación; swaps sobre otros subyacentes son derivados exóticos; permutas de títulos no son derivados", ["Solo de acciones, que intercambian el rendimiento de un portafolio por una tasa fija", "Solo de commodities, que intercambian el precio de un bien físico por un precio variable, y que se consideran los únicos swaps estandarizados del mercado", "Todos son derivados exóticos, porque su valoración exige modelos matemáticos complejos"]], ["Producto estructurado", "Combina uno o más instrumentos no derivados con uno o más derivados; si un componente es valor, el estructurado también", ["Solo derivados, que se combinan con otros derivados para crear una estrategia a la medida, y que nunca se consideran valores aunque tengan componentes de renta fija", "Solo bonos, que incorporan una opción de conversión en acciones a favor del emisor", "No es valor, aunque uno de sus componentes sea un valor inscrito en el RNVE"]], ["Quiénes pueden realizar derivados y estructurados", "Entidades vigiladas por la SFC; las SCB en nombre propio y por cuenta ajena vía comisión", ["Cualquier persona natural o jurídica que tenga capacidad para contratar y patrimonio", "Solo emisores de valores, que los usan para cubrir los riesgos de su actividad", "Solo AMV, que los registra y valida antes de que puedan ofrecerse a los inversionistas"]], ["OPA obligatoria", "Para llegar a ≥25% del capital con voto de una sociedad con acciones en bolsa, o aumentar más de 5% estando en ese nivel; debe ser sobre ≥5% del capital con voto; requiere autorización de la SFC y garantía ante la bolsa", ["Para llegar a 10% del capital con voto de una sociedad con acciones inscritas en bolsa", "Se realiza sin autorización de la SFC, que solo recibe la información posterior de la operación, y no requiere garantía alguna ante la bolsa de valores", "Sin garantía: el oferente no debe acreditar ante la bolsa la disponibilidad de los recursos"]], ["Casos en que no se requiere OPA (ejemplos)", "Aceptación escrita del 100%, privatización, readquisición de acciones, emisión de capital con voto, capitalización de acreencias, donación, sucesión o adjudicación judicial", ["Siempre se requiere: la ley no admite excepciones al llegar al porcentaje de participación", "Solo en fusiones entre sociedades vigiladas por la SFC, que se rigen por un régimen especial, y en las ofertas dirigidas a menos de 100 accionistas", "Solo para extranjeros, que están obligados a informar su participación a la SFC y a la bolsa"]], ["Oferta pública de democratización", "El controlante ofrece acciones buscando participación masiva; inscritas en bolsa al menos 6 meses antes y libres de gravámenes", ["Inscritas en bolsa al menos 1 mes antes y libres de gravámenes ni limitaciones", "Inscritas en bolsa con gravámenes que se levantan con la aceptación de los destinatarios", "Dirigida solo a inversionistas profesionales, con acciones inscritas al menos 12 meses antes y con gravámenes que se levantan al aceptarse la oferta"]], ["Información privilegiada y relevante: autorización de no divulgar", "El emisor puede pedir a la SFC no divulgar un hecho relevante por perjuicio al emisor o riesgo al mercado; la SFC fija un plazo prorrogable; esa información se considera privilegiada", ["No está permitido: todo hecho relevante debe divulgarse al mercado en el momento en que ocurra, y el emisor no puede solicitar a la SFC reserva alguna", "Plazo fijo de 30 días sin posibilidad de prórroga, que la SFC fija con base en la solicitud", "Lo aprueba AMV, que fija el plazo y verifica que el emisor no negocie sus propios valores"]]]}, {"name": "Intermediarios específicos, calificadoras y SIMEV", "cards": [["Establecimientos bancarios: operaciones de intermediación (ejemplos)", "Descontar pagarés y letras, comprar/vender letras, cotizaciones de compra y venta de deuda pública, colocación de deuda pública y emitir valores en masa en operaciones pasivas", ["Solo CDT y demás depósitos a término, que son su única forma de captar recursos del público, sin descuento de pagarés ni cotizaciones de deuda pública", "Administrar FIC y portafolios de terceros, con autorización previa de la SFC y de AMV", "Titularizar cartera propia y emitir valores respaldados con los activos de sus clientes"]], ["Sociedades fiduciarias: operaciones", "Compra y venta de valores en fiducia de inversión, transferencia/registro, representación de tenedores de bonos, asesoría, administración de FVP, FIC y fondos de capital extranjero", ["Solo FIC: la fiducia de inversión y los demás negocios están reservados a otras entidades, como las comisionistas y las sociedades administradoras de inversión", "Solo bonos: representan a los tenedores y administran los recursos de las emisiones", "Corretaje de valores y operaciones por cuenta propia, con los recursos del fideicomiso"]], ["Sociedades administradoras de fondos de pensiones y cesantías", "Sociedades de servicios financieros con objeto exclusivo; ofrecen 3 fondos + retiro programado; un fondo de cesantías con 2 portafolios; garantizan rentabilidad mínima", ["Captan depósitos del público, con autorización de la SFC, para colocarlos en créditos", "Ofrecen solo un fondo en el que se invierten todos los aportes de los afiliados", "No garantizan ninguna rentabilidad: los afiliados asumen todos los riesgos de inversión, y solo ofrecen un fondo de pensiones y uno de cesantías de largo plazo"]], ["SCB: operaciones autorizadas", "Cuenta propia, administración de valores y portafolios, asesoría, corretaje, representación de bolsas del exterior, corresponsalía y financiación de valores", ["Captar CDT y demás depósitos a término, como complemento de sus operaciones de intermediación, y administrar fondos de pensiones obligatorias con la AFP", "Emitir bonos de garantía general y colocarlos entre sus clientes con carácter obligatorio", "Administrar fondos de pensiones obligatorias y de cesantías, con autorización de la SFC"]], ["Compañías de financiamiento comercial (CFC)", "Captan depósitos a término para créditos y leasing; factoring, compra de títulos públicos, aceptaciones para compraventas en el interior, operaciones cambiarias autorizadas", ["Captan cuentas corrientes de sus clientes, para colocarlas en operaciones de crédito", "Administran fondos de pensiones obligatorias, con las mismas reglas de las AFP", "Son comisionistas de bolsa, que ejecutan órdenes de sus clientes en el mercado de valores, y además pueden administrar fondos de inversión colectiva"]], ["SAI (sociedades administradoras de inversión)", "Objeto único: recibir suscripciones del público y administrar fondos de inversión", ["Captan depósitos a término del público para colocarlos en créditos y operaciones de leasing", "Administran fondos de pensiones obligatorias y de cesantías con objeto social exclusivo", "Son bolsas que administran los sistemas de negociación de valores y de derivados"]], ["Corporaciones financieras", "Promueven empresas, suscriben acciones/BOCEAS, emiten bonos de garantía general, colocan valores por comisión, asesoran y pueden representar tenedores de bonos", ["Captan ahorro popular de los hogares, para colocarlo en créditos de vivienda de interés social, y no pueden suscribir acciones ni representar tenedores de bonos", "Solo colocan crédito de consumo, sin participar en el mercado de valores ni en inversión", "No pueden asesorar: su objeto se limita a captar recursos y colocarlos en créditos"]], ["Sociedades calificadoras de riesgos", "Sociedades anónimas autorizadas por la SFC e inscritas en el RNAMV; la calificación es una opinión (no recomendación ni garantía); vigencia máxima 1 año; deben divulgar en 24 horas", ["Su opinión garantiza el pago de las obligaciones del emisor, porque la autoriza la SFC", "Su calificación tiene vigencia de 5 años, que se renueva cuando el emisor lo solicite", "Divulgan la calificación en un mes, luego de que el comité la apruebe y se la notifique al emisor, y su vigencia máxima es de cinco años sin revisión"]], ["Valores que deben calificarse para inscribirse en el RNVE", "Bonos ordinarios (no de Fogafín), de garantía general de establecimientos de crédito, bonos públicos, papeles comerciales y titularizaciones; el segundo mercado no requiere calificación", ["Todas las acciones, porque las calificadoras evalúan su riesgo antes de inscribirlas", "Solo TES y valores del BanRep, que requieren una calificación de la Nación para su emisión", "Solo CDT emitidos por entidades vigiladas, que requieren calificación de una sociedad autorizada, junto con las acciones inscritas en el segundo mercado"]], ["Calificadoras autorizadas", "BRC Investor Services, Fitch Ratings Colombia y Value and Risk Rating", ["Moody's y S&P Global, que cuentan con autorización de la SFC para operar en Colombia", "Precia y PiP, que además de proveer precios califican los valores inscritos en el RNVE", "Solo Fitch Ratings Colombia, que es la única calificadora autorizada para el mercado local"]], ["SIMEV y sus registros", "Sistema Integral de Información del Mercado de Valores: RNVE (valores y emisores), RNAMV (agentes) y RNPMV (profesionales)", ["Solo RNVE, que reúne la información de todos los valores, emisores y profesionales", "RNVE y RNPMV: los agentes del mercado no se inscriben en un registro propio del SIMEV", "SIAMV, que administra AMV con información de los autorregulados y de las personas vinculadas, y que reemplaza el RNAMV como registro de agentes del mercado"]], ["RNAMV: quién se inscribe", "Intermediarios, bolsas y sus miembros, proveedores de infraestructura, calificadoras, titularizadoras, custodios, fondos mutuos, entidades de información y autorreguladores", ["Solo emisores de valores, que deben acreditar sus requisitos para ofrecer en el mercado", "Personas naturales que ejecutan operaciones de intermediación por cuenta de un intermediario", "Inversionistas que cumplen los requisitos de patrimonio para ser clasificados como profesionales, y las personas naturales vinculadas a los intermediarios"]], ["RNPMV: quién se inscribe", "Personas naturales que dirigen o ejecutan intermediación, estructuran operaciones, promueven operaciones, administran FIC o fondos mutuos; requiere certificación previa", ["Cualquier empleado de un intermediario, aunque no ejecute ni dirija operaciones de valores", "Solo directivos de las entidades vigiladas, que dirigen las áreas de intermediación", "Solo operadores, que ejecutan las operaciones de intermediación en los sistemas de negociación, y los digitadores que ingresan las órdenes de los clientes"]], ["Suspensión de la inscripción", "RNVE: no puede haber oferta pública y se suspende la negociación; RNAMV: el agente no puede actuar (se suspende también en AMV y sistemas); RNPMV: el profesional no puede actuar", ["Solo suspensión en la bolsa: los demás registros no se afectan por la suspensión", "No tiene efectos: la suspensión es una medida administrativa que no afecta la actividad, y el agente o profesional puede seguir operando mientras la impugna", "Solo multa: la suspensión de la inscripción se sanciona con una multa a la entidad"]], ["Información periódica de emisores", "Informe de fin de ejercicio (asuntos generales, desempeño, sostenibilidad, anexos) e informes trimestrales (estados financieros, riesgos); Decreto 151 de 2021", ["Solo mensual: el emisor debe presentar sus estados financieros cada mes a la SFC", "Solo anual, sin información de sostenibilidad ni anexos, y se presenta a la bolsa", "No es obligatoria: los emisores divulgan su información cuando lo consideren conveniente, y solo deben presentar los estados financieros al cierre del ejercicio"]], ["Información relevante", "Hechos y actos del art. 5.2.4.3.1 (cambios de estructura, crisis, adquisición o enajenación significativa de activos); se divulga a través de la web de la SFC inmediatamente", ["Se divulga al mes siguiente, junto con el informe trimestral de estados financieros", "Solo se informa a los accionistas del emisor, en la siguiente reunión de la asamblea", "Es opcional: el emisor decide si divulga o no los hechos que puedan afectar su cotización, y lo hace con el informe trimestral de estados financieros"]]]}, {"name": "Intervención del Estado y SFC", "cards": [["Fundamento constitucional de la intervención", "Art. 335 de la Constitución: régimen de intervención reforzada en actividad financiera, bursátil y aseguradora por comprometer el interés público", ["Art. 48 de la Constitución: régimen de seguridad social como servicio público obligatorio, con intervención del Estado en pensiones y salud de los trabajadores", "Art. 371 de la Constitución: funciones de la Junta del Banco de la República sobre moneda", "Art. 150 de la Constitución: facultades del Congreso para expedir leyes marco y códigos"]], ["Autoridades de regulación", "Congreso (leyes marco: Ley 964/2005), Gobierno vía MinHacienda (Decreto 2555/2010), URF (estudios y proyectos) y Junta del BanRep (cambiaria)", ["Solo la SFC, que expide los reglamentos y los aplica a las entidades que supervisa", "Solo el AMV, que regula y supervisa a los intermediarios de valores y a sus personas vinculadas, con aprobación de los reglamentos por el Ministerio de Hacienda", "Solo el Banco de la República, que regula la moneda, los cambios y el crédito"]], ["Tipos de intervención", "Regulatoria y de vigilancia y control", ["Solo regulatoria", "Fiscal y monetaria", "Preventiva y reactiva, según actúe antes o después"]], ["Objetivos del Gobierno en el mercado de valores", "Buen funcionamiento y transparencia, desarrollo y eficiencia, prevenir riesgo sistémico y proteger inversionistas", ["Maximizar la rentabilidad de los inversionistas y garantizar un rendimiento mínimo en el mercado, además de proteger a los emisores frente a las pérdidas", "Solo proteger a los emisores, para que puedan financiarse a bajo costo en el mercado público", "Recaudar impuestos sobre las operaciones de valores y financiar con ellos el presupuesto"]], ["Límite a la facultad del Gobierno (art. 5 Ley 964)", "No puede modificar estructura del mercado, constitución, objeto, forma societaria, disolución, toma de posesión o liquidación de entidades vigiladas; eso es competencia del Congreso", ["Puede modificar toda la estructura del mercado, incluidas la constitución, el objeto y la liquidación de las entidades vigiladas, sin intervención del Congreso", "Solo lo puede hacer la SFC por medio de resoluciones de carácter general", "Solo lo puede hacer el Banco de la República mediante resoluciones de su Junta Directiva"]], ["Junta del BanRep", "7 miembros: MinHacienda (preside), gerente (elegido por la Junta) y 5 de dedicación exclusiva nombrados por el Presidente por 4 años prorrogables (reemplazando 2 cada período)", ["5 miembros: MinHacienda (preside), gerente y 3 de dedicación exclusiva nombrados por el Presidente por periodos de 4 años, sin posibilidad de reelección", "9 miembros: MinHacienda (preside), gerente y 7 de dedicación exclusiva nombrados por el Presidente", "7 miembros elegidos todos por el Congreso por 4 años, sin participación de MinHacienda"]], ["Funciones preventivas de la SFC (art. 6 Ley 964)", "Instruir a vigilados, fijar criterios técnico-jurídicos, suspender preventivamente ofertas, negociación, inscripciones (RNVE/RNAMV/RNPMV) ante temor fundado de daño, imponer medidas cautelares", ["Solo sancionar a los vigilados que incumplan las normas, una vez agotado el proceso", "Certificar a los profesionales del mercado y mantener el registro de las personas certificadas, además de imponer las multas a los intermediarios vigilados", "Fijar las tasas de interés de referencia y las comisiones máximas que cobran los vigilados"]], ["Control exclusivo vs. concurrente de la SFC", "Exclusivo: emisores bajo su vigilancia permanente; concurrente: emisores vigilados por otra autoridad (solo verifica normas de mercado e información)", ["Exclusivo: emisores vigilados por otra autoridad; concurrente: emisores bajo su vigilancia permanente, de los cuales verifica solo las normas de mercado", "Concurrente: emisores que solo vigila la SFC, sin intervención de otras autoridades", "No existen: la SFC ejerce siempre el mismo tipo de control sobre todos los emisores"]], ["Principios de la facultad sancionatoria de la SFC (art. 208 EOSF)", "Contradicción, proporcionalidad, revelación dirigida y carácter ejemplarizante", ["Legalidad y tipicidad, que exigen sanciones y conductas previamente definidas en la norma", "Oportunidad y celeridad, que obligan a decidir los procesos en plazos perentorios", "Lealtad y reserva, que protegen la información que conoce la SFC en cada actuación"]], ["Sanciones administrativas de la SFC (art. 208 EOSF)", "Amonestación, remoción de administradores/revisores, clausura de oficinas de representación, suspensión o inhabilitación por 5 años y multa a favor del Tesoro", ["Solo multa a favor del Tesoro, que es la única sanción administrativa que puede imponer, y que se calcula con el valor de la operación que se sanciona", "So
