<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Estudio AMV"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="theme-color" content="#0b5cad"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><style>html{padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}body{margin:0}</style>Estudio AMV</title>
<style>
/* Layout: una columna, terminal compacta; pantallas: inicio > mazo > sesión > resultado */
:root{--bg:#f3f4f5;--panel:#ffffff;--fg:#14181c;--mute:#5d6770;--line:#d3d8dc;--accent:#0b5cad;--ok:#16794a;--bad:#b3261e;--okbg:#e3f3ea;--badbg:#fbe7e5;--mono:ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace;--sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1316;--panel:#171c21;--fg:#e6eaed;--mute:#8b96a0;--line:#2a3238;--accent:#5aa7ff;--ok:#4cc38a;--bad:#ff7b72;--okbg:#12281f;--badbg:#32191a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1316;--panel:#171c21;--fg:#e6eaed;--mute:#8b96a0;--line:#2a3238;--accent:#5aa7ff;--ok:#4cc38a;--bad:#ff7b72;--okbg:#12281f;--badbg:#32191a;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--sans);padding-inline:16px;padding-block:12px 40px}
#app{max-width:640px;margin:0 auto}
h1{font:600 13px var(--mono);letter-spacing:.08em;text-transform:uppercase;margin:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:12px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.mute{color:var(--mute)}
button{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:10px 12px;cursor:pointer;min-height:44px}
button:hover{border-color:var(--accent)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button.pri{color:#06121f}}
:root[data-theme="dark"] button.pri{color:#06121f}
button.sm{min-height:32px;padding:4px 10px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1 1 140px;min-width:0}
.list{display:flex;flex-direction:column;border:1px solid var(--line);background:var(--panel)}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 12px;border:0;border-bottom:1px solid var(--line);border-radius:0;text-align:left;background:transparent;width:100%}
.item:last-child{border-bottom:0}
.item .t{font-weight:600}
.item .code{font:600 11px var(--mono);color:var(--accent);letter-spacing:.06em}
.bar{height:4px;background:var(--line);grid-column:1/-1;margin-top:4px}
.bar i{display:block;height:100%;background:var(--ok)}
.sec{margin:16px 0 6px;font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.card{background:var(--panel);border:1px solid var(--line);padding:16px;min-height:200px;display:flex;flex-direction:column;justify-content:center;gap:10px;cursor:pointer;overflow-wrap:anywhere}
.card .lab{font:600 11px var(--mono);letter-spacing:.08em;color:var(--mute)}
.card .q{font-size:17px;font-weight:600}
.card .a{font-size:16px;border-top:1px solid var(--line);padding-top:10px}
.prog{display:flex;justify-content:space-between;font:12px var(--mono);color:var(--mute);margin-bottom:6px}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.opt{text-align:left;overflow-wrap:anywhere;display:block;width:100%}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad)}
.opt[disabled]{opacity:1;cursor:default;color:inherit}
.chk{display:flex;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.chk:last-child{border-bottom:0}
.chk input{width:18px;height:18px;flex:none}
.chk span{flex:1;min-width:0}
.score{font:600 40px var(--mono)}
.box{display:inline-block;font:11px var(--mono);padding:1px 5px;border:1px solid var(--line);color:var(--mute)}
select{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:8px;min-height:36px}
</style>
</head><body><div id="app"></div>
<script>
const DECKS=[{"id": "etic", "title": "Ética e Integridad", "code": "ETIC", "sections": [{"name": "Ética en la práctica", "cards": [["¿Qué cuatro preguntas debe hacerse antes de actuar cuando hacer lo correcto no es evidente?", "¿Mi acción es honesta, franca, transparente y justa?", ["¿Es legal, rentable, rápida y discreta?", "¿Es leal, prudente, diligente e imparcial?", "¿Es una práctica pública, aprobada, documentada y auditable por terceros independientes?"]], ["¿Ética y ley son lo mismo?", "No: se puede actuar con poca ética sin violar la ley, pero quien infringe la ley actúa a la vez de forma ilegal y poco ética", ["Sí: lo legal siempre es ético, y quien cumple la ley nunca puede actuar con poca ética en su trabajo", "No: la ética solo opera cuando existe una norma escrita que la imponga, y por eso quien infringe la ley no incurre además en una falta ética ni se le puede reprochar su conducta", "Sí: la ética es el conjunto de leyes del sector, y se prueba únicamente ante autoridades y tribunales"]], ["Test de transparencia: ¿qué pregunta ayuda a evaluarla?", "¿Podría explicar claramente mi actuar a un tercero, a mi familia o ante una cámara sin reproche?", ["¿Cumplí lo que mi jefe me indicó verbalmente y obtuve un resultado comercial favorable para la firma?", "¿Mi conducta coincide con lo que hacen habitualmente los demás participantes del mercado en situaciones iguales?", "¿Podría justificar mi decisión ante el área comercial siempre que no haya una norma que la prohíba?"]], ["¿Existen reglas éticas distintas para la vida privada y la laboral?", "No: si algo está mal, está mal sin importar la esfera; lo malo es malo aunque nadie vigile", ["Sí: en el trabajo se admite más flexibilidad porque priman las metas comerciales y la presión de los resultados", "Solo en el sector financiero, donde las reglas del negocio son más laxas que en la vida personal", "No: pero lo que está mal solo lo es cuando alguien lo ve, lo reporta o existe una sanción posible"]], ["Encontrar un celular en un bus y quedárselo: ¿qué principio NO cumple?", "Ninguno de los cuatro: no es honesto, franco, transparente ni justo", ["Solo la honestidad: cumple la franqueza, la transparencia y la justicia porque no se apropió con violencia", "Solo la justicia: lo demás se cumple porque el dueño no lo reclamó ni lo buscó en el momento", "Cumple los cuatro, porque no hay una norma que obligue a devolver objetos encontrados en la vía pública"]], ["¿Por qué las «costumbres del mercado» son un precedente peligroso?", "Cambian en el tiempo y no siempre representan el actuar adecuado", ["Son siempre ilegales y por eso no pueden servir de guía para actuar en el trabajo del día a día", "Las prohíbe el Decreto 2555 y su incumplimiento genera sanciones automáticas para la entidad y sus empleados", "Permanecen fijas en el tiempo y siempre favorecen al cliente por encima de los intereses de la entidad"]]]}, {"name": "Ética en los servicios financieros", "cards": [["En servicios financieros, ¿qué prelación de intereses rige?", "Primero los intereses del cliente, luego los de la entidad y por último los personales", ["Primero los intereses de la entidad, luego los del cliente y por último los intereses personales del profesional que atiende", "Primero los personales, luego el cliente, luego la entidad", "Todos tienen igual prelación"]], ["¿A quién se considera «cliente»?", "Personas naturales o jurídicas con quienes las entidades tienen relaciones legales o contractuales para prestar productos o servicios", ["Únicamente las personas naturales que ya tienen una cuenta o producto activo y pagan comisiones a la entidad", "Solo las personas jurídicas inscritas ante la Superfinanciera que celebran operaciones de inversión con la firma y pagan comisiones a la entidad", "Cualquier persona que haya visitado la entidad, sin que exista relación legal ni contractual con ella"]], ["¿Cuándo se puede revelar información de clientes?", "(i) Si es sobre actividades ilegales y la pide una autoridad, (ii) la regulación lo exige, o (iii) el cliente lo autoriza expresamente", ["Cuando lo solicita cualquier compañero o superior de la firma que necesite la información para cumplir con su trabajo y haya firmado un compromiso de reserva", "Cuando ha terminado la relación con el cliente y han pasado más de dos años desde la última operación", "Cuando la información es antigua o ya no resulta relevante para las operaciones vigentes del cliente"]], ["La confidencialidad cubre la información de…", "Clientes actuales, anteriores y potenciales", ["Solo clientes actuales", "Solo clientes con portafolio vigente y operaciones activas", "Solo clientes institucionales"]], ["¿Qué debe revelar un profesional para proteger al cliente?", "Los potenciales conflictos de interés que afecten su objetividad, neutralidad o independencia", ["Su remuneración, bonificaciones y las comisiones que recibe la entidad por cada producto que ofrece", "Todas sus inversiones personales y las de sus familiares, aunque no tengan relación con el cliente", "Los resultados y rentabilidades obtenidos con otros clientes con perfil de riesgo similar al suyo"]], ["Un vendedor ético de productos financieros debe informar al cliente…", "Riesgos, estructura, si la tasa es real o estimada, que recibirá comisión y los costos adicionales", ["Solo la rentabilidad esperada, porque los riesgos y costos los debe consultar el cliente por su cuenta", "Los beneficios del producto y lo que el cliente pregunte, sin incluir comisiones ni costos adicionales", "La tasa nominal y el plazo, omitiendo si la rentabilidad es estimada porque no hay garantía de ella"]], ["Frases típicas de un vendedor poco ético:", "«No se preocupe, yo no vendería algo en lo que no confiara» o «es una oportunidad limitada, decida ya»", ["«Le explico los riesgos y costos, y tómese el tiempo que necesite para decidir con calma»", "«Le informo mi comisión y le entrego el reglamento para que lo revise antes de invertir»", "«Este producto no es para todos; si no encaja con su perfil, le recomiendo otra alternativa y le explico por qué»"]], ["¿Por qué el sector financiero exige más que otros sectores?", "Por la especial trascendencia de la función financiera y porque los negocios se fundamentan en una relación de confianza", ["Porque las comisiones del sector son más altas que en otros sectores y esa remuneración exige un estándar mayor de conducta a sus profesionales", "Porque no existe competencia entre entidades y los clientes no pueden cambiar fácilmente de proveedor", "Porque los productos financieros son más baratos y requieren menos explicación que otros sectores"]], ["Además de comportarse bien, ¿qué se espera de un profesional del sistema?", "Un actuar propositivo, prudente y diligente, incluida la denuncia de actos incorrectos de otros", ["Solo cumplir la ley y las instrucciones del superior, sin involucrarse en conductas de terceros", "Un actuar neutral y reservado que evite denunciar a otros para no afectar el ambiente laboral", "Cumplir los indicadores comerciales y dejar los actos incorrectos de otros a las autoridades"]]]}, {"name": "Evaluando dilemas y códigos", "cards": [["¿Cómo se debe actuar ante un dilema ético?", "Reflexionar antes de actuar y, si hay duda, consultar a cumplimiento, auditoría, embajadores de ética o colegas confiables", ["Actuar con rapidez para no perder la oportunidad y corregir luego si el resultado no es el esperado", "Decidir en solitario, para no comprometer a compañeros ni exponer el caso ante las áreas de control", "Seguir lo que se acostumbra en el área, porque la costumbre refleja el actuar adecuado en el mercado y evita decisiones individuales"]], ["¿Qué canales se usan para denunciar actos incorrectos?", "Línea ética, correos a áreas especializadas o denuncia ante el AMV", ["Redes sociales o prensa, porque la presión pública es la forma más eficaz de corregir la conducta", "Exclusivamente el jefe directo, quien decide si el caso se eleva a otras instancias o se archiva", "Ninguno: la denuncia es una decisión personal y la entidad no puede ofrecer canales para ello"]], ["Código de ética vs. código de conducta", "Ética: principios y valores generales. Conducta: reglas detalladas, procedimientos, instancias y sanciones", ["Ética: reglas detalladas y sanciones. Conducta: principios y valores generales de la organización", "Ética: procedimientos e instancias. Conducta: la misión, visión y objetivos estratégicos de la entidad", "Ambos tienen el mismo contenido, y solo cambian el nombre y el área que los administra"]], ["Marco ético vs. marco de cumplimiento: verbos típicos", "Ético: promover, fomentar, comprometerse, respetar. Cumplimiento: abstenerse, actuar, evitar, informar, revelar", ["Ético: abstenerse, evitar, informar. Cumplimiento: promover, fomentar, comprometerse y respetar", "Ambos marcos usan los mismos verbos, porque se redactan igual y solo cambia la instancia que los aprueba", "Ético: sancionar, exigir y ordenar. Cumplimiento: respetar, valorar y aspirar a las buenas prácticas"]], ["¿Las disposiciones del marco ético son obligatorias?", "No, son discrecionales/aspiracionales; las del marco de cumplimiento son de obligatorio cumplimiento", ["Sí: ambas lo son, y su incumplimiento da lugar a sanciones disciplinarias de las mismas características", "Solo las del marco de cumplimiento son discrecionales; las del marco ético son de obligatorio acatamiento", "Ninguna lo es: ambos marcos son orientaciones voluntarias que cada empleado aplica según su criterio"]], ["Marco de cumplimiento: ¿qué contiene?", "Reglas de conducta, procedimientos, instancias de gobierno, deberes claros y sanciones", ["Solo principios y valores generales, sin procedimientos ni consecuencias por su incumplimiento", "Solo la misión, la visión y la declaración de valores aprobadas por la junta directiva de la entidad", "Premisas aspiracionales de justicia y buena fe que cada persona interpreta según su experiencia"]], ["¿Qué es el CISI y su evaluación «Integrity Matters»?", "Organismo profesional que exige a sus miembros aprobar una evaluación de ética", ["Un regulador colombiano que supervisa a las comisionistas y aplica sanciones por faltas de ética", "Un tipo de fondo de inversión internacional que reinvierte sus utilidades en valores de renta fija", "Una prueba psicotécnica del AMV que se aplica a los candidatos antes de inscribirse en el RNPMV"]], ["Caso Patricia (firma física del cliente): opción recomendada", "Explicar al cliente que no puede firmar por él ni usar firma digital, y ofrecer mensajería para tomar la firma física con cuidados", ["Firmar a nombre del cliente con su autorización verbal, para no perder la operación ni el tiempo", "Celebrar la operación de inmediato y conseguir la firma física del cliente en los días siguientes", "Aceptar una firma digital del cliente aunque la política de la entidad exija expresamente la física, para no demorar la operación pactada"]], ["Caso Carlos (cambio de empleo): ¿qué es antiético?", "Llevarse el portafolio de clientes de la firma anterior al nuevo empleador", ["Aceptar el ascenso en la nueva firma y comunicarlo oportunamente a su actual empleador", "Hablar con el vicepresidente de la firma anterior antes de presentar su renuncia formal", "Conservar sus contactos personales públicos, como los que están disponibles en redes profesionales"]], ["Caso Carlos: enfoque óptimo", "Hablar directa y claramente con el nuevo empleador: no puede trasladar los clientes de la firma anterior", ["Llevar solo los clientes más activos y dejar a los de menor volumen en la firma anterior", "Trasladar únicamente los clientes que él mismo consiguió, porque le pertenecen a él y no a la firma que lo contrató", "Esperar a que la firma nueva o la autoridad prohíban expresamente la práctica antes de actuar"]], ["Caso Mariana (regalo de $50 millones en efectivo): opción recomendada", "Rechazar el regalo, explicarlo respetuosamente e informar al área de ética", ["Aceptarlo sin hacer comentarios, ya que es un gesto de agradecimiento por un buen servicio", "Aceptarlo y donarlo a una fundación, para que ella no obtenga ningún beneficio personal", "Aceptarlo con una autorización verbal del cliente que quede constancia en un correo interno"]], ["Caso Mariana: ¿por qué no es ético recibir bonos de clientes?", "Afecta objetividad e independencia, el cliente puede tener juicio afectado y la firma ya premia el buen servicio en su modelo de remuneración", ["Porque la ley lo prohíbe expresamente y las sanciones se imponen directamente al cliente", "Porque los bonos están sujetos a impuestos de renta y deben declararse ante la DIAN", "Solo porque el cliente es de edad avanzada y podría reclamar luego la devolución del dinero entregado como muestra de agradecimiento por el servicio"]]]}, {"name": "Normas reglamentarias en Colombia", "cards": [["¿Qué normas recogen principalmente las reglas de conducta del mercado de valores?", "Decreto 2555 de 2010 y Reglamento del AMV", ["Ley 964 de 2005 y Código de Comercio, que contienen todas las reglas de conducta aplicables", "Circular Básica Jurídica y Ley 1328", "Decreto 1854 y Ley 1778"]], ["Reglas de conducta del Decreto 2555 de 2010 que deben adoptar las entidades", "Código de ética/conducta, manejo de conflictos de interés, evitar uso de información privilegiada, organismos de monitoreo y consecuencias por incumplir", ["Un código de ética, sin necesidad de reglas de conducta ni de organismos que lo monitoreen", "Solo la capacitación periódica del personal, sin sanciones ni consecuencias definidas por incumplir", "El reporte trimestral a la Superfinanciera de las quejas recibidas, sin manejo de conflictos de interés ni organismos de monitoreo propios de la entidad"]], ["¿Dónde están los deberes generales de los intermediarios (art. 36.1 y ss.)?", "Reglamento del AMV", ["Decreto 2555 de 2010", "Ley 1748 de 2014", "Código de Comercio"]], ["Deberes generales: las personas autorreguladas deben actuar como…", "Expertos prudentes y diligentes, con transparencia, honestidad, lealtad, claridad, precisión, probidad comercial, seriedad, cumplimiento, imparcialidad, idoneidad y profesionalismo", ["Agentes neutrales que no responden por el resultado de sus recomendaciones ni por los riesgos", "Representantes del regulador ante los clientes, con deber de vigilar las operaciones de la entidad y de informar a la SFC cada una de las infracciones que conozcan", "Asesores informales, con deberes limitados a lo que se pacte en cada contrato con el inversionista"]], ["¿Quién define principios, políticas y procedimientos de conflictos de interés?", "La junta directiva o el organismo equivalente", ["El oficial de cumplimiento, quien además de definirlos los aplica y los audita en forma independiente", "El revisor fiscal, como parte de su función de verificación de los estados financieros de la entidad", "El AMV directamente, mediante circulares que obligan a las firmas a adoptar un modelo uniforme"]], ["Áreas con potencial conflicto de interés deben estar…", "Separadas física y operacionalmente, con procesos de decisión independientes", ["Bajo un mismo jefe, para facilitar la coordinación y la comunicación entre las áreas de la entidad", "En el mismo piso y con acceso compartido a la información, por razones de eficiencia operativa", "Supervisadas por el área comercial, que conoce mejor los intereses de los clientes de cada una"]], ["¿Qué organización internacional (IOSCO-OICV) orienta los códigos de ética de mercados?", "Organización Internacional de Comisiones de Valores", ["Organización Mundial del Comercio, que fija estándares internacionales de conducta para el sector", "Banco Mundial, que establece requisitos de capital para los intermediarios de valores de cada país", "Comité de Basilea, que emite principios de supervisión de bancos con presencia internacional"]], ["Art. 7.6.1.1.3 Decreto 2555: ¿qué principios orientadores establece?", "Transparencia del mercado, lealtad, profesionalismo, confidencialidad y reserva, uso adecuado de información y respeto de la ley", ["Rentabilidad, liquidez y seguridad de las inversiones que realicen las entidades y sus clientes", "Idoneidad, diligencia y probidad en el desarrollo de las actividades de intermediación de valores, así como la reserva sobre la información de los clientes", "Competencia, riesgo y capital como pilares de la actuación de los intermediarios en el mercado"]]]}, {"name": "Normas de conducta", "cards": [["¿Qué es un conflicto de intereses?", "Cuando hay que decidir entre alternativas con intereses incompatibles y no se puede decidir de forma objetiva e imparcial", ["Cuando una persona ocupa varios cargos en una compañía, sin importar la decisión que deba tomar", "Cuando una entidad compite con otra del mismo sector y debe decidir cuál cliente atender primero", "Cuando un cliente concentra una parte muy grande de los ingresos de la entidad y exige un trato especial frente a los demás clientes"]], ["¿Tener varios «sombreros» en una empresa es conflicto de intereses por sí mismo?", "No: es necesario que ante una decisión específica no se puedan favorecer objetivamente todos los intereses", ["Sí: siempre, porque desempeñar varios roles impide objetivamente decidir en favor de alguno de ellos", "Solo si la entidad es una comisionista de bolsa, que tiene deberes especiales frente a sus clientes", "Solo cuando el empleado recibe una comisión por cada uno de los roles que desempeña en la entidad"]], ["¿Lo reprochable en un conflicto de intereses es…?", "Tomar la decisión estando en esa situación (el conflicto en sí es inherente a cualquiera)", ["Tener el conflicto de intereses, que es siempre una falta aunque no se tome ninguna decisión", "Revelarlo ante el área de cumplimiento, porque expone a la entidad y al empleado a investigaciones", "Consultar al área de cumplimiento, porque demora los procesos de decisión de la entidad"]], ["Ante un posible conflicto de interés, ¿qué debe hacer la persona?", "Revelarlo al área de ética/cumplimiento/auditoría, abstenerse de decidir y no acceder ni entregar más información", ["Decidir con mucho cuidado y de forma documentada, para demostrar que se procuró la imparcialidad entre los intereses incompatibles que estaban en juego", "Pedirle a un amigo de confianza que tome la decisión por él, para evitar el compromiso personal", "Guardarlo en reserva mientras se resuelve la operación y revelarlo únicamente si hay una queja"]], ["Información pública", "La disponible y de fácil acceso para cualquiera por distintos canales (divulgada voluntariamente, por orden de autoridad o filtrada)", ["La que solo conocen los accionistas y la alta dirección y que se difunde por canales internos de la compañía, sin acceso para otros agentes del mercado", "La contenida en el reglamento interno de la entidad y que se entrega a todos los empleados", "La que se envía por correo a los clientes y que se considera divulgada a todo el mercado"]], ["Información confidencial", "La de alto impacto para empresas o agentes, disponible solo para grupos específicos y con protección especial", ["La que ya fue publicada por el emisor y puede ser consultada libremente por cualquier inversionista, sin ninguna protección especial", "La que comparten los analistas en sus informes de investigación con todos los clientes de la firma", "Cualquier dato de un cliente antiguo, aunque no tenga impacto ni requiera una protección especial"]], ["Información privilegiada", "Información concreta no divulgada que un inversionista medianamente diligente y prudente habría tenido en cuenta al negociar valores", ["Información pública de un emisor, difundida por los canales oficiales y disponible a todo el mercado antes de que se negocien los valores", "Opiniones y proyecciones de los analistas del mercado, divulgadas en informes de acceso general", "Datos históricos de precios y volúmenes publicados por la bolsa en sus boletines diarios"]], ["¿Qué reservas debe aplicar el sistema financiero?", "Reserva bancaria y reserva bursátil", ["Reserva legal y estatutaria sobre las utilidades", "Reserva técnica", "Reserva de liquidez"]], ["Ante la duda sobre el tipo de información, ¿cómo se debe tratar?", "Como confidencial y privilegiada", ["Como pública", "Como información interna sin restricción", "Según criterio del cliente"]], ["Usar información privilegiada en beneficio propio o de un tercero puede constituir…", "Un delito", ["Una falta leve", "Una práctica permitida", "Solo una sanción interna"]], ["Manipulación de precios", "Práctica ilegal/antiética para influir artificialmente en precios de activos y obtener beneficio particular", ["Ajuste natural de los precios por el juego normal de la oferta y la demanda en el mercado", "Estrategia lícita de creación de mercado para dar liquidez a un valor poco negociado en el sistema", "Cobertura de riesgos mediante instrumentos derivados para proteger el valor de un portafolio"]], ["«Defraudar» como deber especial implica…", "Abstenerse de obtener una ventaja excesiva para sí o un tercero afectando a otro o al mercado", ["Buscar maximizar la comisión propia, siempre que el cliente reciba la información del producto", "Cobrar tarifas más altas a clientes sofisticados, que cuentan con la capacidad de negociarlas", "Evitar competir con otros intermediarios, para proteger la participación de la firma en el mercado"]], ["Mal uso de los recursos del cliente", "Darles un uso no autorizado, inapropiado o diferente a la intención del cliente", ["Invertirlos de acuerdo con el mandato y el perfil del cliente, informando de los resultados", "Diversificarlos entre varios emisores y plazos, con el fin de reducir el riesgo de su portafolio", "Reportarlos a la autoridad competente cuando superan los topes de operaciones en efectivo"]]]}, {"name": "Leyes: transparencia y anticorrupción", "cards": [["Ley 1748 de 2014", "Transparencia de la información financiera: informar tasa efectiva y costo total de productos", ["Ley antisoborno que sanciona el pago de dádivas a servidores públicos extranjeros en negocios", "Ley de habeas data que regula la administración de información personal en bases de datos", "Ley de protección al consumidor financiero que crea la figura del defensor del consumidor"]], ["¿Qué es el Valor Total Unificado (VTU)?", "Valor único (en % efectivo anual y en pesos) que indica el total que realmente recibirá o pagará el cliente", ["La tasa nominal anual del producto, expresada sin incluir comisiones ni costos adicionales que cobre la entidad al cliente por su manejo", "El valor de la comisión que cobra la entidad por administrar y custodiar el producto", "El monto del capital invertido más los intereses causados hasta el vencimiento del título"]], ["¿Qué norma creó el VTU?", "Decreto 1854 de 2015 (modificó el Decreto 2555 de 2010)", ["Ley 1778 de 2016, que reformó el régimen de infracciones de las personas jurídicas", "Circular Externa 008 de 2024, expedida por la Superfinanciera para el sector vigilado", "Ley 964 de 2005, ley marco del mercado de valores que fijó los objetivos del Gobierno"]], ["Utilidad del VTU", "Permite comparar ofertas de distintas entidades de forma homogénea", ["Reduce la tasa de interés de los productos, al obligar a las entidades a competir en precio", "Elimina las comisiones de los productos, al incorporarlas en una tasa única sin costos", "Evita el uso de tasas efectivas, que el cliente suele confundir con las tasas nominales"]], ["Ley 1778 de 2016", "Ley antisoborno/anticorrupción: soborno transnacional", ["Ley de transparencia financiera que obliga a informar la tasa efectiva y el costo total", "Ley de lavado de activos que crea la UIAF y fija reportes de operaciones sospechosas", "Ley del mercado de valores que fija los objetivos de intervención del Gobierno"]], ["Soborno transnacional", "Dar, ofrecer o prometer a un servidor público extranjero cualquier beneficio a cambio de que realice, omita o retarde un acto relacionado con un negocio internacional", ["Pagar comisiones a intermediarios locales por conseguir clientes en operaciones del mercado, o regalar atenciones a funcionarios colombianos para obtener contratos", "Dar regalos de cortesía a clientes extranjeros por su vinculación con la entidad financiera", "Recibir sobornos de funcionarios colombianos para favorecer a un cliente en una operación"]], ["¿Qué entidad tiene facultades para combatir el soborno transnacional?", "Superintendencia de Sociedades", ["Superintendencia Financiera de Colombia, por ser la autoridad de supervisión", "AMV", "Fiscalía General"]], ["La Ley 1778 está centrada en sancionar a…", "La parte oferente (quien da, ofrece o promete)", ["El servidor público extranjero que recibe el beneficio a cambio de realizar el acto", "Solo los accionistas de la sociedad, que son quienes se benefician con el negocio", "Solo la junta directiva, por ser el órgano que aprueba las políticas anticorrupción"]], ["¿Cuántos principios tiene la directriz de la Supersociedades para un programa de ética empresarial eficaz?", "Ocho", ["Cinco", "Diez", "Doce"]], ["Actores preventivos clave contra la corrupción transnacional", "Revisor fiscal, oficial de cumplimiento, junta directiva, presidente y equipo ejecutivo", ["Solo el revisor fiscal, que es quien debe reportar los hechos a la autoridad competente", "Únicamente los clientes, que son quienes pueden denunciar los pagos irregulares que conozcan", "Exclusivamente el AMV, que vigila las conductas de los intermediarios en el mercado"]], ["Circular Externa 008 de mayo de 2024", "Pide a entidades vigiladas por la Superfinanciera fortalecer el control interno (incluye tono y cultura ética)", ["Crea el Valor Total Unificado para comparar los costos de los productos de inversión", "Regula el soborno transnacional y establece sanciones para las personas jurídicas", "Reforma el Reglamento del AMV y modifica el régimen disciplinario aplicable a sus miembros y a las personas naturales vinculadas a estos"]]]}]}, {"id": "mafi", "title": "Matemáticas Financieras", "code": "MAFI", "sections": [{"name": "Conceptos y fórmulas", "cards": [["Componentes de la tasa de interés comercial (ic)", "ic = (1+ir)(1+if)(1+ip)(1+il)(1+iv) − 1: real, inflación, riesgo de crédito, liquidez y vencimiento", ["ic = ir + if + ip + il + iv: la suma aritmética de la tasa real, la inflación y las primas de riesgo, liquidez y plazo", "ic = (1+ir)(1+if) − 1 − ip: la tasa real y la inflación combinadas, restando la prima de riesgo de crédito", "ic = ir × if × ip × il × iv: el producto de todos los componentes, expresados como tasas nominales anuales"]], ["Tres definiciones de tasa de interés (CFA)", "Tasa de descuento, tasa de retorno y costo de oportunidad (todas son una tasa porcentual)", ["Tasa nominal, tasa efectiva y tasa real (todas se expresan siempre como un porcentaje anual)", "Tasa vencida, tasa anticipada y tasa simple (las tres formas de pago de intereses en un periodo)", "Tasa de usura, DTF e IBR (los tres indicadores de referencia que se utilizan en Colombia)"]], ["Fórmula de interés efectivo a partir de periódico", "i_efectivo = (1 + i_periódico)^n − 1", ["i_efectivo = i_periódico × n", "i_efectivo = (1 + i_periódico × n)", "i_efectivo = i_periódico^n"]], ["Fórmula para pasar de efectiva a periódica", "i_periódico = (1 + i_efectivo)^(1/n) − 1", ["i_periódico = i_efectivo / n", "i_periódico = (1 + i_efectivo)^n − 1, con n el número de periodos", "i_periódico = i_efectivo × n"]], ["Interés simple vs compuesto", "Simple: intereses solo sobre el capital. Compuesto/efectivo: intereses sobre capital + intereses causados no pagados", ["Simple: intereses sobre capital más intereses causados. Compuesto: intereses solo sobre el capital inicial", "Simple: se capitalizan los intereses cada periodo. Compuesto: se pagan al final sin reinvertirlos", "Son equivalentes cuando el plazo es de un año; difieren solo en plazos superiores a doce meses"]], ["Tasa vencida", "Los intereses se pagan al final del periodo (primero se invierte, luego se reciben los rendimientos)", ["Los intereses se pagan al inicio del periodo (primero se reciben los rendimientos y luego se invierte)", "Los intereses se acumulan y se pagan junto con el capital solo al vencimiento del título o del crédito", "Se paga únicamente el capital y los intereses se reconocen después como un descuento sobre el valor"]], ["Tasa anticipada", "Forma comercial de expresar una tasa vencida: los intereses se descuentan al inicio (factoring, redescuento)", ["Los intereses se pagan al final del periodo, junto con la devolución del capital invertido o prestado", "Tasa que se ajusta periódicamente con la inflación del mes anterior certificada por el DANE", "Tasa exclusiva de los CDT, en la que los intereses se capitalizan al vencimiento del título"]], ["Conversión vencida ↔ anticipada", "iv = ia / (1 − ia) ; ia = iv / (1 + iv)", ["iv = ia × (1 + ia), aplicado a cada periodo", "iv = ia − 1", "ia = iv × (1 − iv)"]], ["Tasa nominal", "Tasa pactada para un periodo (p. ej. año) cuyos intereses se pagan en periodos menores; las fracciones son intereses simples o periódicos", ["Tasa pactada para un año cuyos intereses ya se capitalizan en periodos menores, sin necesidad de convertirla ni de ajustarla a otra periodicidad", "Tasa que ya descuenta la inflación del periodo y refleja el rendimiento real obtenido por el inversionista", "Tasa fijada solo para operaciones en dólares, cuyas fracciones se convierten con la tasa de cambio"]], ["12% N.A.T.V. significa…", "Cuatro cuotas trimestrales vencidas de 3% (periódica 3% T.V.), equivalente a 12,55% E.A.", ["12% efectivo anual: los intereses se liquidan una vez al año sobre el capital invertido al inicio", "12% cada trimestre: se reciben cuatro pagos de 12% sobre el capital y equivale a 48% anual", "3% efectivo anual: la tasa trimestral se divide entre cuatro para obtener la tasa de todo el año"]], ["Leer «N.A.T.V.»", "Nominal Anual, pagadero Trimestre Vencido", ["Neto Anual Total Vencido", "Nominal Anual Tasa Variable", "Nominal Ajustada Trimestral Vencida (capitalizable)"]], ["VPN: regla de decisión", "VPN ≥ 0 se acepta (renta lo exigido o más); VPN < 0 se rechaza", ["VPN < 0 se acepta (renta más de lo exigido); VPN ≥ 0 se rechaza porque excede el costo de oportunidad", "VPN = 0 se rechaza siempre, porque el proyecto no genera valor adicional sobre lo invertido", "Se acepta el proyecto con mayor valor absoluto del VPN, sea positivo o negativo, frente al inicial"]], ["¿Qué es el VPN?", "Valor presente de todos los flujos (incluido el inicial) descontados a la tasa mínima requerida o costo de oportunidad", ["Suma nominal de todos los flujos del proyecto, sin descontarlos ni considerar el momento de cada uno, más el flujo inicial", "Promedio de los flujos de caja positivos del proyecto, calculado sobre el número de periodos", "Flujo de caja final del proyecto, llevado al periodo cero con la tasa de inflación esperada"]], ["¿Qué es la TIR?", "La tasa que hace el VPN igual a cero; iguala ingresos y egresos en un mismo punto del tiempo", ["La tasa de inflación implícita en los flujos del proyecto, que hace igual el ingreso y el egreso", "La tasa libre de riesgo, que hace cero la prima del proyecto sobre la inversión alternativa", "La tasa máxima legal de usura, que hace el VPN igual al valor inicial invertido en el proyecto"]], ["Regla de decisión con TIR", "Se acepta si TIR ≥ tasa mínima requerida; se rechaza si es menor", ["Se acepta si la TIR es alta, sin importar el riesgo ni la tasa mínima requerida", "Se acepta si TIR < tasa requerida", "Se compara solo con la inflación"]], ["Supuesto de la TIR", "Reinversión de los flujos a la misma tasa TIR (la TIR modificada / RCV usa una tasa de reinversión conocida)", ["Reinversión de los flujos a la tasa libre de riesgo del mercado, sin importar el valor de la TIR del proyecto evaluado", "No existe supuesto de reinversión: los flujos intermedios se retiran y no generan rendimientos", "Reinversión de los flujos a la DTF vigente, que es la tasa de referencia del mercado colombiano"]], ["Calculadora: periodos sin flujo", "Se debe ingresar 0; si no, la calculadora ignora ese periodo", ["Se deja la celda en blanco; la calculadora interpreta el vacío como un periodo sin movimiento", "Se repite el flujo del periodo anterior para que la calculadora conserve la secuencia de pagos", "Se ingresa 1, para que la calculadora cuente el periodo sin asignarle un valor al flujo"]], ["Calculadora: varios flujos en un mismo periodo", "Calcular el flujo neto del periodo (la herramienta recibe un flujo por periodo)", ["Ingresar cada flujo en filas separadas, con el mismo periodo, y dejar que la calculadora los sume", "Ingresar solo el flujo de mayor valor absoluto, porque la herramienta no admite varios por periodo", "Promediar los flujos del periodo para ingresar un solo valor representativo en la calculadora"]], ["¿Qué mide el IPC?", "Variación porcentual promedio de precios al por menor de bienes y servicios que consumen los hogares; lo calcula el DANE mensualmente", ["Variación promedio de los precios al productor de bienes y servicios que se venden en el mercado local; lo calcula el Banco de la República cada mes", "Variación de la tasa de cambio peso-dólar durante el mes, certificada por la Superfinanciera", "Variación del PIB trimestral frente al mismo periodo del año anterior, publicada por el DANE"]], ["Tasa indizada al IPC (IPC + spread)", "Se combinan geométricamente: (1+IPC)(1+spread) − 1; las tasas efectivas no se suman", ["Se suman directamente: IPC + spread, porque ambas tasas son efectivas anuales y comparables", "Se restan: (IPC − spread), porque el spread reconoce la pérdida de poder adquisitivo del periodo", "Se multiplican: IPC × spread, porque ambas tasas se aplican sobre el capital inicial en cada periodo"]], ["¿Qué es la UVR?", "Unidad de Valor Real: refleja el poder adquisitivo según la variación del IPC del mes anterior; la certifica el Banco de la República (Ley 546 de 1999, créditos de vivienda)", ["Unidad de Valor del Dólar: refleja la tasa de cambio del mes anterior; la certifica la Superfinanciera (Ley 546 de 1999, créditos en moneda extranjera)", "Índice de la bolsa que mide el desempeño de las acciones más líquidas; lo calcula la BVC a diario", "Tasa de intervención del Banco de la República para créditos hipotecarios a tasa fija en pesos"]], ["Fórmula de la UVR", "UVRt = UVR15 × (1 + IPC)^(t/d)", ["UVRt = UVR15 + IPC", "UVRt = UVR15 × IPC", "UVRt = UVR15 / (1 + IPC)^(t/d) + spread"]], ["Rendimiento en pesos de un título en UVR", "(1 + tasa UVR)(1 + inflación) − 1", ["tasa UVR + inflación, sumadas de forma directa", "tasa UVR − inflación", "tasa UVR × inflación"]], ["¿Qué es el IBR?", "Indicador Bancario de Referencia: tasa de corto plazo (1 día, 1, 3 y 6 meses) creada por MinHacienda, BanRep y SFC; refleja el precio al que los bancos captan u ofrecen recursos; se publica nominal", ["Tasa de depósitos a 90 días que certifica la Superfinanciera cada semana, creada por MinHacienda, BanRep y SFC; refleja lo que captan los bancos y se expresa como N.A.T.A.", "Tasa máxima legal de usura que certifica la Superfinanciera para el crédito de consumo cada mes", "Índice de inflación mensual calculado por el DANE a partir de precios de hogares en 13 ciudades"]], ["IBR + margen", "Se suman linealmente porque ambos son nominales y con la misma capitalización", ["Se combinan geométricamente, (1+IBR)(1+margen) − 1, porque ambas son efectivas anuales", "Se restan linealmente, porque el margen representa un descuento sobre la tasa de referencia", "Se multiplican, porque cada tasa se aplica de forma sucesiva sobre el saldo de capital"]], ["¿Cómo se expresa la DTF?", "Nominal trimestre anticipada (N.A.T.A.); promedio ponderado de tasas de CDT a 90 días; vigencia semanal", ["Efectiva anual mes vencida (E.A.M.V.); promedio simple de las tasas de CDT a 180 días; vigencia mensual", "Nominal semestre vencida (N.S.V.); promedio ponderado de tasas de ahorro; vigencia trimestral", "Efectiva diaria; mediana de las tasas de CDT de los bancos; se recalcula todos los días hábiles"]], ["DTF + spread", "Se suman linealmente (ambas N.A.T.A.); luego se convierte a E.A.", ["Se combinan geométricamente, porque ambas son efectivas anuales y se capitalizan en forma continua", "Se restan: la DTF menos el spread, y luego se convierte la tasa resultante a efectiva anual", "Se multiplican, y luego se calcula la raíz cuarta para obtener una tasa trimestral vencida"]], ["Cálculo de la DTF", "Recolectar tasa y monto de CDT a 90 días de cada entidad, multiplicar tasa por monto, sumar y dividir entre el total de recursos", ["Promedio simple de las tasas de CDT a 90 días de todas las entidades, sin ponderar por los montos captados, y se publica cada viernes", "Mediana de las tasas de captación de las entidades, tomada el último día hábil de cada semana", "Tasa de intervención del Banco de la República más un margen de dos puntos porcentuales"]], ["Anualidad: características", "Pagos iguales, a intervalos iguales, misma tasa, número de pagos = número de periodos", ["Pagos crecientes en cada periodo, con la misma tasa y número de pagos igual a los periodos", "Pagos iguales realizados a intervalos distintos, con una tasa que varía según cada pago recibido", "Pagos iguales a intervalos iguales, con tasa variable en cada periodo y un número libre de pagos"]], ["Anualidad vencida: primer pago", "Un periodo después de la fecha de negociación (periodo 0)", ["En el periodo 0, es decir, en la misma fecha de negociación en que se pacta la anualidad", "Tras m periodos diferidos, que se acuerdan al momento de negociar la anualidad con el inversionista", "Al final del plazo total, cuando se liquida la totalidad de los intereses causados en la operación"]], ["Valor futuro de anualidad vencida", "VF = A × [((1+i)^n − 1) / i]", ["VF = A × [(1 − (1+i)^−n) / i]", "VF = A × n × i", "VF = A × (1+i)^n"]], ["Valor presente de anualidad vencida", "VP = A × [(1 − (1+i)^−n) / i]", ["VP = A × [((1+i)^n − 1) / i]", "VP = A × n", "VP = A / i^n"]], ["Valor presente de anualidad diferida", "VP = A × [(1 − (1+i)^−n) / i] × (1+i)^−m (m = periodos diferidos)", ["VP = A × (1+i)^m: se valora la anualidad como un pago único capitalizado durante los m periodos", "VP = A × [(1 − (1+i)^−n) / i] × (1+i)^m: se capitaliza en vez de descontar los periodos diferidos", "VP = A × n × m: el pago se multiplica por el número de pagos y por los periodos diferidos"]], ["Anualidad diferida", "Pagos iguales cuyo primer pago comienza después de m periodos diferidos", ["Pagos iguales que comienzan en el periodo 1 y se extienden por n periodos con tasa constante", "Pagos iguales con una tasa variable cuyo primer pago se realiza en el periodo cero de negociación", "Pago único que se efectúa al final de m periodos y que se descuenta a la tasa del mercado"]]]}, {"name": "Ejercicios numéricos", "cards": [["Inversión de $10.000.000 al 0,5% mensual vencido por 1 año con interés SIMPLE (sin reinvertir). ¿Valor final?", "$10.600.000", ["$10.616.778", "$10.050.000", "$11.200.000"]], ["Misma inversión ($10.000.000, 0,5% M.V., 1 año) reinvirtiendo los intereses (compuesto). ¿Valor final?", "$10.616.778", ["$10.600.000", "$11.236.000", "$10.563.958"]], ["¿Qué E.A. equivale a 6% N.A.T.V.?", "6,136%", ["6,000%", "6,168%", "6,090%"]], ["¿Qué E.A. equivale a 5% N.A.S.V.?", "5,062%", ["5,000%", "5,095%", "5,116%"]], ["¿Qué E.A. equivale a 6% N.A.M.V.?", "6,168%", ["6,000%", "6,136%", "6,090%"]], ["¿Qué E.A. equivale a 6% N.A.T.A. (trimestre anticipado)?", "6,232%", ["6,136%", "6,000%", "6,500%"]], ["¿Qué N.A.S.V. equivale a 5,062% E.A.?", "5,000%", ["5,062%", "2,531%", "4,969%"]], ["¿Qué N.A.T.V. equivale a 6% E.A.?", "5,870%", ["6,000%", "5,913%", "5,841%"]], ["CDT: precio 104,637%, valor final 105,345%, faltan 45 días (base 365). ¿TIR E.A.?", "5,62%", ["0,68%", "5,54%", "2,81%"]], ["TES corto plazo: precio 97,123%, valor final 100%, faltan 18 o"]], ["Sociedades calificadoras autorizadas en Colombia", "BRC Investor Services, Fitch Ratings Colombia y Value and Risk Rating", ["Moody's, S&P y Fitch Ratings, que tienen autorización de la SFC para calificar en Colombia", "Precia y PiP, que además de proveer precios califican la capacidad de pago de los emisores", "BVC y Deceval, que califican los valores inscritos en el RNVE antes de su oferta pública"]], ["¿Qué valores califican?", "Bonos ordinarios y subordinados (excepto Fogafín), papeles comerciales y valores de titularización", ["Acciones y TES, los dos valores con mayor volumen de negociación en el mercado local", "Solo CDT emitidos por bancos, para informar al inversionista sobre el riesgo crediticio del emisor", "Solo TES y bonos del Banco de la República, porque son los valores de deuda pública estandarizados"]], ["Publicación y revisión de calificaciones", "Se publican en 24 horas tras el comité; revisión periódica al menos anual; revisiones extraordinarias por anomalías", ["Se publican en 30 días tras el comité; se revisan cada 5 años y de forma extraordinaria si hay anomalías en el emisor", "Se mantienen sin revisión mientras el valor esté vigente y solo se actualizan al vencimiento", "Se revisan solo cuando el emisor lo solicite por escrito y asuma el costo de la nueva calificación"]], ["Grado de inversión (largo plazo)", "AAA hasta BBB (BRC); BB y menores son no inversión/alto riesgo", ["AAA hasta BB (BRC); B y menores son valores de alto riesgo que no pueden ser adquiridos", "Solo AAA: las demás escalas se consideran de riesgo medio o alto para los inversionistas", "Desde A hasta B (BRC); AAA y AA son calificaciones de riesgo mínimo de los valores"]], ["Escala corto plazo BRC", "BRC1 fuerte, BRC2 satisfactoria, BRC3 adecuada (grado de inversión); B, C, SD/D, E no inversión", ["BRC1 fuerte, BRC2 satisfactoria y B como grado de inversión; BRC3, C, D y E no son inversión", "BRC4 fuerte, BRC5 satisfactoria y BRC6 adecuada, de grado de inversión; las ["Contrato individual de administración de un portafolio, con aportes de una sola persona y gestión personalizada del patrimonio aportado, sin participación de otros inversionistas", "Vehículo para captar recursos de una sola persona jurídica, administrado de forma colectiva por un gestor", "Sociedad anónima que emite acciones al público y reparte dividendos entre los inversionistas del vehículo"]], ["¿Qué entidades pueden ser sociedades administradoras de FIC?", "Sociedades fiduciarias, sociedades comisionistas de bolsa y sociedades administradoras de inversión", ["Solo bancos comerciales y corporaciones financieras vigiladas por la Superintendencia Financiera", "Solo sociedades fiduciarias, que son las únicas autorizadas para administrar recursos de terceros", "Compañías de seguros, fondos de pensiones y sociedades administradoras de inversión únicamente"]], ["¿Qué tiene el inversionista de un FIC?", "Unidades (participaciones) del fondo, no la titularidad de cada activo del portafolio", ["Titularidad directa de cada uno de los activos del portafolio, en proporción a sus aportes", "Acciones de la sociedad administradora, que le dan derecho a una parte de sus utilidades", "Un crédito contra la sociedad administradora por el valor de lo aportado al fondo de inversión"]], ["Segregación en los FIC", "Los activos del FIC son un patrimonio independiente y separado de los de la sociedad administradora y de otros negocios que esta administre", ["El FIC se mezcla con el balance de la administradora, pero se lleva en cuentas separadas de ella", "Los activos del FIC pertenecen al gerente, quien responde personalmente por las pérdidas del fondo", "La segregación solo aplica a los FIC cerrados, porque en los abiertos el patrimonio es de la sociedad administradora y se lleva dentro de su balance general"]], ["Patrimonio mínimo de un FIC", "39.500 UVT (hoy expresado en 167.527,40 UVB)", ["10.000 UVT (hoy 42.411 UVB), que debe mantenerse durante toda la vigencia del fondo", "100.
