<style>
/* Layout: una columna, terminal compacta; pantallas: inicio > mazo > sesión > resultado */
:root{--bg:#f3f4f5;--panel:#ffffff;--fg:#14181c;--mute:#5d6770;--line:#d3d8dc;--accent:#0b5cad;--ok:#16794a;--bad:#b3261e;--okbg:#e3f3ea;--badbg:#fbe7e5;--mono:ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace;--sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1316;--panel:#171c21;--fg:#e6eaed;--mute:#8b96a0;--line:#2a3238;--accent:#5aa7ff;--ok:#4cc38a;--bad:#ff7b72;--okbg:#12281f;--badbg:#32191a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1316;--panel:#171c21;--fg:#e6eaed;--mute:#8b96a0;--line:#2a3238;--accent:#5aa7ff;--ok:#4cc38a;--bad:#ff7b72;--okbg:#12281f;--badbg:#32191a;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--sans);padding-inline:16px;padding-block:12px 40px}
#app{max-width:640px;margin:0 auto}
h1{font:600 13px var(--mono);letter-spacing:.08em;text-transform:uppercase;margin:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:12px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.mute{color:var(--mute)}
button{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:10px 12px;cursor:pointer;min-height:44px}
button:hover{border-color:var(--accent)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button.pri{color:#06121f}}
:root[data-theme="dark"] button.pri{color:#06121f}
button.sm{min-height:32px;padding:4px 10px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1 1 140px;min-width:0}
.list{display:flex;flex-direction:column;border:1px solid var(--line);background:var(--panel)}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 12px;border:0;border-bottom:1px solid var(--line);border-radius:0;text-align:left;background:transparent;width:100%}
.item:last-child{border-bottom:0}
.item .t{font-weight:600}
.item .code{font:600 11px var(--mono);color:var(--accent);letter-spacing:.06em}
.bar{height:4px;background:var(--line);grid-column:1/-1;margin-top:4px}
.bar i{display:block;height:100%;background:var(--ok)}
.sec{margin:16px 0 6px;font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.card{background:var(--panel);border:1px solid var(--line);padding:16px;min-height:200px;display:flex;flex-direction:column;justify-content:center;gap:10px;cursor:pointer;overflow-wrap:anywhere}
.card .lab{font:600 11px var(--mono);letter-spacing:.08em;color:var(--mute)}
.card .q{font-size:17px;font-weight:600}
.card .a{font-size:16px;border-top:1px solid var(--line);padding-top:10px}
.prog{display:flex;justify-content:space-between;font:12px var(--mono);color:var(--mute);margin-bottom:6px}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.opt{text-align:left;overflow-wrap:anywhere;display:block;width:100%}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad)}
.opt[disabled]{opacity:1;cursor:default;color:inherit}
.chk{display:flex;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.chk:last-child{border-bottom:0}
.chk input{width:18px;height:18px;flex:none}
.chk span{flex:1;min-width:0}
.score{font:600 40px var(--mono)}
.box{display:inline-block;font:11px var(--mono);padding:1px 5px;border:1px solid var(--line);color:var(--mute)}
select{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:8px;min-height:36px}
</style>

<script>
const DECKS=[{"id": "etic", "title": "Ética e Integridad", "code": "ETIC", "sections": [{"name": "Ética en la práctica", "cards": [["¿Qué cuatro preguntas debe hacerse antes de actuar cuando hacer lo correcto no es evidente?", "¿Mi acción es honesta, franca, transparente y justa?", ["¿Es legal, rentable, rápida y discreta?", "¿Es leal, prudente, diligente e imparcial?", "¿Es pública, aprobada, documentada y auditable?"]], ["¿Ética y ley son lo mismo?", "No: se puede actuar con poca ética sin violar la ley, pero quien infringe la ley actúa a la vez de forma ilegal y poco ética", ["Sí, todo lo ilegal es antiético y viceversa", "No: lo ético siempre es más permisivo que la ley", "Sí, la ética es solo el cumplimiento de la ley"]], ["Test de transparencia: ¿qué pregunta ayuda a evaluarla?", "¿Podría explicar claramente mi actuar a un tercero, a mi familia o ante una cámara sin reproche?", ["¿Obtuve beneficio económico?", "¿Lo autorizó mi jefe verbalmente?", "¿Es una costumbre del mercado?"]], ["¿Existen reglas éticas distintas para la vida privada y la laboral?", "No: si algo está mal, está mal sin importar la esfera; lo malo es malo aunque nadie vigile", ["Sí, en los negocios son más flexibles", "Sí, en el trabajo priman los resultados comerciales", "Solo en el sector financiero son más laxas"]], ["Encontrar un celular en un bus y quedárselo: ¿qué principio NO cumple?", "Ninguno de los cuatro: no es honesto, franco, transparente ni justo", ["Solo la transparencia", "Solo la justicia", "Cumple todos porque no lo robó"]], ["¿Por qué las «costumbres del mercado» son un precedente peligroso?", "Cambian en el tiempo y no siempre representan el actuar adecuado", ["Porque son ilegales", "Porque las prohíbe el Decreto 2555", "Porque siempre favorecen al cliente"]]]}, {"name": "Ética en los servicios financieros", "cards": [["En servicios financieros, ¿qué prelación de intereses rige?", "Primero los intereses del cliente, luego los de la entidad y por último los personales", ["Primero la entidad, luego el cliente, luego los personales", "Primero los personales, luego el cliente, luego la entidad", "Todos tienen igual prelación"]], ["¿A quién se considera «cliente»?", "Personas naturales o jurídicas con quienes las entidades tienen relaciones legales o contractuales para prestar productos o servicios", ["Solo quien ya tiene un producto activo", "Solo personas naturales inversionistas", "Solo quienes pagan comisión"]], ["¿Cuándo se puede revelar información de clientes?", "(i) Si es sobre actividades ilegales y la pide una autoridad, (ii) la regulación lo exige, o (iii) el cliente lo autoriza expresamente", ["Cuando lo pide cualquier compañero de la firma", "Cuando el cliente ya no tiene relación con la entidad", "Cuando la información ya es antigua"]], ["La confidencialidad cubre la información de…", "Clientes actuales, anteriores y potenciales", ["Solo clientes actuales", "Solo clientes con portafolio vigente", "Solo clientes institucionales"]], ["¿Qué debe revelar un profesional para proteger al cliente?", "Los potenciales conflictos de interés que afecten su objetividad, neutralidad o independencia", ["Su salario y comisiones anuales", "Sus inversiones personales completas", "Los resultados de otros clientes"]], ["Un vendedor ético de productos financieros debe informar al cliente…", "Riesgos, estructura, si la tasa es real o estimada, que recibirá comisión y los costos adicionales", ["Solo la rentabilidad esperada", "Solo lo que el cliente pregunte", "Solo los beneficios del producto"]], ["Frases típicas de un vendedor poco ético:", "«No se preocupe, yo no vendería algo en lo que no confiara» o «es una oportunidad limitada, decida ya»", ["«Le explico los riesgos y costos»", "«Tómese el tiempo que necesite»", "«Le informo mi comisión»"]], ["¿Por qué el sector financiero exige más que otros sectores?", "Por la especial trascendencia de la función financiera y porque los negocios se fundamentan en una relación de confianza", ["Porque las comisiones son más altas", "Porque no hay competencia", "Porque los productos son más baratos"]], ["Además de comportarse bien, ¿qué se espera de un profesional del sistema?", "Un actuar propositivo, prudente y diligente, incluida la denuncia de actos incorrectos de otros", ["Solo cumplir la ley", "Solo seguir órdenes del superior", "Evitar involucrarse en conductas de terceros"]]]}, {"name": "Evaluando dilemas y códigos", "cards": [["¿Cómo se debe actuar ante un dilema ético?", "Reflexionar antes de actuar y, si hay duda, consultar a cumplimiento, auditoría, embajadores de ética o colegas confiables", ["Actuar rápido y corregir después", "Decidir solo para no comprometer a otros", "Seguir la costumbre del área"]], ["¿Qué canales se usan para denunciar actos incorrectos?", "Línea ética, correos a áreas especializadas o denuncia ante el AMV", ["Solo redes sociales", "Solo el jefe directo", "Ninguno: es decisión personal"]], ["Código de ética vs. código de conducta", "Ética: principios y valores generales. Conducta: reglas detalladas, procedimientos, instancias y sanciones", ["Ética: reglas detalladas. Conducta: valores generales", "Son sinónimos", "Ética: sanciones. Conducta: valores"]], ["Marco ético vs. marco de cumplimiento: verbos típicos", "Ético: promover, fomentar, comprometerse, respetar. Cumplimiento: abstenerse, actuar, evitar, informar, revelar", ["Ético: abstenerse, evitar. Cumplimiento: promover, valorar", "Ambos usan los mismos verbos", "Ético: sancionar. Cumplimiento: respetar"]], ["¿Las disposiciones del marco ético son obligatorias?", "No, son discrecionales/aspiracionales; las del marco de cumplimiento son de obligatorio cumplimiento", ["Sí, ambas son obligatorias", "Solo las del cumplimiento son discrecionales", "Ninguna es obligatoria"]], ["Marco de cumplimiento: ¿qué contiene?", "Reglas de conducta, procedimientos, instancias de gobierno, deberes claros y sanciones", ["Solo principios y valores", "Solo la misión de la entidad", "Solo premisas de justicia"]], ["¿Qué es el CISI y su evaluación «Integrity Matters»?", "Organismo profesional que exige a sus miembros aprobar una evaluación de ética", ["Un regulador colombiano", "Un fondo de inversión", "Un tipo de prueba psicotécnica del AMV"]], ["Caso Patricia (firma física del cliente): opción recomendada", "Explicar al cliente que no puede firmar por él ni usar firma digital, y ofrecer mensajería para tomar la firma física con cuidados", ["Firmar a nombre del cliente con su autorización verbal", "Celebrar la operación y pedir la firma luego", "Aceptar la firma digital aunque la política exija física"]], ["Caso Carlos (cambio de empleo): ¿qué es antiético?", "Llevarse el portafolio de clientes de la firma anterior al nuevo empleador", ["Aceptar el ascenso", "Hablar con el vicepresidente", "Conservar contactos personales públicos"]], ["Caso Carlos: enfoque óptimo", "Hablar directa y claramente con el nuevo empleador: no puede trasladar los clientes de la firma anterior", ["Traer solo los clientes más activos", "Traer clientes que él mismo consiguió (70%)", "Esperar a que haya prohibición expresa"]], ["Caso Mariana (regalo de $50 millones en efectivo): opción recomendada", "Rechazar el regalo, explicarlo respetuosamente e informar al área de ética", ["Aceptarlo en silencio", "Aceptarlo y donarlo", "Aceptarlo con autorización verbal del cliente"]], ["Caso Mariana: ¿por qué no es ético recibir bonos de clientes?", "Afecta objetividad e independencia, el cliente puede tener juicio afectado y la firma ya premia el buen servicio en su modelo de remuneración", ["Porque la ley lo prohíbe expresamente", "Porque pagan impuestos", "Porque el cliente es de edad avanzada solamente"]]]}, {"name": "Normas reglamentarias en Colombia", "cards": [["¿Qué normas recogen principalmente las reglas de conducta del mercado de valores?", "Decreto 2555 de 2010 y Reglamento del AMV", ["Ley 964 de 2005 y Código de Comercio", "Circular Básica Jurídica y Ley 1328", "Decreto 1854 y Ley 1778"]], ["Reglas de conducta del Decreto 2555 de 2010 que deben adoptar las entidades", "Código de ética/conducta, manejo de conflictos de interés, evitar uso de información privilegiada, organismos de monitoreo y consecuencias por incumplir", ["Solo un código de ética", "Solo capacitar al personal", "Solo reportar a la Superfinanciera"]], ["¿Dónde están los deberes generales de los intermediarios (art. 36.1 y ss.)?", "Reglamento del AMV", ["Decreto 2555 de 2010", "Ley 1748 de 2014", "Código de Comercio"]], ["Deberes generales: las personas autorreguladas deben actuar como…", "Expertos prudentes y diligentes, con transparencia, honestidad, lealtad, claridad, precisión, probidad comercial, seriedad, cumplimiento, imparcialidad, idoneidad y profesionalismo", ["Agentes neutrales sin responsabilidad", "Representantes del regulador", "Asesores informales"]], ["¿Quién define principios, políticas y procedimientos de conflictos de interés?", "La junta directiva o el organismo equivalente", ["El oficial de cumplimiento", "El revisor fiscal", "El AMV directamente"]], ["Áreas con potencial conflicto de interés deben estar…", "Separadas física y operacionalmente, con procesos de decisión independientes", ["Bajo un mismo jefe", "En el mismo piso por eficiencia", "Supervisadas por comercial"]], ["¿Qué organización internacional (IOSCO-OICV) orienta los códigos de ética de mercados?", "Organización Internacional de Comisiones de Valores", ["Organización Mundial del Comercio", "Banco Mundial", "Comité de Basilea"]], ["Art. 7.6.1.1.3 Decreto 2555: ¿qué principios orientadores establece?", "Transparencia del mercado, lealtad, profesionalismo, confidencialidad y reserva, uso adecuado de información y respeto de la ley", ["Rentabilidad, liquidez y seguridad", "Idoneidad, diligencia y probidad", "Competencia, riesgo y capital"]]]}, {"name": "Normas de conducta", "cards": [["¿Qué es un conflicto de intereses?", "Cuando hay que decidir entre alternativas con intereses incompatibles y no se puede decidir de forma objetiva e imparcial", ["Tener varios roles en una empresa", "Competir con otra entidad", "Tener un cliente muy grande"]], ["¿Tener varios «sombreros» en una empresa es conflicto de intereses por sí mismo?", "No: es necesario que ante una decisión específica no se puedan favorecer objetivamente todos los intereses", ["Sí, siempre", "Solo si es en una comisionista", "Solo si hay comisión"]], ["¿Lo reprochable en un conflicto de intereses es…?", "Tomar la decisión estando en esa situación (el conflicto en sí es inherente a cualquiera)", ["Tener el conflicto", "Revelarlo", "Consultar al área de cumplimiento"]], ["Ante un posible conflicto de interés, ¿qué debe hacer la persona?", "Revelarlo al área de ética/cumplimiento/auditoría, abstenerse de decidir y no acceder ni entregar más información", ["Decidir con mucho cuidado", "Pedirle a un amigo que decida", "Guardarlo en reserva"]], ["Información pública", "La disponible y de fácil acceso para cualquiera por distintos canales (divulgada voluntariamente, por orden de autoridad o filtrada)", ["La que solo conocen los accionistas", "La que está en el reglamento interno", "La que se envía por correo a clientes"]], ["Información confidencial", "La de alto impacto para empresas o agentes, disponible solo para grupos específicos y con protección especial", ["La que ya fue publicada", "La que comparten los analistas", "Cualquier dato de un cliente antiguo"]], ["Información privilegiada", "Información concreta no divulgada que un inversionista medianamente diligente y prudente habría tenido en cuenta al negociar valores", ["Información pública de un emisor", "Opiniones de analistas", "Datos históricos de precios"]], ["¿Qué reservas debe aplicar el sistema financiero?", "Reserva bancaria y reserva bursátil", ["Reserva legal y estatutaria", "Reserva técnica", "Reserva de liquidez"]], ["Ante la duda sobre el tipo de información, ¿cómo se debe tratar?", "Como confidencial y privilegiada", ["Como pública", "Como información interna sin restricción", "Según criterio del cliente"]], ["Usar información privilegiada en beneficio propio o de un tercero puede constituir…", "Un delito", ["Una falta leve", "Una práctica permitida", "Solo una sanción interna"]], ["Manipulación de precios", "Práctica ilegal/antiética para influir artificialmente en precios de activos y obtener beneficio particular", ["Ajuste normal de oferta y demanda", "Estrategia de creación de mercado", "Cobertura de riesgos"]], ["«Defraudar» como deber especial implica…", "Abstenerse de obtener una ventaja excesiva para sí o un tercero afectando a otro o al mercado", ["Buscar maximizar la comisión", "Cobrar más a clientes sofisticados", "Evitar competir"]], ["Mal uso de los recursos del cliente", "Darles un uso no autorizado, inapropiado o diferente a la intención del cliente", ["Invertirlos según el mandato", "Diversificarlos", "Reportarlos a la autoridad"]]]}, {"name": "Leyes: transparencia y anticorrupción", "cards": [["Ley 1748 de 2014", "Transparencia de la información financiera: informar tasa efectiva y costo total de productos", ["Ley antisoborno", "Ley de habeas data", "Ley de protección al consumidor"]], ["¿Qué es el Valor Total Unificado (VTU)?", "Valor único (en % efectivo anual y en pesos) que indica el total que realmente recibirá o pagará el cliente", ["La tasa nominal del producto", "El valor de la comisión", "El monto del capital invertido"]], ["¿Qué norma creó el VTU?", "Decreto 1854 de 2015 (modificó el Decreto 2555 de 2010)", ["Ley 1778 de 2016", "Circular 008 de 2024", "Ley 964 de 2005"]], ["Utilidad del VTU", "Permite comparar ofertas de distintas entidades de forma homogénea", ["Reduce la tasa de interés", "Elimina las comisiones", "Evita el uso de tasas efectivas"]], ["Ley 1778 de 2016", "Ley antisoborno/anticorrupción: soborno transnacional", ["Ley de transparencia financiera", "Ley de lavado de activos", "Ley del mercado de valores"]], ["Soborno transnacional", "Dar, ofrecer o prometer a const KEY="amv-estudio-v1";
let S={box:{},seen:{},fail:{},size:20,theme:""};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function hash(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(36)}
const ALL=[];
DECKS.forEach(d=>d.sections.forEach(s=>s.cards.forEach(c=>{const x={id:d.id+":"+hash(c[0]),deck:d.id,sec:s.name,q:c[0],a:c[1],d:c[2]};c.x=x;ALL.push(x)})));
const byDeck=id=>ALL.filter(c=>c.deck===id);
const box=c=>S.box[c.id]||0;
const mastered=cs=>cs.filter(c=>box(c)>=3).length;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function pick(pool,n){ // prioriza cajas bajas, con azar dentro de cada caja
  const g=[[],[],[],[],[]];shuffle(pool).forEach(c=>g[Math.min(box(c),4)].push(c));
  const out=[].concat(...g);return shuffle(out.slice(0,n||out.length));
}
function mark(c,ok){
  S.seen[c.id]=1;
  if(ok)S.box[c.id]=Math.min(4,box(c)+1);else{S.box[c.id]=0;S.fail[c.id]=1}
  if(ok&&box(c)>=3)delete S.fail[c.id];
  save();
}
let sess=null;
const view=h=>{$("#app").innerHTML=h;window.scrollTo(0,0)};
function topbar(title,back){return `<div class="top"><h1>${title}</h1>${back?`<button class="sm" data-a="${back}">‹ Volver</button>`:`<button class="sm" data-a="theme">Tema</button>`}</div>`}

function home(){
  const seen=ALL.filter(c=>S.seen[c.id]).length,fails=ALL.filter(c=>S.fail[c.id]).length;
  view(topbar("Estudio AMV · Operador")+
  `<div class="mono mute" style="margin-bottom:10px">${ALL.length} tarjetas · ${seen} vistas · ${mastered(ALL)} dominadas · ${fails} falladas</div>
  <div class="row"><button class="pri" data-a="sim">Simulacro (todo)</button><button data-a="fails" ${fails?"":"disabled"}>Repasar falladas (${fails})</button></div>
  <div class="sec">Mazos</div><div class="list">`+
  DECKS.map(d=>{const cs=byDeck(d.id),m=mastered(cs);return `<button class="item" data-a="deck" data-id="${d.id}"><span class="t">${esc(d.title)}</span><span class="mono mute">${m}/${cs.length}</span><span class="code">${d.code}</span><span></span><div class="bar"><i style="width:${cs.length?100*m/cs.length:0}%"></i></div></button>`}).join("")+`</div>
  <div class="sec">Tarjetas por sesión</div>
  <select id="size">${[10,20,40,0].map(n=>`<option value="${n}" ${S.size===n?"selected":""}>${n||"Todas"}</option>`).join("")}</select>
  <p class="mute" style="font-size:12px;margin-top:20px">Las tarjetas se generaron a partir de las guías y pueden tener errores: confirma en el material oficial. Cajas: acertar sube la tarjeta de caja (0–4), fallar la devuelve a 0. Dominada = caja 3 o más.</p>`);
  $("#size").onchange=e=>{S.size=+e.target.value;save()};
}
function deck(id){
  const d=DECKS.find(x=>x.id===id);
  view(topbar(d.code+" · "+esc(d.title),"home")+
  `<div class="row"><button class="pri" data-a="go" data-m="flash" data-id="${id}">Tarjetas</button><button class="pri" data-a="go" data-m="quiz" data-id="${id}">Quiz</button></div>
  <div class="sec">Secciones (marca las que quieres)</div><div class="list">`+
  d.sections.map((s,i)=>{const cs=s.cards.map(c=>c.x);return `<label class="chk"><input type="checkbox" checked data-i="${i}"><span>${esc(s.name)}</span><span class="mono mute">${mastered(cs)}/${cs.length}</span></label>`}).join("")+`</div>`);
}
function startFrom(pool,mode,title,back){
  const n=S.size||pool.length;
  sess={mode,title,back,q:pick(pool,n),i:0,ok:0,bad:0,shown:false,miss:[]};
  if(!sess.q.length){home();return}
  next();
}
function next(){
  if(sess.i>=sess.q.length)return result();
  sess.mode==="flash"?flash():quiz();
}
function head(){return topbar(esc(sess.title),sess.back)+`<div class="prog"><span>${sess.i+1} / ${sess.q.length}</span><span>OK ${sess.ok} · NO ${sess.bad}</span></div>`}
function flash(){
  const c=sess.q[sess.i];
  view(head()+`<div class="card" data-a="flip"><div class="lab">PREGUNTA <span class="box">caja ${box(c)}</span></div><div class="q">${esc(c.q)}</div>${sess.shown?`<div class="a">${esc(c.a)}</div>`:`<div class="mute" style="font-size:13px">Toca para ver la respuesta</div>`}</div>`+
  (sess.shown?`<div class="row" style="margin-top:10px"><button data-a="rate" data-v="0" style="border-color:var(--bad)">No la sabía</button><button data-a="rate" data-v="1" style="border-color:var(--ok)">La sabía</button></div>`:""));
}
function quiz(){
  const c=sess.q[sess.i];
  if(!c.opts)c.opts=shuffle([c.a,...c.d]);
  const done=sess.picked!=null;
  view(head()+`<div class="card" style="min-height:0;cursor:default"><div class="lab">${esc(c.sec)}</div><div class="q">${esc(c.q)}</div></div><div class="opts">`+
  c.opts.map((o,k)=>{let cl="";if(done){if(o===c.a)cl="ok";else if(k===sess.picked)cl="bad"}return `<button class="opt ${cl}" data-a="pick" data-k="${k}" ${done?"disabled":""}>${esc(o)}</button>`}).join("")+`</div>`+
  (done?`<div class="row" style="margin-top:10px"><button class="pri" data-a="nextq">${sess.i+1>=sess.q.length?"Ver resultado":"Siguiente"}</button></div>`:""));
}
function result(){
  const n=sess.q.length,p=Math.round(100*sess.ok/n);
  view(topbar("Resultado",sess.back||"home")+`<div class="score">${sess.ok}/${n} <span class="mute" style="font-size:18px">${p}%</span></div>
  ${sess.miss.length?`<div class="sec">Falladas en esta sesión</div><div class="list">${sess.miss.map(c=>`<div class="item"><span class="t">${esc(c.q)}</span><span></span><span class="mute" style="grid-column:1/-1">${esc(c.a)}</span></div>`).join("")}</div>`:`<p class="mute">Sin falladas.</p>`}
  <div class="row" style="margin-top:14px"><button class="pri" data-a="again">Otra sesión</button><button data-a="home">Inicio</button></div>`);
}
let cur=null; // contexto de la última sesión para repetir
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-a]");if(!t)return;
  const a=t.dataset.a;
  if(a==="home")return home();
  if(a==="theme"){const r=document.documentElement;const d=matchMedia("(prefers-color-scheme:dark)").matches;const now=r.dataset.theme||(d?"dark":"light");r.dataset.theme=now==="dark"?"light":"dark";return}
  if(a==="deck")return deck(t.dataset.id);
  if(a==="sim"){cur={pool:ALL,mode:"quiz",title:"Simulacro",back:"home"};return startFrom(cur.pool,cur.mode,cur.title,cur.back)}
  if(a==="fails"){cur={pool:ALL.filter(c=>S.fail[c.id]),mode:"flash",title:"Falladas",back:"home"};return startFrom(cur.pool,cur.mode,cur.title,cur.back)}
  if(a==="go"){
    const id=t.dataset.id,d=DECKS.find(x=>x.id===id);
    const idx=[...document.querySelectorAll(".chk input")].filter(i=>i.checked).map(i=>+i.dataset.i);
    const pool=idx.flatMap(i=>d.sections[i].cards.map(c=>c.x));
    if(!pool.length)return;
    cur={pool,mode:t.dataset.m,title:d.code+(t.dataset.m==="quiz"?" · Quiz":" · Tarjetas"),back:"deck:"+id};
    return startFrom(pool,cur.mode,cur.title,cur.back);
  }
  if(a==="again")return startFrom(cur.pool,cur.mode,cur.title,cur.back);
  if(a==="flip"){sess.shown=true;return flash()}
  if(a==="rate"){const c=sess.q[sess.i],ok=t.dataset.v==="1";mark(c,ok);ok?sess.ok++:(sess.bad++,sess.miss.push(c));sess.i++;sess.shown=false;return next()}
  if(a==="pick"){const c=sess.q[sess.i],k=+t.dataset.k,ok=c.opts[k]===c.a;sess.picked=k;mark(c,ok);ok?sess.ok++:(sess.bad++,sess.miss.push(c));return quiz()}
  if(a==="nextq"){sess.i++;sess.picked=null;return next()}
});
// el botón Volver de una sesión apunta a "deck:ID" o "home"
document.addEventListener("click",e=>{const t=e.target.closest('[data-a^="deck:"]');if(t)deck(t.dataset.a.slice(5))},true);
home();
</script>
