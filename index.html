to"]], ["Metodologías de riesgo operacional (Basilea II)", "Indicador básico, estandarizado y medición avanzada", ["Solo el indicador básico, que es el único que Basilea II admite para el riesgo operacional", "VaR y stress testing, que se aplican a los riesgos de mercado y no al operacional", "Solo medición avanzada, que exige modelos internos aprobados por el supervisor financiero"]], ["Coeficiente de fondeo estable neto", "FED ≥ FER (≥100%); FED: pasivo y patrimonio ponderados por estabilidad; FER: activos ponderados por perfil de liquidez; horizonte de un año", ["CFEN < 100% es lo exigido, porque el fondeo disponible debe ser menor que el requerido", "El reporte mensual no se exige a las entidades, solo el trimestral a la SFC", "Solo para las fiduciarias, que son las únicas entidades obligadas a medir el fondeo estable, con un horizonte de seis meses y reporte trimestral a la SFC"]], ["Sistema de Control Interno (SCI)", "Políticas, principios, normas, procedimientos y mecanismos de verificación que dan seguridad razonable de lograr los objetivos de la organización", ["Solo la auditoría interna, que verifica el cumplimiento de las políticas y procedimientos", "Solo la contabilidad, que registra las transacciones y genera los estados financieros", "Un departamento especializado, que asume de forma exclusiva las funciones de control interno y reporta directamente a la asamblea de accionistas de la entidad"]], ["Objetivos del SCI", "Eficiencia y eficacia, prevenir fraudes y corrupción, gestionar riesgos, información confiable, cumplimiento normativo y proteger activos", ["Solo obtener ganancias para los accionistas con el menor costo posible de operación", "Solo el cumplimiento normativo, para evitar sanciones de las autoridades de supervisión, sin considerar la eficiencia, los fraudes ni la protección de los activos", "Reducir el personal y los costos de la entidad, para mejorar su eficiencia operativa"]], ["Principios del SCI", "Autocontrol, autorregulación y autogestión", ["Transparencia y lealtad, que orientan la actuación de los funcionarios con los clientes", "Prudencia y diligencia, que orientan las decisiones de inversión de la entidad vigilada", "Segregación y reserva, que protegen los activos y la información de los clientes"]], ["Autocontrol / autorregulación / autogestión", "Autocontrol: cada funcionario evalúa y controla su trabajo; autorregulación: desarrollar normas y métodos del SCI; autogestión: interpretar, coordinar, ejecutar y evaluar eficazmente", ["Autocontrol: lo hace el auditor interno; autorregulación: el regulador; autogestión: la junta directiva, que interpreta y evalúa de manera eficaz el sistema", "Autogestión: la ejerce el regulador, que interpreta y evalúa de manera eficaz el sistema", "Todos los ejerce la junta directiva, que es el único órgano responsable del control interno"]], ["Líneas de defensa", "1ª: áreas de negocio; 2ª: gestión de riesgos/cumplimiento; 3ª: auditoría interna; 4ª: supervisores/revisoría fiscal", ["1ª: auditoría interna; 2ª: áreas de negocio; 3ª: gestión de riesgos y cumplimiento; 4ª: junta directiva y asamblea de accionistas de la entidad", "1ª: gestión de riesgos; 2ª: negocio; 3ª: junta; 4ª: auditoría interna y externa", "1ª: junta directiva; 2ª: cumplimiento; 3ª: negocio; 4ª: revisoría fiscal y supervisores"]], ["Elementos del SCI (COSO)", "Ambiente de control, gestión de riesgos, actividades de control, información y comunicación y monitoreo", ["Planear, hacer, verificar y actuar, que son las cuatro etapas del ciclo de mejora continua", "Riesgo, mercado, crédito y liquidez, que son los cuatro componentes de la gestión de riesgos, junto con el ambiente de control y el monitoreo", "Reporte y cierre, que son las dos actividades finales del proceso de control interno"]], ["Estrategias de tratamiento del riesgo", "Evitar, mitigar, compartir, transferir, aceptar o aprovechar", ["Solo evitar el riesgo, renunciando a las actividades que lo generan en la entidad", "Solo transferir el riesgo a terceros, mediante seguros, coberturas o contratos", "Ignorar el riesgo cuando su probabilidad de ocurrencia es baja, aunque el impacto sea alto"]], ["Controles detectivos / preventivos / correctivos", "Detectivos: identifican desviaciones (auditoría); preventivos: evitan errores (segregación de funciones, rotación); correctivos: corrigen tras el error (asiento de ajuste)", ["Preventivos: corrigen tras el error; detectivos: evitan errores con segregación y rotación; correctivos: identifican las desviaciones con la auditoría interna", "Correctivos: segregación de funciones y rotación del personal, que evitan errores y fraudes", "Detectivos: rotación de personal, que evita errores; preventivos: auditoría, que los identifica"]], ["Seguridad de la información", "Confidencialidad, integridad y disponibilidad; calidad: efectividad, eficiencia y confiabilidad; y cumplimiento", ["Solo confidencialidad, que protege la información frente al acceso por personas no autorizadas, sin considerar la integridad ni la disponibilidad de los datos", "Rapidez y bajo costo en el procesamiento y almacenamiento de la información de la entidad", "Lealtad y prudencia en el manejo de los datos y de los activos de los clientes de la entidad"]], ["Evaluaciones independientes del SCI", "Las hacen el auditor interno y el revisor fiscal; reportan debilidades al comité de auditoría", ["El gerente general, quien evalúa el cumplimiento de las políticas y de los procedimientos", "El área comercial, que verifica el cumplimiento de los controles en cada operación", "El custodio de los valores, que evalúa los controles de los procesos de la entidad"]], ["Rol de la junta directiva en el SCI", "Aprobar estrategias y políticas del SCI, designar directivos de control y riesgo, garantizar independencia del auditor interno, aprobar recursos y evaluar informes (seguimiento al menos cada 6 meses)", ["Ejecutar las operaciones de la entidad y supervisar su registro contable en el día", "Registrar las transacciones y conciliar los saldos con los extractos de cada cliente", "Solo fijar los dividendos que se distribuyen a los accionistas al cierre de cada ejercicio, y aprobar el presupuesto anual de gastos de la administración"]], ["Rol del representante legal", "Implementar el SCI, comunicar políticas, certificar estados financieros, mantener canales de denuncia y programas antifraude, dejar constancia documental", ["Auditar el SCI de forma independiente y presentar el resultado a la asamblea de accionistas, además de elegir al revisor fiscal de la entidad", "Elegir al revisor fiscal de la entidad y fijar sus honorarios en el presupuesto anual", "Aprobar los dividendos y las reservas de la entidad al cierre de cada periodo contable"]], ["Contralor normativo (comisionistas, Ley 964/2005)", "Independiente; asiste a junta con voz pero sin voto; verifica conflictos de interés, separación de activos, clasificación de clientes, libro de órdenes, mejor ejecución, tarifas y RNPMV; reporta irregularidades a la junta y la SFC", ["Con voto en la junta directiva, que le permite incidir en las decisiones de la comisionista, y reporta solo al gerente general de la sociedad", "Empleado de la comisionista, que depende del gerente y le reporta sus hallazgos", "Elegido por el gerente general, que define sus funciones y evalúa su gestión cada año"]], ["Comité de auditoría", "Mínimo 3 miembros de la junta (mayoría independientes); se reúne al menos cada 3 meses; asesora y apoya a la junta; seguimiento de riesgos al menos cada 6 meses", ["Un solo miembro de la junta, que se encarga de revisar los informes del auditor interno", "Reuniones anuales con el auditor interno y el revisor fiscal, para presentar sus informes a la junta, con un mínimo de dos miembros independientes", "Sustituye a la junta directiva en la aprobación de las políticas del SCI y de riesgos"]]]}]}, {"id": "pens", "title": "Fondos de Pensiones y Cesantías", "code": "PENS", "sections": [{"name": "Sistema pensional y regímenes", "cards": [["Ley que creó las AFP y los fondos del RAIS", "Ley 100 de 1993 (las administradoras de cesantías nacieron con la Ley 50 de 1990)", ["Ley 546 de 1999, que regula la vivienda y los créditos hipotecarios (las de cesantías nacieron con la Ley 50 de 1990)", "Ley 1328 de 2009, que creó el esquema de multifondos (las de cesantías nacieron con la Ley 100 de 1993)", "Ley 964 de 2005, que reguló el mercado de valores (las de cesantías nacieron con la Ley 1328 de 2009)"]], ["¿Qué son las AFP?", "Sociedades de servicios financieros vigiladas por la SFC, con objeto social exclusivo, que administran fondos de pensiones obligatorias, cesantías, voluntarios y patrimonios autónomos pensionales", ["Entidades públicas del Ministerio de Trabajo que administran los fondos de pensiones obligatorias y de cesantías con recursos del presupuesto nacional", "Compañías de seguros vigiladas por la SFC que administran las rentas vitalicias de los pensionados", "Cooperativas de ahorro vigiladas por la Supersolidaria que administran los aportes voluntarios a pensión"]], ["Pilares del sistema de protección a la vejez", "Subsidiado (solidario), contributivo y voluntario", ["Público, privado y mixto", "Obligatorio, voluntario y estatal, según quién administre el ahorro", "Ahorro, seguro y renta"]], ["Sistema General de Pensiones (SGP): contingencias que cubre", "Vejez, invalidez y muerte; sus recursos no pertenecen a la Nación ni a las entidades que los administran", ["Salud y desempleo, que son las dos contingencias que cubre el sistema para los trabajadores", "Riesgos laborales, que se financian con la cotización a cargo de los empleadores de cada trabajador", "Solo vejez: la invalidez y la muerte están cubiertas por el sistema general de seguridad en salud"]], ["Regímenes del SGP", "RAIS (ahorro individual con solidaridad, AFP) y RPM (prima media con prestación definida, Colpensiones); excluyentes", ["RAIS y RPM pueden coexistir: el afiliado puede cotizar a ambos regímenes de forma simultánea y recibir una pensión de cada uno de ellos", "Solo el RAIS, porque el RPM fue eliminado con la Ley 100 de 1993 para nuevos afiliados", "Solo el RPM, administrado por Colpensiones, que es el único régimen vigente en la actualidad"]], ["RAIS vs. RPM: cálculo de la pensión", "RAIS: capital acumulado en la cuenta individual (+bono pensional); RPM: prestación definida según IBC de últimos 10 años o toda la vida (el mayor)", ["Iguales: en ambos regímenes la pensión se calcula con el capital acumulado en la cuenta individual, más el bono pensional que reconoce la Nación", "RAIS: según el IBC de los últimos 10 años; RPM: según el capital acumulado en la cuenta individual", "Ambos por capital: la diferencia es que en el RPM el capital lo administra el Estado"]], ["Edad de pensión RPM", "57 años mujeres y 62 años hombres", ["60 y 65", "55 y 60", "62 años mujeres y 57 años hombres, con 1.300 semanas"]], ["Edad de pensión en el RAIS", "A cualquier edad si el capital financia 110% de una pensión mínima; para la GPM: mujeres 57 y hombres 62", ["Solo a los 62 años: la pensión en el RAIS se reconoce a la misma edad para hombres y mujeres, aunque el capital financie más de una pensión mínima", "Solo a los 65 años, siempre que se hayan cotizado al menos 1.300 semanas al sistema", "Solo con 1.300 semanas cotizadas, sin importar el capital acumulado ni la edad del afiliado"]], ["¿La cuenta del RAIS es heredable?", "Sí, el saldo sin beneficiarios forma parte de la masa sucesoral; en el RPM no es heredable", ["No es heredable: al fallecer el afiliado sin beneficiarios, el saldo pasa al fondo común del RAIS", "Solo si el afiliado contrató un seguro adicional que cubra la devolución del saldo a sus herederos", "Solo en el RPM, donde el capital cotizado se traslada a los herederos del afiliado fallecido"]], ["Prestación si no se cumplen requisitos: RAIS vs. RPM", "RAIS: devolución de saldos (aportes + rendimientos); RPM: indemnización sustitutiva (aportes + IPC)", ["RAIS: indemnización sustitutiva (aportes + IPC); RPM: devolución de saldos (aportes + rendimientos)", "Ambas pagan devolución de saldos: aportes más los rendimientos que hayan generado en el periodo", "Ninguna: si no se cumplen los requisitos el afiliado pierde los aportes que hizo al sistema"]], ["Excedentes de libre disponibilidad", "Existen en el RAIS: pensión ≥70% del IBL (máx. 15 pensiones mínimas) y ≥110% de la pensión mínima legal", ["Existen en el RPM: pensión ≥70% del IBL y ≥110% de la pensión mínima legal vigente", "No existen: en ningún régimen se pueden retirar recursos por encima de la pensión mínima, porque todo el capital debe usarse para pagar la mesada", "Solo para pensionados que reciben una renta vitalicia superior a la mesada mínima legal"]], ["Financiación de pensión mínima en el RAIS", "Garantía estatal de pensión mínima, a la que aportan todos los afiliados (1,5% de la cotización)", ["Fondo común de reparto, al que aportan los afiliados del RPM con un porcentaje de cada cotización", "Presupuesto de Colpensiones, que cubre la diferencia con recursos de la Nación cuando no alcanza", "Seguro previsional contratado por las AFP, que cubre la diferencia hasta la pensión mínima"]], ["Cotización total para pensión y distribución", "16% de la cotización; 3% se destina a prima del seguro previsional y comisión de administración", ["10% de la cotización; 1% se destina a la prima del seguro previsional y a la comisión de la AFP", "20% de la cotización; 5% se destina a la prima del seguro previsional y a la comisión de la AFP", "12% de la cotización; 0% se destina a seguro, porque la comisión de la AFP la paga el empleador"]], ["Seguro previsional", "Póliza colectiva contratada por las AFP (licitación) que cubre invalidez y muerte de origen común; origen profesional lo cubren las ARL", ["Cubre la vejez del afiliado: garantiza el pago de la pensión cuando se agota el capital acumulado, y la contrata cada AFP por licitación con una aseguradora", "Lo paga el afiliado aparte, con una prima adicional a la cotización obligatoria al sistema", "Cubre los riesgos laborales, es decir, los accidentes y enfermedades de origen profesional"]], ["Requisito para pensión de invalidez/sobrevivientes", "Haber cotizado al menos 50 semanas en los 3 años anteriores al accidente o fallecimiento", ["Haber cotizado al menos 26 semanas en el año anterior al accidente o al fallecimiento", "Haber cotizado al menos 100 semanas en los 5 años anteriores al accidente o fallecimiento", "Haber cotizado al menos 1.300 semanas, que es el requisito de la pensión de vejez"]], ["Monto de pensión de vejez RPM (1.300 semanas)", "Entre 65% y 55% del IBL (decreciente por ingreso), +1,5% por cada 50 semanas adicionales sin superar 80%", ["100% del IBL, sin importar el ingreso del afiliado ni el número de semanas cotizadas", "40% fijo del IBL, que se incrementa 1,5% por cada 50 semanas sin límite máximo", "Solo el salario mínimo legal mensual, que es el valor de la mesada de todos los pensionados del régimen, más un 1,5% por cada 50 semanas cotizadas"]], ["Modalidades de pensión en el RAIS", "Renta vitalicia inmediata, retiro programado, retiro programado con renta vitalicia diferida, y otras aprobadas por la SFC", ["Solo renta vitalicia inmediata, que es la única modalidad que contratan las aseguradoras", "Solo retiro programado, que es la única modalidad que ofrecen las AFP a sus pensionados", "Capital único: el afiliado recibe todo su saldo en un solo pago al momento de pensionarse, o una renta temporal pagada con cargo al fondo especial"]], ["Renta vitalicia inmediata", "Se contrata irrevocablemente con una aseguradora una renta mensual hasta el fallecimiento; se ajusta anualmente con el IPC", ["La paga la AFP con cargo a la cuenta individual y se recalcula cada año con la expectativa de vida del pensionado, sin intervención de aseguradoras", "Es revocable: el pensionado puede cambiar de modalidad cuando lo considere conveniente", "Se calcula cada año con el saldo de la cuenta, según el rendimiento del fondo especial"]], ["Retiro programado", "La AFP paga la pensión con cargo a la cuenta individual (1/12 de una anualidad recalculada cada año); el saldo no puede ser inferior al capital de una renta de 1 SMMLV", ["La paga la aseguradora con una prima única que el afiliado entrega con su saldo acumulado y se ajusta anualmente con el IPC hasta el fallecimiento", "Es irrevocable: una vez elegida, el pensionado no puede cambiar de modalidad de pensión", "Es una renta fija en pesos, sin recálculo, que se paga hasta que el saldo se agota"]], ["Retiro programado con renta vitalicia diferida", "Combina ambos: retiro programado hasta que inicie la renta vitalicia diferida (que no puede ser inferior a la pensión mínima)", ["Solo renta temporal: se paga una cuota fija durante un periodo y luego se agota el saldo", "Solo vitalicia: se contrata con la aseguradora desde el primer día, sin periodo de retiro, y su valor no puede ser inferior a la pensión mínima", "No existe: la regulación no permite combinar dos modalidades de pensión en el RAIS"]], ["Retiro programado sin negociación del bono pensional", "Requiere capital que cubra el 130% de las mesadas proyectadas hasta la redención normal del bono (62 años hombres, 60 mujeres)", ["Requiere capital que cubra el 110% de las mesadas proyectadas hasta la redención del bono pensional, que se cumple a los 62 años en hombres y 60 en mujeres", "Requiere capital que cubra el 100% de las mesadas proyectadas hasta la redención del bono", "Requiere capital que cubra el 150% de las mesadas proyectadas hasta la redención del bono"]], ["Doble asesoría", "Para trasladarse de régimen, las administradoras de ambos regímenes deben asesorar al afiliado (proceso de 20 días hábiles)", ["Solo la del régimen destino: la administradora a la que se traslada asesora al afiliado", "No es obligatoria: el afiliado puede trasladarse con solo diligenciar el formulario respectivo en la administradora a la que quiere pasarse, sin asesoría", "Solo para los pensionados, que deben recibir asesoría antes de elegir su modalidad de pensión"]]]}, {"name": "AFP: gobierno, política y comités", "cards": [["Asamblea de accionistas de una AFP", "Máximo órgano social; elige junta directiva, revisor fiscal y defensor del consumidor; se reúne ordinariamente al menos 1 vez al año", ["Órgano ejecutivo que administra la AFP y representa a la sociedad ante los afiliados", "Solo aprueba las inversiones de los fondos y designa a los miembros del comité de riesgos, sin elegir la junta directiva ni al revisor fiscal", "Reúne solo a los afiliados, que eligen a la junta directiva y al revisor fiscal cada año"]], ["Junta directiva de una AFP", "Número impar, mínimo 5 miembros, con al menos 1 representante de afiliados y 1 de empleadores; aprueba política de inversión y asignación estratégica", ["3 miembros, de los cuales al menos 1 es independiente y 1 representa a los accionistas", "Solo accionistas, porque los afiliados y empleadores no participan en las decisiones de la AFP", "Número par y sin representantes de afiliados ni de empleadores, para evitar conflictos de interés, y sin competencia para aprobar la política de inversión"]], ["Revisor fiscal de los FPO", "Lo elige una comisión con 3 representantes de afiliados y accionistas de la AFP (el de la AFP lo elige la asamblea)", ["Lo elige el gerente de la AFP, que define sus funciones y le fija la remuneración cada año, con aprobación de la junta directiva de la administradora", "Lo elige la SFC, que verifica sus calidades y lo posesiona ante el supervisor financiero", "Lo elige el custodio de valores, que es quien está obligado a verificar los portafolios"]], ["Política de inversión: aprobación y divulgación", "La aprueba la junta por cada tipo de fondo y portafolio de cesantías; se divulga en la web y se envía a la SFC 15 días hábiles antes de publicarla", ["La aprueba el gerente de cada AFP, y se informa a la junta directiva en la sesión siguiente, sin que se envíe a la SFC antes de su divulgación", "Se envía a la SFC 1 día antes de publicarla, y se actualiza solo cuando cambia el gerente", "No se divulga: es un documento interno de la AFP que solo conoce la junta directiva"]], ["Asignación estratégica de activos: periodicidad y reporte", "Anual; modificaciones se envían a la SFC dentro de 3 días hábiles de su aprobación", ["Mensual; las modificaciones se envían a la SFC dentro de los 30 días siguientes a su aprobación", "Cada 5 años; las modificaciones se envían a la SFC dentro del mes siguiente a su aprobación", "Sin reporte a la SFC: la asignación estratégica es un documento interno de cada administradora"]], ["Comités de riesgo e inversiones", "Mínimo 5 miembros (número impar) designados por la junta, con al menos 1 miembro de junta y 1 independiente; el de inversiones toma las decisiones de inversión", ["Mínimo 3 miembros, designados por la junta, sin necesidad de que alguno sea independiente", "Mínimo 5 miembros, todos de la junta directiva, que no pueden incluir miembros independientes", "Mínimo 5 miembros elegidos por la asamblea de accionistas, que toman las decisiones de inversión y no pueden ser miembros de la junta directiva ni independientes"]], ["Conflicto de interés (art. 2.39.3.1.3)", "Situación en que hay intereses contrarios e incompatibles frente a un acto o negocio, para quien decide o incide en la decisión", ["Tener varios cargos en la AFP, aunque no deba tomar decisión que afecte a algún afiliado", "Competir con otra AFP por los mismos afiliados y por las mismas oportunidades de inversión, aun si no hay un acto o negocio que deba decidirse", "Tener inversiones personales en los mismos valores en que invierte alguno de los fondos"]], ["Uso indebido de información privilegiada", "Está tipificado como delito (art. 258 del Código Penal); principios: transparencia, reserva, utilización adecuada, lealtad, profesionalismo y adecuación a la ley", ["Falta disciplinaria leve que solo sanciona la propia AFP con una amonestación interna", "Práctica permitida, siempre que el administrador la revele a la junta directiva de la AFP, y sancionada solo con multa por la SFC cuando no la informe", "Solo una infracción tributaria, que sanciona la DIAN con una multa a la sociedad"]], ["Derechos políticos: participación relevante", "≥5% del capital de la emisora o de una emisión; o ≥5% del valor del fondo; la junta aprueba la política y se revisa al menos anualmente", ["≥1% del capital de la emisora o de una emisión, o ≥1% del valor del fondo", "≥25% del capital de la emisora o de una emisión, o ≥25% del valor del fondo; la política la aprueba el gerente y se revisa cada tres años", "≥50% del capital de la emisora o de una emisión, o ≥50% del valor del fondo"]], ["Gobierno corporativo de emisores receptores", "La AFP debe verificar que los emisores tengan estándares de gobierno corporativo (órganos, funciones, transparencia, protección de minoritarios, conflictos)", ["No tiene ese deber: el gobierno corporativo de los emisores es un asunto interno de cada empresa, que supervisa la SFC y no la administradora de fondos", "Lo verifica la SFC, que certifica el estándar de gobierno corporativo de cada emisor inscrito", "Solo en acciones: en los títulos de deuda no se exige verificar el gobierno corporativo"]], ["Registro de operaciones", "Mecanismo verificable que identifique cada operación y su fondo, sin afectar otro fondo, con respaldo diario automático, traza de auditoría y contingencia", ["Registro manual semanal en una hoja de cálculo, con revisión mensual del oficial de cumplimiento", "Sin respaldo ni contingencia: el registro se lleva en el sistema principal de la administradora", "Un solo registro para todos los fondos, para simplificar la conciliación diaria de las operaciones, con respaldo semanal y sin traza de auditoría"]]]}, {"name": "Multifondos y rentabilidad mínima", "cards": [["Esquema de multifondos (Ley 1328 de 2009)", "Las AFP ofrecen conservador, moderado, de mayor riesgo (acumulación) y fondo especial de retiro programado (desacumulación)", ["Solo un fondo, que invierte en renta fija y variable según la decisión del comité de inversiones", "Cinco fondos: conservador, moderado, mayor riesgo, fondo de cesantías y fondo de pensiones voluntarias, que cada AFP administra en un solo patrimonio", "Solo conservador y agresivo, que los afiliados eligen según su edad y su ingreso base de cotización"]], ["Fondo conservador / moderado / mayor riesgo", "Conservador: baja exposición al riesgo; moderado: riesgo medio (mitad de la vida laboral); mayor riesgo: afiliados jóvenes con horizonte largo", ["Mayor riesgo: pensionados con horizonte corto; conservador: jóvenes; moderado: mayor exposición", "Conservador: afiliados jóvenes con horizonte largo; mayor riesgo: afiliados próximos a pensionarse; moderado: pensionados con retiro programado", "Moderado: mayor exposición al riesgo, para afiliados jóvenes que inician su vida laboral"]], ["Fondo especial de retiro programado", "Administra los recursos de pensionados y beneficiarios de sobrevivencia (etapa de desacumulación)", ["Administra los recursos de los afiliados jóvenes que inician su etapa de acumulación, con mayor exposición a la renta variable local", "Administra los recursos de las cesantías que cada año consignan los empleadores", "Administra los aportes de los afiliados al fondo de pensiones voluntarias de la AFP"]], ["Cada tipo de fondo es…", "Un patrimonio autónomo con NIT propio, separación patrimonial, contabilidad independiente y cuentas propias", ["Parte del balance de la AFP, aunque se lleva en cuentas separadas de los recursos propios", "Sin NIT propio: se identifica con el de la administradora, que responde por sus obligaciones y lleva contabilidad consolidada de todos los fondos", "Una sola cuenta común: todos los fondos mezclan sus recursos y se separan al final del mes"]], ["Reglas de convergencia", "Obligatorias: los saldos y aportes migran gradualmente a fondos menos riesgosos hasta el conservador (mujeres desde ~42, hombres ~47 según tabla; conservador 100% a 54/59 años)", ["Opcionales: el afiliado decide si traslada su saldo hacia fondos de menor riesgo al acercarse", "Solo para nuevos aportes: el saldo acumulado permanece en el fondo que el afiliado eligió", "Aplican a los pensionados, que deben trasladar su saldo al fondo especial de retiro programado, y a los afiliados con menos de cinco años de cotización"]], ["Asignación por defecto", "Si el afiliado no elige, la AFP asigna el fondo según edad y género (mayor riesgo 100% hasta <42 mujeres / <47 hombres)", ["Siempre conservador, para proteger el capital de los afiliados sin importar su edad ni género", "Siempre mayor riesgo, porque el horizonte de largo plazo favorece las inversiones en renta variable, sin considerar la edad ni el género del afiliado", "Lo elige la SFC con base en la información que le reporta cada AFP sobre sus afiliados"]], ["Cotizaciones voluntarias al FPO", "Se administran en el mismo fondo del afiliado y están sujetas a convergencia; retiro con 6 meses de antelación", ["Retiro inmediato, porque son recursos del afiliado que no están sujetos a plazos de permanencia ni a las reglas de convergencia de los fondos", "Se administran en un fondo distinto al de las cotizaciones obligatorias, sin convergencia", "Sin convergencia: permanecen en el fondo elegido hasta que el afiliado solicite su traslado"]], ["Rentabilidad mínima obligatoria: quién la calcula", "La SFC la calcula, verifica mensualmente y divulga a más tardar el quinto día hábil siguiente", ["La AFP, que reporta la rentabilidad mensual de cada fondo a la SFC dentro de los 5 días", "El Banco de la República, que certifica la rentabilidad de los fondos cada trimestre", "MinHacienda, que la calcula con los portafolios de referencia y la divulga cada semestre"]], ["Periodos de cálculo de rentabilidad mínima", "Conservador 36 meses; moderado 48; mayor riesgo 60; retiro programado 48", ["12 meses para todos los fondos, para que refleje el desempeño reciente del mercado", "24 meses para todos los fondos, para que se compare el desempeño en ciclos económicos", "60 meses para todos los fondos, para que se compare el desempeño en el largo plazo"]], ["Ponderación de rentabilidad mínima", "Componente de referencia (portafolio de referencia) y promedio ponderado de rentabilidades de los fondos del mismo tipo (ej. conservador 20%/80%)", ["Solo el promedio ponderado de las rentabilidades de los fondos del mismo tipo de las AFP, sin considerar el portafolio de referencia de la SFC", "Solo el componente de referencia: el portafolio de referencia que define la SFC", "50% y 50% siempre, sin importar el tipo de fondo que se esté evaluando"]], ["Rentabilidad mínima: opciones A y B", "La menor entre A (suma de factores menos 30%/35%/40%) y B (menos 2/3/4 puntos porcentuales)", ["La mayor entre A y B, para que el cálculo sea más exigente con las administradoras", "El promedio entre A y B, para suavizar los efectos de la volatilidad de los mercados", "Solo A: la opción B se usa únicamente cuando no se dispone del portafolio de referencia"]], ["Si un fondo no alcanza la rentabilidad mínima", "La AFP responde con sus recursos propios, empezando por la reserva de estabilización de rendimientos", ["Lo cubre el Gobierno con recursos del presupuesto, a través del fondo de garantía", "Lo pierden los afiliados: la rentabilidad mínima es una referencia, no una obligación de la AFP, y la SFC solo puede ordenar su divulgación", "Lo cubre Fogafín con el seguro de depósitos, hasta el valor de la rentabilidad mínima"]], ["Reserva de estabilización de rendimientos", "Recursos propios de la AFP, mínimo 1% del valor del fondo; si se usa, se restablece en el mes siguiente; si es insuficiente la SFC multa 3,5% del defecto", ["Recursos de los afiliados, mínimo 5% del valor del fondo; si se usa, se restablece en el semestre siguiente, y si no alcanza, la SFC multa un 10% del defecto", "Recursos propios de la AFP, sin mínimo; si se usa, no hay obligación de restablecerla", "Recursos del afiliado, mínimo 1% del valor del fondo; si es insuficiente, la SFC multa 10%"]], ["Inversiones admisibles (ejemplos)", "Deuda pública, títulos de entidades vigiladas, titularizaciones, FIC, acciones, capital privado, inmobiliarios, emisores del exterior, derivados y repos activos, TTV", ["Solo TES, porque son los únicos valores que se consideran de riesgo mínimo para los fondos", "Solo acciones inscritas en bolsa, porque la renta variable es la que genera mayores retornos", "Criptoactivos y cualquier otro activo que la AFP considere rentable, sin límites regulatorios, además de los TES y los títulos de entidades vigiladas"]], ["Calificación de emisiones con varias calificadoras", "Se toma la calificación de menor nivel de riesgo (la más conservadora en la misma escala)", ["La de mayor nivel de riesgo, para reflejar la perspectiva más prudente sobre la emisión", "El promedio de las calificaciones asignadas, redondeado hacia la categoría inmediatamente inferior", "La que escoja la AFP según su política de inversión, siempre que esté en la misma escala"]], ["Custodia de títulos de fondos", "Deben mantenerse en depósitos centralizados autorizados por la SFC; el custodio no puede prestar ni usar activos para pagar deudas con la AFP", ["En la bóveda de la propia AFP, que los guarda y responde por ellos frente a los afiliados", "Pueden prestarse a terceros, siempre que el custodio lo autorice y se pague una comisión", "En cualquier banco que acepte guardarlos, con autorización previa del comité de inversiones, y el custodio puede prestarlos para cubrir deudas de la AFP"]]]}, {"name": "Fondos voluntarios de pensión (FVP)", "cards": [["Definición de FVP (art. 2.42.1.1.2)", "Vehículo con aportes de partícipes y patrocinadores y sus rendimientos, gestionados colectivamente para planes de pensiones de jubilación e invalidez", ["Fondo obligatorio donde aportan todos los trabajadores para financiar la pensión de vejez, con cotizaciones del empleador y administrado por las AFP", "Seguro de vida con ahorro que cubre invalidez y muerte de los asegurados de la compañía", "Fondo de cesantías donde los empleadores consignan el auxilio de cada trabajador cada año"]], ["Quiénes pueden administrar FVP", "Sociedades fiduciarias, AFP y compañías de seguros (con autorización de la SFC)", ["Solo las AFP, que son las únicas autorizadas para administrar recursos de pensiones voluntarias", "Solo los bancos, que cuentan con la red de oficinas para vincular a los partícipes", "Las sociedades comisionistas de bolsa, que pueden administrar los planes con autorización de la SFC"]], ["Partícipe, beneficiario y patrocinador", "Partícipe: persona natural para quien se crea el plan; beneficiario: quien recibe prestaciones; patrocinador: empresa/sindicato que crea un plan institucional", ["Patrocinador: el afiliado a quien se le crea el plan; partícipe: la empresa que lo crea", "Beneficiario: la empresa que crea el plan; patrocinador: quien recibe las prestaciones", "Partícipe: la administradora que gestiona los recursos; beneficiario: el patrocinador del plan; patrocinador: la persona natural para quien se crea el plan"]], ["Planes abiertos vs. institucionales", "Abiertos: cualquier persona natural; institucionales: trabajadores, contratistas o miembros de la entidad patrocinadora", ["Institucionales: pueden afiliarse todas las personas naturales; abiertos: solo los empleados", "Abiertos: solo empleados de la entidad patrocinadora; institucionales: cualquier persona natural interesada, que se vincula a través de la administradora", "Son iguales: ambos admiten a cualquier persona natural, y solo cambia el tipo de portafolio"]], ["Tipo de plan voluntario", "Solo de contribución definida; las prestaciones se determinan actuarialmente (capital, renta temporal o vitalicia)", ["De prestación definida: la prestación se fija de antemano y la administradora garantiza el monto, sin importar la rentabilidad de las inversiones del fondo", "Solo de capital: la prestación es siempre un pago único al momento de pensionarse", "Mixto: combina contribución definida con prestación definida según el tipo de partícipe"]], ["Planes institucionales condicionados", "El partícipe no dispone de los aportes hasta cumplir la condición suspensiva (consolidación); sin condición, los aportes se consolidan al aportar", ["Siempre disponibles: el partícipe puede retirarlos en cualquier momento sin cumplir condición, y el patrocinador no tiene derecho a recuperar los aportes", "La condición suspensiva la define solo el patrocinador, y no figura en el reglamento", "No existen: todos los planes institucionales consolidan los aportes al momento de aportar"]], ["Alternativas del FVP", "Estandarizada (la administradora decide portafolios y porcentajes), flexible (administradora elige portafolios, partícipe decide cuánto) y autogestionada (partícipe elige todo)", ["Solo estandarizada: la administradora decide los portafolios y los porcentajes de cada partícipe", "Todas las elige la administradora, que decide portafolios, porcentajes y aportes de cada partícipe, sin que éste pueda escoger entre alternativas", "Solo autogestionada: el partícipe elige los portafolios, los porcentajes y los aportes"]], ["Portafolios abiertos vs. cerrados", "Abiertos: entrar y redimir en cualquier momento; cerrados: solo en momentos definidos en el prospecto", ["Abiertos: entrada y redención en momentos definidos; cerrados: en cualquier momento", "Cerrados: entrada y redención en cualquier momento, sin límite de fechas ni de montos; abiertos: solo en los momentos definidos en el prospecto", "Son iguales: ambos permiten entrar y redimir en cualquier momento, con aviso previo"]], ["Documentos de información de FVP", "Reglamento de funcionamiento, prospecto (previo a la afiliación), documento descriptivo de alternativas estandarizadas, ficha técnica y extracto de cuenta", ["Solo el reglamento de funcionamiento, que contiene toda la información del plan", "Solo la ficha técnica, que se actualiza mensualmente y se publica en la página web de la administradora, además del extracto de cuenta que se envía cada año", "Solo el contrato de vinculación, que firman el partícipe y la administradora"]], ["Ficha técnica de FVP", "Una por portafolio; se actualiza mensualmente dentro de 5 días hábiles y se mantiene publicada al menos 12 meses", ["Una por administradora, que se actualiza anualmente y se publica por 3 meses", "Una por portafolio, que se actualiza semanalmente y se mantiene publicada por 30 días", "Una por portafolio, sin plazo de actualización ni de publicación mientras esté vigente, y solo se entrega al partícipe cuando la solicite por escrito"]], ["Normas sucesorales FVP", "Los recursos hacen parte de la masa sucesoral: se requiere trámite sucesoral", ["Se entregan al beneficiario sin trámite sucesoral, con la sola presentación del certificado", "No son heredables: al fallecer el partícipe los recursos quedan en el fondo", "Pasan a la AFP, que los destina a cubrir los costos de administración del plan"]], ["Inembargabilidad de cotizaciones voluntarias", "Gozan de inembargabilidad como las cuentas de ahorro (hasta un monto que actualiza la SFC), salvo créditos alimenticios", ["Siempre embargables, sin importar el monto ni la naturaleza de la obligación que se cobre, porque son recursos de ahorro voluntario del partícipe", "Siempre inembargables, incluso para el pago de créditos alimenticios del partícipe", "Inembargables solo para el patrocinador, que no responde por las deudas del partícipe"]], ["Asesoría en FVP", "Se rige por el Libro 40 del Decreto 2555 (perfil, conveniencia, recomendación); la da personal inscrito en el RNPMV y certificado", ["No requiere asesoría: basta con que el partícipe elija el portafolio al vincularse", "Solo informar al partícipe sobre las alternativas, sin perfilamiento ni recomendación", "La puede dar cualquier empleado de la administradora, sin certificación ni inscripción, siempre que se deje constancia escrita de la recomendación entregada"]]]}, {"name": "Cesantías, sector público y tributario", "cards": [["Portafolios del fondo de cesantías", "Corto plazo (horizontes cortos) y largo plazo (horizonte mayor a un año)", ["Solo largo plazo, que invierte en valores con vencimientos superiores a un año", "Conservador y agresivo, según la tolerancia al riesgo que elija el trabajador", "Uno solo, que invierte en valores de corto plazo para facilitar los retiros"]], ["Cesantías: monto y consignación", "Un mes de salario por año trabajado; el empleador consigna a más tardar el 14 de febrero del año siguiente", ["Un mes de salario por año trabajado; el empleador consigna a más tardar el 15 de enero del año siguiente, junto con los intereses sobre las cesantías", "Un mes de salario por año; el empleador consigna a más tardar el 31 de diciembre", "Un mes de salario por año; el empleador consigna a más tardar el 30 de marzo"]], ["Intereses sobre cesantías", "12% anual sobre el saldo, pagados al trabajador en enero", ["6% anual sobre el saldo, que el empleador paga al trabajador en el mes de enero", "24% anual sobre el saldo, que el fondo paga al trabajador en el mes de febrero", "No generan intereses: el trabajador solo recibe los rendimientos del fondo de cesantías"]], ["Retiro total de cesantías (casos)", "Terminación del contrato, sustitución de empleador, servicio militar, salario integral, fallecimiento", ["Compra de vivienda, que el trabajador puede financiar con retiro de todo su saldo", "Pago de educación, del trabajador o de sus hijos, con retiro de la totalidad del saldo, y compra de vivienda de interés social con autorización del empleador", "Impuestos de vivienda, que el trabajador puede pagar con el retiro de todo su saldo"]], ["Retiro parcial de cesantías (casos)", "Educación superior, ahorro programado/seguro educativo, adquisición de acciones del Estado, vivienda (compra, construcción, mejoras, préstamos), impuestos de vivienda", ["Terminación del contrato de trabajo, con retiro de la parte del saldo que el trabajador solicite, y sustitución de empleador cuando éste lo autorice", "Fallecimiento del trabajador, con retiro parcial del saldo a favor de sus beneficiarios", "Servicio militar del trabajador, con retiro parcial del saldo mientras dura el servicio"]], ["Traslado de cesantías", "La entidad destino responde en máx. 15 días hábiles", ["24 horas desde la solicitud, mediante el traslado electrónico entre las administradoras", "30 días calendario desde la solicitud, con aviso previo al empleador del trabajador", "6 meses desde la solicitud, con aprobación del empleador y de la entidad de origen"]], ["Normalización pensional", "Garantizar el pago del pasivo pensional (obligatoria o voluntaria); conmutación pensional = transferir la responsabilidad a un tercero (total o parcial)", ["Vender el pasivo pensional a un tercero, sin garantizar el pago de las mesadas a futuro", "Cancelar las pensiones vigentes con recursos del fondo y liberar a la entidad de su pago", "Reducir las mesadas de los pensionados, para ajustarlas al valor de los recursos disponibles, y trasladar el pasivo pensional a los fondos de pensiones"]], ["Régimen de inversión de patrimonios pensionales públicos", "Decreto 1068 de 2015 (FONPET y otros patrimonios autónomos públicos)", ["Solo el Decreto 2555 de 2010, que aplica a todas las entidades que administran recursos", "Ley 100 de 1993, que regula las inversiones de los fondos de pensiones obligatorias", "Decreto 1833 de 2016, que compila las normas del sistema general de pensiones"]], ["Aportes voluntarios al FPO: tratamiento y tope", "Ingreso no constitutivo de renta: hasta 25% del ingreso mensual y 2.500 UVT al año", ["Ingreso no constitutivo de renta hasta 30% del ingreso mensual y 3.800 UVT al año", "Ingreso no constitutivo de renta hasta 40% del ingreso mensual, sin tope anual en UVT", "Sin tope: todos los aportes voluntarios al FPO son ingreso no constitutivo de renta"]], ["Aportes voluntarios al FVP: tratamiento y tope", "Renta exenta (con AFC) hasta 30% del ingreso y 3.800 UVT por año; deducible para el patrocinador hasta 3.800 UVT por empleado", ["Renta exenta hasta 25% del ingreso y 2.500 UVT por año; no deducible para el patrocinador", "Sin beneficio tributario: los aportes voluntarios al FVP se tratan como ingreso gravado", "Renta exenta hasta 50% del ingreso y 10.000 UVT por año, para el partícipe y el patrocinador, sin necesidad de cumplir plazos de permanencia"]], ["Retiros FVP que mantienen la exención", "Permanencia mayor a 10 años, cumplir requisitos de pensión de vejez o destinar a vivienda (compra, amortización, leasing habitacional)", ["Permanencia mayor a 1 año o cualquier retiro, siempre que se informe a la administradora", "Cualquier retiro: la exención se mantiene mientras el partícipe pague la retención", "Solo el retiro por pensión de invalidez, que es el único que mantiene el beneficio tributario, junto con el retiro para pagar educación superior"]], ["Retención en retiros sin requisitos", "7% de retención sobre el capital si no hubo retención contingente (aportes desde 2017); si el retiro del FPO es para fines distintos a mayor pensión: 35% sobre capital y rendimientos", ["0% siempre: los retiros de aportes voluntarios nunca están sujetos a retención en la fuente", "20% siempre sobre el valor total del retiro, sin importar el origen de los aportes", "Solo el 4x1000: los retiros sin requisitos no generan retención, pero sí el impuesto financiero sobre el valor del retiro, en todos los casos"]], ["Exención del GMF (4x1000) en FVP", "Traslados hacia FVP entre cuentas del mismo titular y mismo establecimiento; retiros hasta el pago al pensionado/partícipe", ["No hay exención: todos los traslados y retiros del FVP causan el gravamen a los movimientos financieros, incluidos los que se pagan al pensionado", "Solo los retiros del FVP, hasta el valor de las pensiones que se paguen cada mes", "Solo las cesantías, que están exentas del gravamen cuando se consignan en el fondo"]], ["Pensiones exentas del impuesto de renta", "Hasta 1.000 UVT mensuales", ["500 UVT", "2.500 UVT", "Sin límite alguno, siempre que se paguen por una AFP"]]]}, {"name": "Protección al consumidor financiero", "cards": [["Principios de protección al consumidor en pensiones", "Debida diligencia, transparencia e información, manejo adecuado de conflictos de interés, educación financiera y prevalencia del interés del consumidor", ["Solo información, que es el único principio de protección que exige la ley a las administradoras", "Rentabilidad y liquidez, que son los principios que orientan la inversión de los fondos de pensiones, y la reserva sobre los datos de los afiliados", "Lealtad y reserva, que son los principios que rigen la actuación de los empleados de las AFP"]], ["Derechos del consumidor (ejemplos)", "Ser informado, elegir régimen/administradora/fondo, conocer inversiones y rentabilidades, recibir educación y presentar quejas ante la administradora, el defensor y la SFC", ["Fijar la rentabilidad de los fondos, que le garantiza la administradora cada trimestre", "Elegir al revisor fiscal de la AFP, junto con los accionistas, en la asamblea ordinaria, y recibir dividendos en proporción a su saldo acumulado", "Recibir dividendos de la administradora, en proporción al saldo de su cuenta individual"]], ["Defensor del consumidor financiero", "Tercero designado por la asamblea de accionistas por 2 años prorrogables; atiende quejas gratuitamente, concilia y recomienda; sus decisiones son obligatorias si se pactó previamente", ["Lo designa la SFC por periodos de 2 años; cobra por su servicio; sus decisiones son siempre obligatorias", "Lo designa la asamblea por 5 años; cobra honorarios al consumidor y sus decisiones son siempre obligatorias, aunque no se hayan pactado previamente", "Lo designa la junta directiva por 1 año; atiende quejas gratuitamente y sus decisiones no son obligatorias"]], ["Queja ante la SFC (mecanismo exprés)", "La SFC transmite la queja a la entidad, que debe responder en máximo 15 días y remitir la respuesta a la SFC", ["30 días hábiles, y debe remitir la respuesta a la SFC dentro de los 5 días siguientes, sin necesidad de enviarla también al consumidor que presentó la queja", "5 días hábiles, y debe remitir la respuesta al consumidor y a la SFC al mismo tiempo", "60 días calendario, y puede solicitar prórroga a la SFC por una sola vez"]], ["Acción jurisdiccional ante la SFC", "La SFC actúa como juez; verbal sumario (<40 SMMLV, sin recursos), verbal (40–150 SMMLV, ante juez civil del circuito) y >150 SMMLV (ante tribunal superior)", ["Siempre es obligatoria: el consumidor debe agotarla antes de acudir a la justicia ordinaria", "Solo la pueden usar las empresas, porque las personas naturales deben acudir a un juez civil, y la SFC solo decide cuando la cuantía supera 150 SMMLV", "Sin cuantía: la SFC decide cualquier controversia, sin importar el monto de lo reclamado"]], ["Deber de información: criterio de la Corte Suprema (SL 4360/2019)", "Firmar el formulario no basta: la AFP debe asegurar que el afiliado recibió información clara, cierta y oportuna y la comprendió", ["La firma del formulario basta para demostrar que el afiliado recibió la información y la comprendió", "Solo se exige en el RPM: en el RAIS la información se entrega por la página web de la AFP", "No existe deber de información: el afiliado debe consultar por su cuenta las características del régimen, y su firma en el formulario prueba que las conoce"]], ["Contenido mínimo de información (Ley 1328, art. 9)", "Características, derechos y obligaciones, condiciones y tarifas, forma de determinarlos, medidas de manejo seguro y consecuencias del incumplimiento", ["Solo las tarifas, que son lo único que la ley obliga a informar al consumidor financiero", "Solo la rentabilidad, que es el dato que determina la elección de la administradora", "Solo los derechos del consumidor, sin incluir las obligaciones ni las condiciones del producto, y las tarifas se informan solo cuando el consumidor las pida"]]]}]}, {"id": "aamv", "title": "Autorregulación del Mercado de Valores (AMV)", "code": "AAMV", "sections": [{"name": "Concepto, funciones y reglamento", "cards": [["Ley que dio base legal a la autorregulación en Colombia", "Ley 964 de 2005 (art. 25: autorregulación obligatoria para quienes hacen intermediación de valores)", ["Ley 100 de 1993, que creó el sistema de seguridad social y fijó el régimen de las AFP", "Ley 1328 de 2009, que reguló la protección al consumidor financiero y creó la figura del defensor", "Decreto 2555 de 2010 únicamente, que recopiló las normas del sector financiero y del mercado"]], ["Carácter del esquema de autorregulación", "Es intervenida: no es función pública, no sustituye la regulación/supervisión financiera; la SFC aprueba reglamentos obligatorios y supervisa; mercado de valores obligatorio y divisas voluntario", ["Es totalmente libre: no requiere aprobación de la SFC, sus reglamentos entran en vigencia al publicarse y rige igual en valores y en divisas, sin que la SFC supervise su aplicación", "Es una función pública delegada por el Estado, que sustituye la supervisión de la SFC en valores", "No requiere aprobación de la SFC en ningún caso; esta solo supervisa el cumplimiento de los reglamentos"]], ["Cuatro funciones de la autorregulación", "Normativa, supervisión, disciplinaria y de certificación", ["Normativa, comercial, fiscal y legal", "Regulación, custodia, liquidación y registro de operaciones, con intervención del regulador", "Solo disciplinaria y de certificación"]], ["Función normativa", "Expedir reglamentos (de valores, obligatorio; de divisas, voluntario) y cartas circulares (que no requieren aprobación de la SFC)", ["Aprobar las emisiones de valores y autorizar la oferta pública de los emisores ante el mercado, con el concepto previo del Comité de regulación de AMV", "Fijar las tasas de interés de referencia y la política de comisiones de los intermediarios", "Autorizar el funcionamiento de los intermediarios y sancionar a los que incumplan sus deberes"]], ["Cartas circulares únicas de AMV", "Divisas (CC 91 de 2018), certificación (CC 93 de 2018) y autorregulación en valores (CC 96 de 2019)", ["CC 100, CC 110 y CC 120, que compilan las reglas de valores, derivados y fondos de inversión", "Solo una carta circular única, que reúne todas las reglas de divisas, certificación y valores", "CC 1, CC 2 y CC 3, expedidas en 2006 cuando AMV inició sus funciones de autorregulación"]], ["¿Quién expide los reglamentos de autorregulación?", "El Consejo directivo de AMV, con aprobación de la SFC", ["La SFC, que los redacta y los somete a consulta pública antes de su entrada en vigencia", "El Tribunal disciplinario de AMV, con concepto favorable de la Sala de revisión del organismo", "La Asamblea de accionistas de AMV, que los aprueba sin intervención de la SFC"]], ["Proceso del reglamento de valores", "Publicar proyecto ≥15 días hábiles para comentarios; concepto favorable del Comité de regulación; concepto de la Sala de revisión (no vinculante); aprobación del Consejo; autorización de la SFC; rige al día siguiente de la ejecutoria y publicación en el boletín", ["Publicar el proyecto 5 días hábiles para comentarios; concepto del Comité de regulación; aprobación de la SFC; rige al día siguiente de su publicación en el boletín, sin aprobación del Consejo", "Aprobación de la SFC únicamente, sin publicación ni comentarios, y rige al día siguiente de la firma", "Publicar el proyecto 15 días; concepto de la Sala de revisión; aprobación del Consejo; rige de inmediato"]], ["Reglamento de divisas: paso adicional", "Se remite al Banco de la República, que emite opinión en 20 días hábiles (no necesariamente favorable); concepto del Comité de divisas", ["Se remite a la DIAN, que emite concepto en 20 días hábiles sobre los efectos tributarios", "No hay paso adicional: el reglamento de divisas se tramita igual que el de valores, sin consultar a otra entidad y sin concepto del Comité de divisas ni del Banco", "Requiere aprobación del Congreso de la República, que verifica su conformidad con la ley cambiaria"]], ["Función de supervisión", "Verificar el cumplimiento de normas del mercado y reglamentos; monitoreo, supervisión extra situ e in situ, con enfoque preventivo y basado en riesgos", ["Imponer sanciones a los miembros y a las personas vinculadas que incumplan sus deberes", "Certificar a los profesionales del mercado con un examen de conocimientos y antecedentes, con enfoque correctivo y basado en el cumplimiento formal de reglas", "Expedir normas y reglamentos aplicables a los intermediarios de valores y sus empleados"]], ["Supervisión extra situ vs. in situ", "Extra situ: obtención de información y documentos; in situ: visitas (generales, especiales/de conocimiento, conductuales)", ["Extra situ: visitas a las sedes de los autorregulados, generales y especiales; in situ: obtención de información y documentos mediante requerimientos escritos", "In situ: solicitud y análisis de documentos; extra situ: visitas generales, especiales y conductuales", "Son lo mismo: ambas se realizan con la información que remiten periódicamente los miembros de AMV"]], ["Queja vs. denuncia", "Queja: cliente o usuario de un autorregulado; denuncia: un tercero (puede ser anónima, incluso una PNV)", ["Queja: la presenta un tercero anónimo; denuncia: la presenta un cliente o usuario del autorregulado", "Denuncia: la presenta un cliente del autorregulado; queja: cualquier tercero, que puede ser anónimo", "Son lo mismo: ambas las presentan los clientes o usuarios y deben identificar al quejoso por nombre"]], ["Herramientas preventivas de AMV", "Cartas de recomendación, advertencias formales, actas de compromiso, cartas de instrucción, planes de ajuste y reuniones con altas gerencias", ["Multas, suspensiones y expulsión de los miembros y de las personas naturales vinculadas", "Solo cartas de recomendación, que son el único instrumento preventivo con que cuenta AMV", "Exámenes obligatorios de actualización y cursos de educación continuada para todas las PNV, junto con multas de menor cuantía y suspensiones de corta duración"]], ["Plan anual y informe de gestión a la SFC", "Se presentan dentro del primer mes de cada año, aprobados por el Consejo directivo y presentados por el representante legal", ["Se presentan cada trimestre, aprobados por la Asamblea y presentados por el presidente de AMV", "Se presentan a fin de año, aprobados por el Tribunal disciplinario y presentados por el auditor interno ante la SFC y la Asamblea de accionistas", "No se presentan: la SFC los consulta directamente en la página web de AMV cuando lo considere"]], ["Sujetos de autorregulación obligatoria", "Los intermediarios de valores (miembros) y sus personas naturales vinculadas (PNV)", ["Solo los emisores de valores inscritos en el RNVE y sus administradores y representantes legales", "Solo las personas naturales inscritas en el RNPMV, sin importar la entidad en que laboren", "Los inversionistas que realizan operaciones por medio de los intermediarios de valores"]], ["PNV (personas naturales vinculadas)", "Administradores y funcionarios vinculados que participan en intermediación, asesoría, gestión de riesgos y control, aunque no estén inscritos en el RNPMV", ["Solo los operadores que ejecutan órdenes en las mesas de negociación de los intermediarios y que estén inscritos en el RNPMV con certificación vigente", "Solo las personas que estén inscritas en el RNPMV, con certificación vigente ante AMV", "Los clientes del intermediario que mantienen una relación contractual de inversión con él"]], ["Autorregulación voluntaria", "Solo existe en el mercado de divisas (autorregulados en divisas con contrato de afiliación)", ["En valores: los intermediarios se afilian voluntariamente y se someten al reglamento de AMV", "En derivados: los participantes del mercado deciden libremente si se someten a la autorregulación", "En cesantías: las sociedades administradoras eligen si adoptan o no el reglamento de AMV"]], ["Organismos que pueden autorregular (art. 25 Ley 964)", "Organizaciones constituidas para ello, gremiales/profesionales, bolsas de valores, bolsas de commodities y administradores de sistemas de negociación; hoy AMV y la Bolsa Mercantil de Colombia", ["Solo la SFC, que ejerce de forma exclusiva la regulación, supervisión y disciplina del mercado de valores y de las bolsas de commodities y sus afiliados", "Solo los bancos, a través de sus asociaciones gremiales y sus áreas de cumplimiento", "Solo la BVC, que ejerce la autorregulación de los intermediarios que operan en sus sistemas"]]]}, {"name": "Función disciplinaria y proceso", "cards": [["Disciplina: carácter", "Instrumento de última instancia, enfocado en conductas de alto impacto; precedido por supervisión y herramientas preventivas", ["Primera medida: se aplica antes que la supervisión y las herramientas preventivas", "Reemplaza la supervisión: el AMV prioriza la sanción sobre las demás herramientas de control, y aplica a todas las conductas sin distinción de su impacto", "Solo aplica a personas jurídicas, que son los miembros del organismo de autorregulación"]], ["Matriz conductual", "Clasifica conductas en muy graves, graves y leves; no es taxativa ni norma de autorregulación, sirve para priorizar", ["Es una norma obligatoria de autorregulación que fija las sanciones aplicables a cada conducta, de manera taxativa, y que aprueba la SFC antes de su publicación", "Solo contiene conductas leves, porque las graves y muy graves están en el reglamento", "Es taxativa: solo se pueden investigar las conductas que aparecen listadas en la matriz"]], ["Conductas muy graves (ejemplos)", "Defraudación, manipulación, uso de información privilegiada, incumplimiento de lealtad/abstención, uso indebido de recursos de terceros, fraude en exámenes", ["Hablar durante el examen de certificación y registrar extemporáneamente las operaciones", "Ingreso de terceros a las mesas de negociación y la omisión de un deber de información", "Registro extemporáneo de operaciones y el incumplimiento de deberes de información al cliente, sin considerar la reincidencia ni el número de clientes afectados"]], ["Conductas graves (ejemplos)", "Incumplir normas de conflictos de interés, mejor ejecución y deberes generales; actuar sin certificación", ["Defraudación y manipulación del mercado, que afectan la integridad y la confianza del mismo", "Adulterar documentos de la entidad y el uso de información privilegiada en operaciones propias o de terceros, con afectación del mercado", "Manipulación de precios y uso indebido de los recursos de los clientes del intermediario"]], ["Conductas leves (ejemplos)", "Ingreso de terceros a mesas de negociación; hablar durante el examen; incumplir deberes de información (en principio)", ["Defraudación y manipulación de precios, que afectan de forma directa a los clientes del mercado, y el incumplimiento del deber de lealtad con ellos", "Uso de información privilegiada y el incumplimiento del deber de lealtad con los clientes", "Adulterar registros y el uso indebido de recursos de terceros que están bajo administración"]], ["Reincidencia (política de AMV)", "Misma conducta que originó una herramienta preventiva dentro de los 3 años siguientes a su adopción", ["Misma conducta dentro del año siguiente a la adopción de la herramienta preventiva", "Misma conducta dentro de los 5 años siguientes a la adopción de la herramienta preventiva", "Misma conducta dentro de los 10 años siguientes, sin importar la herramienta que se adoptó"]], ["Criterios para iniciar proceso en conductas no muy graves", "Reincidencia, afectación de recursos de protección social o muchos clientes, calidad del infractor (directivo, jefe de mesa), duración y actuación deliberada", ["Solo la cuantía de los recursos afectados, que debe superar un umbral fijado por el Consejo", "Solo la queja de un cliente, que debe estar acompañada de las pruebas del perjuicio sufrido", "La solicitud del cliente afectado, que puede pedir el inicio del proceso en cualquier momento, y la cuantía de la operación por encima de un umbral definido"]], ["Sujetos pasivos del proceso disciplinario", "Miembros de AMV, asociados voluntarios y PNV (incluso desvinculadas si los hechos ocurrieron cuando estaban vinculadas) y aspirantes en exámenes", ["Solo las personas jurídicas miembros de AMV, que responden por las conductas de sus empleados", "Solo las PNV vigentes al momento del proceso, aunque los hechos hayan ocurrido antes de su vinculación, y los miembros de AMV que sean personas jurídicas", "Los clientes de los miembros que hayan incumplido sus obligaciones frente al intermediario"]], ["Tipos de proceso", "Abreviado (conductas objetivas de lista taxativa) y general (los demás)", ["Solo general: todas las conductas se investigan con las mismas etapas y plazos de ley", "Ordinario y sumario, según la cuantía de los recursos de los clientes afectados por la conducta", "Verbal y escrito, según la forma en que el investigado presente sus explicaciones al tribunal"]], ["Proceso abreviado: inicio", "Con el pliego de cargos (sin auto de apertura); ej. ejercer sin certificación, exceso de límites de repo/simultánea/TTV, no registrar operaciones OTC, incumplir suspensiones", ["Con un auto de apertura, que identifica los hechos y es previo a la formulación de cargos", "Con una indagación preliminar, que verifica los hechos antes de decidir si formula el pliego, y con el auto de apertura que notifica al investigado", "Con una audiencia pública, en la que el investigado presenta sus descargos ante el Tribunal"]], ["Proceso general: etapas", "Indagación preliminar → auto de apertura → explicaciones (facultativas) → pruebas → archivo o pliego de cargos → decisión", ["Pliego de cargos → auto de apertura → explicaciones → pruebas → archivo o decisión", "Solo decisión: la Sala se pronuncia con base en la queja, sin etapas previas de investigación, y notifica al investigado el mismo día de su decisión", "Apertura sin pruebas: el investigado presenta explicaciones y la sala decide en una audiencia"]], ["Descargos tras el pliego de cargos", "10 días prorrogables por otros 10", ["5 días", "30 días prorrogables por otros 30 días", "1 día"]], ["Caducidad: plazo para iniciar proceso", "3 años desde los hechos (último acto en infracciones sucesivas; cese del deber en omisiones)", ["1 año desde los hechos (último acto en infracciones sucesivas; cese del deber en omisiones)", "5 años desde los hechos (último acto en infracciones sucesivas; cese del deber en omisiones)", "10 años desde los hechos, sin distinción entre infracciones sucesivas y omisiones"]], ["Plazo máximo para sancionar en primera instancia", "Un año desde el día hábil siguiente a la notificación del pliego de cargos", ["6 meses desde el día hábil siguiente a la notificación del pliego de cargos al investigado", "2 años desde el día hábil siguiente a la notificación del pliego de cargos al investigado", "3 años desde la ocurrencia de los hechos, que coincide con el plazo de caducidad"]], ["Tribunal disciplinario", "Órgano independiente; 12 salas de decisión (3 miembros: 2 independientes, 1 de la industria; al menos 1 abogado); la Sala de revisión conoce la apelación", ["Lo integra la SFC, con tres delegados que deciden en forma independiente de AMV, y la Sala de revisión es presidida por el Superintendente Financiero", "Una sola sala de decisión de cinco miembros, que además conoce de la apelación", "5 salas de 5 miembros, todos de la industria y elegidos por la Asamblea de AMV"]], ["Apelación", "Dentro de 8 días de la notificación de la decisión; contra la de segunda instancia no hay recursos (solo acción judicial por culpa grave o dolo dentro del mes)", ["Dentro de 30 días de la notificación de la decisión; contra la decisión de segunda instancia procede la tutela ante el juez, dentro del mes siguiente a la notificación", "Dentro de 1 día hábil de la notificación; contra la de segunda instancia procede reposición", "No hay apelación: las decisiones del Tribunal son definitivas y solo admiten acción judicial"]], ["Principio de oportunidad y colaboración", "AMV puede no iniciar proceso por costo/beneficio y materialidad; el programa de colaboración da reducción de 40% a 80% de multa/suspensión (promotor: 40–50%)", ["Siempre se sanciona: AMV no puede dejar de iniciar procesos por razones de costo o materialidad, y el programa de colaboración solo reduce multas hasta un 10%", "Reduce 10% de la multa o suspensión, y solo para el investigado que acepte los cargos", "Elimina todas las sanciones al investigado que colabore con la investigación de AMV"]], ["Colaboración: solicitud antes del proceso", "Puede presentarse siempre que falte al menos 1 año para la caducidad", ["Puede presentarse siempre que falte al menos 6 meses para la caducidad de la acción", "Puede presentarse siempre que falte al menos 5 años para la caducidad de la acción", "Puede presentarse en cualquier momento, aun después de notificado el pliego de cargos"]], ["ATA (Acuerdo de Terminación Anticipada)", "No es instancia: el investigado reconoce responsabilidad y acuerda la sanción; se solicita desde el inicio hasta el vencimiento del término de descargos; solo si no es reincidente", ["Es una apelación que el investigado presenta ante la Sala de revisión para reducir la sanción, dentro de los 8 días siguientes a la decisión de primera instancia", "Se pide solo tras el fallo de primera instancia, para acordar el pago de la multa en cuotas", "Elimina toda sanción, porque el investigado reconoce los hechos y colabora con las pruebas"]], ["ATA firmado directamente por AMV", "Si la sanción es amonestación, cursos o multa hasta 1.368 UVT (personas naturales) o 2.735 UVT (jurídicas); si es mayor, la Sala de revisión evalúa la proporcionalidad", rofesionalización, protección del inversionista, prevención del riesgo, actualización permanente y ausencia de asimetría regulatoria", ["Lealtad y reserva, que protegen la información de los candidatos y de los resultados", "Oportunidad y celeridad, que garantizan la rapidez en la presentación de los exámenes", "Disuasión y proporcionalidad, que guían la imposición de sanciones por fraude en exámenes, junto con la lealtad y la reserva sobre los resultados"]], ["Modalidades de certificación", "Directivo, operador, asesor financiero y digitador", ["Operador, corredor y analista, según las funciones que ejerce en la mesa de negociación", "Solo operador y asesor, porque directivo y digitador no requieren certificarse", "Gerente y auxiliar, según el nivel jerárquico que ocupen dentro del intermediario"]], ["Vigencia de certificaciones", "Operador, asesor y digitador: 3 años; directivo: 4 años (desde la aprobación de los exámenes)", ["Todas por 5 años desde la aprobación de los exámenes, sin distinguir la modalidad", "Operador 4 años; directivo 3 años (se invierte la vigencia de las dos modalidades)", "Todas por 1 año, que se renueva con la aprobación de cursos de educación continuada y la verificación de antecedentes en cada periodo"]], ["Quiénes presentan a los candidatos", "El miembro de AMV al que están vinculados (los corredores se presentan directamente); cualquier persona puede presentar los exámenes", ["Solo ellos mismos, de forma individual y sin participación de la entidad en que laboran, que no puede presentarlos ni acompañar su inscripción ante AMV", "La SFC, que los inscribe luego de verificar su idoneidad y antecedentes en el sistema", "La bolsa de valores, a través de las comisionistas que son miembros de sus sistemas"]], ["Directivo: quién debe certificarse", "Quien toma decisiones sobre estructura, límites, políticas o estrategias de intermediación o derivados, o dirige un área funcional (ej. gerente de riesgo de mercado); no los miembros de junta ni pres s operaciones cerradas por mesa"]], ["Conflicto de interés (art. 7.6.1.1.2)", "Escoger entre utilidad propia y la del cliente, la de un tercero vinculado y un cliente, o la de una operación y la transparencia del mercado", ["Solo las operaciones por cuenta propia que compitan con las del cliente en el mismo valor y al mismo precio, y no las que involucren a un tercero vinculado", "Tener varios cargos o roles dentro de una entidad, aunque no deba tomar decisión alguna", "Competir con otra entidad por los mismos clientes y por los mismos valores en el mercado"]], ["Reglas para administrar un CI", "Abstención, revelación, obtener decisión motivada (con autorización de las partes) y documentación", ["Ocultarlo, para evitar que el cliente pierda confianza y la entidad pierda la operación", "Decidir solo, con base en el criterio profesional y dejando constancia de la decisión", "Esperar un año antes de actuar, para que desaparezca el conflicto y las partes decidan con calma"]], ["Vinculados al intermediario", "Accionistas o beneficiarios del 10% o más, personas jurídicas donde el intermediario tiene 10%+, matriz/filiales y administradores", ["Accionistas o beneficiarios del 25% o más, y personas jurídicas donde el intermediario tenga 25%", "Accionistas o beneficiarios del 1% o más, y las personas jurídicas donde tenga el 1% o más", "Solo los accionistas del intermediario, sin incluir a la matriz, las filiales ni los administradores, que se consideran terceros independientes de la entidad"]], ["Deberes de PNV frente a CI", "Revelar partes relacionadas y regalos/dádivas, informar inversiones personales, no tener como clientes a partes relacionadas, separación entre operadores por cuenta propia y de terceros", ["Aceptar regalos de los clientes cuando sean de bajo valor, sin necesidad de informarlos", "Operar con sus familiares como clientes, siempre que se revele la relación a la entidad", "Mezclar funciones de operación por cuenta propia y de terceros, bajo una misma supervisión, y recibir regalos de bajo valor de los clientes sin necesidad de informarlos"]], ["Partes relacionadas (art. 38.11)", "Cónyuge/compañero y parientes hasta 2º de consanguinidad, 2º de afinidad y único civil; personas jurídicas donde es administrador o tiene participación material", ["Solo el cónyuge o compañero permanente, sin incluir a los parientes de la persona vinculada", "Solo los hijos de la persona natural vinculada, y las sociedades de las que ellos sean socios o administradores, sin incluir al cónyuge ni a los demás parientes", "Los amigos cercanos y las personas con las que se mantienen relaciones comerciales habituales"]], ["Documentación de órdenes", "Se reciben por medio verificable (grabación, escrito, IED); sin registro no hay orden", ["Basta el recuerdo del operador, que debe reconstruir la orden cuando el cliente la reclame", "Verbal sin registro, siempre que el cliente la confirme después por cualquier otro medio", "Solo escrito físico, firmado por el cliente en las oficinas del intermediario cada vez"]], ["Medio verificable", "Mecanismo institucional que registra de forma confiable momento e información (grabaciones telefónicas, escritos, intercambio electrónico de datos)", ["Conversación informal con el cliente, que el operador resume luego en un cuaderno personal, y mensajes de WhatsApp en su teléfono sin registro institucional", "Mensajes de WhatsApp en el teléfono personal del operador, sin registro institucional", "Correo electrónico personal del operador, sin respaldo ni custodia por parte de la entidad"]], ["Hechos relevantes de operación OTC (art. 39.2)", "Nombre del operador y contraparte, hora de cierre, especie, precio/tasa, cantidad, tipo y beneficiario", ["Solo el precio de la operación, que es el dato que permite verificar la mejor ejecución", "Solo la contraparte y la hora de cierre, que permiten identificar la entidad con la que se cerró la operación y verificar su cumplimiento en el sistema", "Solo la especie, que identifica el valor que se negoció y su emisor en el mercado"]], ["Conocimiento del cliente", "No se puede intermediar con clientes sin verificar los requisitos de conocimiento del cliente (perfil y SARLAFT)", ["Es opcional: se puede intermediar sin verificar los datos si el cliente conoce al operador, o si el monto de la operación es inferior a un umbral fijado por la entidad", "Solo se exige a los clientes extranjeros, por las reglas de control del mercado cambiario", "Solo se exige cuando los montos de la operación superan un umbral definido por la entidad"]], ["Deber de reserva: límites", "No es oponible a fines tributarios, ante autoridades judiciales/administrativas competentes ni ante AMV", ["Es absoluta: no puede levantarse ni ante las autoridades judiciales ni ante AMV", "Es oponible a AMV, que solo puede acceder a la información con orden judicial", "Es oponible a los jueces, que deben solicitarla a través de la SFC y no del intermediario, y también a AMV, salvo cuando se trate de operaciones sospechosas"]], ["Separación de activos", "Los activos de clientes se individualizan y separan de los propios y de otros clientes, con cuentas distintas; no se usan para garantizar operaciones propias o ajenas", ["Se pueden mezclar, siempre que se lleven registros contables individualizados por cada cliente", "Pueden garantizar operaciones propias del intermediario, con autorización escrita del cliente", "Son del intermediario, que responde frente al cliente por su valor al momento de la liquidación, y se pueden usar como garantía de operaciones propias con autorización"]], ["Mejor ejecución", "Buscar el mejor resultado posible para el cliente según instrucciones; políticas informadas previamente; el interés del cliente primero; para inversionistas, precio o tasa de mercado; mecanismos para acreditarlo", ["Maximizar la comisión del intermediario, siempre que el cliente reciba el precio de mercado, y aplicar la política que defina la entidad sin informarla previamente al cliente", "Solo rapidez en la ejecución, porque el tiempo es el factor que más afecta el precio", "No aplica a las operaciones OTC: el deber solo existe en los sistemas de negociación"]], ["Actividad de asesoría: etapas", "Perfil del inversionista, perfil del producto, análisis de conveniencia, recomendación profesional, entrega de información y distribución", ["Solo recomendación profesional, porque el perfil se obtiene al vincular al cliente", "Perfil del inversionista y venta del producto, que se realizan en una misma reunión", "Análisis de conveniencia y cobro de la tarifa, que se hacen una vez el cliente decide, sin necesidad de perfilar al inversionista ni al producto de forma previa"]], ["Si el cliente decide asumir mayor riesgo que el recomendado", "Debe dejarse registro previo en un medio verificable", ["Se prohíbe la operación: el intermediario no puede ejecutarla si supera el riesgo recomendado", "No se requiere registro: basta la decisión del cliente y la ejecución de la orden", "Se informa a la SFC dentro del mes siguiente, con los datos del cliente y de la operación"]], ["Actuar como contraparte en OTC con cliente inversionista", "Informarle expresamente que es su contraparte; no cobra comisión (puede cobrar margen según políticas); no aplica mejor ejecución, pero sí condiciones de mercado y asesoría", ["Cobrar comisión siempre, además del margen, porque presta un servicio de intermediación", "No informarle: la calidad de contraparte se infiere de la naturaleza de la operación OTC, y se cobra comisión además del margen, aplicando mejor ejecución", "Aplicar mejor ejecución, igual que cuando actúa como comisionista por cuenta del cliente"]], ["Valores de poca liquidez en OTC", "Debe ofrecerse información específica y advertir los riesgos", ["No se advierte: el cliente asume los riesgos al decidir negociar valores de poca liquidez", "Se prohíben: no pueden ofrecerse a clientes inversionistas en operaciones del mercado mostrador", "Solo se advierte a los clientes profesionales, que no necesitan información sobre el riesgo"]]]}, {"name": "Conductas sancionables y delitos", "cards": [["Información privilegiada: características", "Concreta, no divulgada al público y relevante/trascendente (capaz de influir en la cotización); no se requiere que el hecho ocurra, basta posibilidad razonable", ["Abstracta y general, que se refiere al comportamiento esperado del mercado y de la economía, y que ya fue divulgada al público por canales oficiales del mercado", "Pública y de fácil acceso, que ya fue divulgada por canales de información del mercado", "Irrelevante para la cotización, que no afecta las decisiones de un inversionista prudente"]], ["Conductas con información privilegiada (art. 47)", "Operar con ella, suministrarla a terceros (lo use o no) y recomendar operaciones con base en ella", ["Solo operar con ella, porque suministrarla o recomendar con base en ella no es infracción", "Solo suministrarla a terceros, aun cuando estos no la usen para realizar operaciones", "Solo recomendar operaciones con base en ella, sin necesidad de que se ejecute la operación"]], ["Rumores en redes sociales vs. información privilegiada", "Los rumores sin fuente fiable no son información privilegiada; la información de una junta sobre fusión en curso sí lo es", ["Los rumores sí lo son: cualquier comentario en redes sociales sobre un emisor es información privilegiada, aunque no provenga de una fuente confiable ni sea concreto", "La información de una junta sobre una fusión en curso no lo es, porque no se ha decidido", "Toda información sobre un emisor es privilegiada, sin importar si se divulgó o no al mercado"]], ["Art. 404 del Código de Comercio", "Prohíbe a administradores comprar/vender acciones de su sociedad sin autorización de la junta con 2/3 (salvo operaciones ajenas a la especulación)", ["Los permite siempre, sin necesidad de autorización de la junta directiva de la sociedad", "Solo prohíbe estas operaciones a los accionistas mayoritarios, no a los administradores", "No existe: el Código de Comercio no regula las operaciones de los administradores con acciones, y solo la Ley 964 de 2005 prohíbe operar con información privilegiada"]], ["Delito de información privilegiada (art. 258 CP)", "Prisión de 1 a 3 años y multa de 5 a 50 SMMLV", ["Prisión de 10 a 30 años y multa de 1.000 a 50.000 SMMLV, igual que el lavado de activos", "Prisión de 6 meses y multa de 1 a 5 SMMLV, que se suspende si el infractor repara", "Solo multa de 5 a 50 SMMLV, porque la conducta se considera una falta administrativa"]], ["Manipulación: conductas (art. 50 lit. b Ley 964)", "Afectar la libre formación de precios, manipular la liquidez, aparentar ofertas/demandas, subir/bajar/estabilizar artificialmente el precio, obstaculizar la libre concurrencia", ["Solo el spoofing, que es la única conducta que el reglamento califica como manipulación", "Solo el layering, que consiste en enviar muchas posturas para alterar la profundidad del libro de órdenes, y el spoofing, que solo aplica a derivados", "Estabilizar el precio de forma legítima mediante contratos de liquidez con el emisor"]], ["Spoofing y layering", "Spoofing: ingresar posturas falsas sin interés real para manipular; layering: «pintar pantallas» con muchas posturas", ["Operaciones cruzadas: compra y venta simultánea del mismo valor entre dos cuentas de un mismo operador; y churning: operaciones excesivas por cuenta del cliente", "Churning: operaciones excesivas por cuenta del cliente para generar comisiones al intermediario", "Collusion: acuerdo entre operadores para fijar el precio de un valor en el mercado"]], ["Otras prácticas manipulativas", "Collusion (acuerdo entre operadores), quote stuffing (algoritmos de alta frecuencia), activación de órdenes", ["Operaciones de contado de bajo monto, que se ejecutan en el sistema con liquidez normal", "Subastas de valores en el mercado primario, en las que se adjudica según la tasa de corte", "Repos con valores de deuda pública, que
