as/transferencias o más impuestos: baja DA, reduce deuda, puede ser recesiva", ["Más compras públicas o menos impuestos: sube la demanda agregada y puede generar inflación", "Siempre es expansiva, porque cualquier cambio en el gasto aumenta la demanda y el producto", "Reduce los impuestos y aumenta las transferencias, con lo cual crece la demanda agregada"]], ["Funciones básicas del BanRep (art. 371 Const.)", "Regular moneda, cambios y crédito; emitir moneda; administrar reservas; prestamista de última instancia y banquero de los establecimientos de crédito; agente fiscal del gobierno", ["Supervisar a los bancos y a los demás establecimientos de crédito, y sancionar sus infracciones, además de emitir los bonos del Estado y recaudar impuestos", "Recaudar los impuestos nacionales y administrar el presupuesto general en nombre del Gobierno", "Emitir los bonos del Estado y administrar la deuda pública interna y externa de la Nación"]], ["Junta Directiva del BanRep", "7 miembros: ministro de Hacienda (preside), gerente del Banco y 5 de dedicación exclusiva designados por el Presidente (4 años prorrogables)", ["5 miembros: ministro de Hacienda (preside), gerente y 3 designados por el Presidente por periodos de 4 años prorrogables, elegidos por el Congreso", "9 miembros: ministro de Hacienda (preside), gerente y 7 designados por el Congreso (5 años)", "7 miembros, todos elegidos por el Congreso de la República por periodos de cuatro años"]], ["Superintendencia Financiera de Colombia", "Organismo técnico adscrito a MinHacienda; inspección, vigilancia y control de entidades financieras, bursátiles y aseguradoras; estabilidad, seguridad y confianza del sistema", ["Entidad privada sin ánimo de lucro que vigila a las entidades financieras con recursos del propio sector, sin dependencia del Gobierno nacional", "Entidad adscrita al Banco de la República que regula la política monetaria y cambiaria del país", "Entidad que regula la política monetaria y fija la tasa de intervención con la Junta del Banco"]], ["Funciones del Ministerio de Hacienda", "Política fiscal, presupuesto, tesoro, deuda pública, coordinación con DIAN y regulación con la SFC", ["Regular la moneda, los cambios y el crédito, y actuar como banquero de los bancos comerciales", "Supervisar el mercado de valores y sancionar a los intermediarios que incumplan las normas", "Emitir la moneda legal y administrar las reservas internacionales de la República"]], ["Fogafín", "Protege ahorros en entidades inscritas (seguro de depósitos hasta COP 50 millones por persona y entidad, 2023); adscrito a MinHacienda", ["Autoriza las emisiones de valores y mantiene el registro de emisores inscritos en el RNVE", "Supervisa a los intermediarios y sanciona sus incumplimientos; está adscrito a la Superfinanciera y autoriza las emisiones de valores en el mercado", "Fija la tasa de usura cada mes y certifica el interés bancario corriente para los créditos"]], ["AMV", "Entidad privada sin ánimo de lucro creada en 2006; regulación, supervisión, disciplina y profesionalización (certificación)", ["Entidad pública adscrita a MinHacienda, creada en 2006 con funciones de regulación, supervisión y sanción a los intermediarios del mercado de valores", "Entidad privada creada en 1991 con la Constitución, que regula y vigila a los intermediarios", "Solo certifica a los profesionales del mercado; no tiene funciones de supervisión ni disciplina"]]]}, {"name": "Estados financieros y razones", "cards": [["Juego completo de estados financieros (NIIF)", "Situación financiera, resultado integral, flujo de efectivo, cambios en el patrimonio y notas (con periodo anterior)", ["Solo balance general y estado de pérdidas y ganancias, con las notas del periodo actual", "Balance general, nómina e inventarios, con la información comparativa del periodo anterior y el dictamen del revisor fiscal de la entidad", "Auditoría externa y notas a los estados, sin flujo de efectivo ni cambios en el patrimonio"]], ["Ecuación contable básica", "Activo = Pasivo + Patrimonio", ["Activo = Patrimonio − Pasivo", "Pasivo = Activo + Patrimonio", "Patrimonio = Activo + Pasivo"]], ["Activo corriente vs. no corriente", "Corriente: convertible en efectivo en ≤ 1 año; no corriente: > 1 año", ["Corriente: convertible en efectivo en más de un año; no corriente: en menos de un año", "No corriente: el efectivo y los equivalentes; corriente: los activos fijos de la entidad", "Ambos se convierten en efectivo en menos de un año; se diferencian por su naturaleza contable"]], ["Pasivo corriente", "Obligaciones a pagar en menos de un año (proveedores, deuda corto plazo, impuestos)", ["Obligaciones a pagar en más de un año, como los bonos y los créditos de largo plazo", "Capital emitido por los accionistas, que se registra por el valor nominal de sus aportes", "Utilidades retenidas de periodos anteriores, que no se han distribuido a los accionistas"]], ["Patrimonio", "Valor residual: activo − pasivo; aportes, utilidades retenidas, prima en emisión y valorizaciones", ["Pasivo más activo: la suma de lo que la empresa tiene y de lo que debe a terceros", "Deudas con terceros, como los proveedores, la deuda financiera y los impuestos por pagar", "Solo el capital emitido, es decir, los aportes de los accionistas al constituir la sociedad"]], ["Capex vs. opex", "Capex: adquisición de activos fijos; opex: gastos operacionales", ["Opex: adquisición de activos fijos; capex: gastos operacionales de funcionamiento", "Capex: gasto de funcionamiento recurrente, como los salarios, arrendamientos y servicios públicos", "Son iguales: ambos son egresos en que incurre la empresa para mantener su operación en el año"]], ["Cascada del estado de resultados", "Ingresos − costo de ventas = utilidad bruta; − gastos admón. y ventas = EBITDA; − depreciación y amortización = utilidad operacional; + no operacionales = EBIT; − financieros = UAI; − impuestos = utilidad neta", ["Ingresos − impuestos = EBITDA; − costo de ventas = utilidad bruta; − gastos financieros = EBIT; − depreciación = UAI; − gastos admón. = utilidad neta", "EBITDA − intereses = utilidad bruta; − depreciación = utilidad operacional; − impuestos = UAI", "Utilidad bruta − costo de ventas = EBIT; − gastos de admón. = EBITDA; + financieros = neta"]], ["EBITDA", "Utilidad antes de intereses, impuestos, depreciación y amortizaciones", ["Utilidad después de impuestos, intereses, depreciación y amortizaciones del periodo", "Utilidad bruta: ingresos menos el costo de ventas, antes de los gastos de administración", "Flujo de caja libre: caja disponible luego de inversiones y del pago de impuestos"]], ["EBIT", "Utilidad antes de intereses e impuestos (utilidad operacional + ingresos no operacionales)", ["EBITDA más depreciación y amortización, antes de ingresos y gastos no operacionales", "Utilidad neta: lo que queda después de pagar intereses, impuestos y dividendos del periodo", "Utilidad bruta: ingresos menos costo de ventas, antes de gastos de administración y ventas"]], ["Causación en el estado de resultados", "Registra la transacción, no el flujo de caja (ventas a crédito cuentan como ingreso)", ["Registra solo el flujo de caja del periodo: los ingresos se reconocen cuando se cobran", "Registra solo los costos incurridos, sin reconocer las ventas que no se han cobrado", "Registra solo los dividendos decretados, que se reconocen cuando se pagan a los accionistas"]], ["Estado de flujo de efectivo: actividades", "Operación, inversión y financiación; su suma es la variación neta de efectivo", ["Solo operación: las demás actividades se registran en el balance general de la empresa", "Ingresos, gastos y deuda, cuya suma es la utilidad neta del periodo antes de impuestos", "Activos y pasivos, cuya suma es el patrimonio de la empresa al cierre del periodo"]], ["Flujo de efectivo: depreciación", "Se suma a la utilidad neta en operación porque no implica salida de efectivo", ["Se resta de la utilidad neta, porque es un gasto que no afecta la utilidad del p rcado, crédito y operacional y provisionar patrimonio", ["Capital mínimo exigido a las entidades para operar, que fija la Superfinanciera al autorizarlas y que debe mantenerse durante toda su vigencia", "Relación de solvencia total, que mide el patrimonio técnico frente a los activos ponderados", "Capital de la matriz que respalda las operaciones de la entidad en el exterior y las filiales"]], ["Razón corriente", "Activo corriente / pasivo corriente (ABC: 820/560 = 1,46)", ["Pasivo total / activo total (ABC: 560/820 = 0,68), que mide el nivel de endeudamiento", "(Activo corriente − inventarios) / pasivo corriente, que descuenta el inventario para medir liquidez", "Activo total / patrimonio (ABC: 820/460 = 1,78), que mide el apalancamiento de la empresa"]], ["Prueba ácida", "(Activo corriente − inventarios) / pasivo corriente (ABC: 0,57)", ["Activo corriente / pasivo corriente (ABC: 820/560 = 1,46), que no excluye los inventarios", "Pasivo total / activo total (ABC: 560/820 = 0,68), que mide la proporción de deuda del activo", "Utilidad neta / ventas (ABC: 7%), que mide el margen de rentabilidad sobre las ventas totales"]], ["Grado de endeudamiento", "Pasivo total / activo total (ABC: 44,4%); > 60% puede ser sobreendeudamiento", ["Activo total / pasivo total (ABC: 2,25), que mide cuántas veces el activo cubre las deudas", "Pasivo total / patrimonio (ABC: 0,80); un valor superior a 1 indica que hay sobreendeudamiento", "Deuda financiera / ingresos operacionales (ABC: 25%); un valor superior a 30% es inadecuado"]], ["Razón de deuda financiera a ingresos", "Pasivos financieros / ingresos operacionales (sugerido máx. ~30%)", ["Pasivo total / activo total, que incluye todas las obligaciones con terceros de la empresa", "Deuda / patrimonio, que mide cuántos pesos de deuda financiera hay por cada peso de capital", "EBITDA / intereses, que mide cuántas veces la generación operativa cubre los gastos financieros"]], ["Grado de apalancamiento (leverage)", "Pasivo total / patrimonio (ABC año 2: 0,80)", ["Activo total / patrimonio (ABC año 2: 1,80), que es el multiplicador del patrimonio", "Pasivo total / activo total (ABC año 2: 0,44), que mide la proporción financiada con deuda", "EBIT / gastos por intereses (ABC año 2: 6,0), que mide la cobertura de la carga financiera"]], ["Coeficiente de apalancamiento financiero", "Activo total / patrimonio (multiplicador del patrimonio; ABC: 1,8)", ["Pasivo total / patrimonio (ABC: 0,80), que mide cuántos pesos de deuda hay por peso de capital", "Patrimonio / activo total (ABC: 55,6%), que mide la proporción financiada con recursos propios", "Deuda / EBITDA (ABC: 2,5 veces), que mide los años de generación operativa para pagar la deuda"]], ["Grado de concentración de la deuda", "Pasivo corriente / pasivo total (ABC: 31,8%)", ["Pasivo no corriente / activo total (ABC: 24,6%), que mide la deuda de largo plazo sobre el activo", "Deuda / ventas (ABC: 28,4%), que mide cuánto pesa la deuda frente a los ingresos del periodo", "Pasivo corriente / activo total (ABC: 22,5%), que mide la deuda de corto plazo sobre el activo"]], ["Rotación de cartera y periodo de cobro", "Ventas a crédito / cuentas por cobrar (veces al año); 365 / rotación = días de cobro (ABC: 2,25 veces; 162 días)", ["Ventas / inventario (veces al año); 365 / rotación = días en inventario (ABC: 2,25 veces; 162 días), sin considerar las cuentas por cobrar", "Cuentas por pagar / compras (veces al año); 365 / rotación = días de pago (ABC: 2,25 veces)", "Costo de ventas / inventario (veces al año); 365 / rotación = días de venta (ABC: 1,63 veces)"]], ["Rotación de inventarios", "Ventas anuales / inventario promedio; 365 / rotación = días en inventario (ABC: 1,63 veces; 223 días)", ["Ventas a crédito / cuentas por cobrar (veces al año); 365 / rotación = días de cobro (ABC: 1,63 veces; 223 días)", "Utilidad neta / inventario promedio (veces al año); 365 / rotación = días en inventario (ABC: 1,63 veces)", "Inventario / ventas anuales (proporción); 365 × inventario = días en inventario (ABC: 223 días)"]], ["Ciclo de efectivo", "Días de cartera + días de inventario − días de cuentas por pagar (ABC: 162 + 223 − 90 = 295)", ["Días de cartera − días de inventario + días de cuentas por pagar (ABC: 162 − 223 + 90 = 29)", "Días de pagos + días de inventario − días de cartera (ABC: 90 + 223 − 162 = 151)", "Solo los días de cartera: el tiempo que tarda la empresa en cobrar sus ventas a crédito (ABC: 162)"]], ["Margen bruto", "Utilidad bruta / ventas (ABC: 80%)", ["EBITDA/ventas", "Utilidad neta/ventas", "Utilidad operacional / ventas (ABC: 46,7%) de cada periodo"]], ["Margen EBITDA", "EBITDA / ventas (ABC: 57,7%)", ["Utilidad neta / ventas (ABC: 31,1%), sin los gastos", "UB/ventas", "EBIT/activos"]], ["Margen operacional", "Utilidad operacional / ventas (ABC: 46,7%)", ["EBITDA / ventas, que descuenta la depreciación y amortización de las ventas del periodo", "Utilidad neta / ventas, que incluye intereses e impuestos y mide la rentabilidad final", "Utilidad bruta / ventas, que solo descuenta el costo de ventas y no los gastos operativos"]], ["Margen neto", "Utilidad neta / ventas (ABC: 31,1%)", ["EBITDA / ventas (ABC: 57,7%), antes de intereses", "UB/ventas", "EBIT/ventas"]], ["ROA", "Utilidad neta / activo total (ABC: 7,07%)", ["Utilidad neta / patrimonio, que mide la rentabilidad sobre los recursos de los accionistas", "EBIT / activos totales, que mide la rentabilidad operativa antes de intereses e impuestos", "Utilidad neta / ventas, que mide el margen final sobre cada peso de ventas del periodo"]], ["ROE", "Utilidad neta / patrimonio (ABC: 12,7%)", ["UN/activos", "EBITDA / patrimonio (ABC: 18,3%), sin descontar intereses ni impuestos", "UN/ventas"]], ["ROE > ROA indica…", "Apalancamiento positivo: la deuda aumenta la rentabilidad del patrimonio (sin deuda, ROE = ROA)", ["Apalancamiento negativo: la deuda reduce la rentabilidad del patrimonio frente a la del activo", "Mala gestión: la empresa genera rentabilidad inferior al costo de la deuda que ha adquirido", "Iliquidez: la empresa no puede cubrir sus pasivos corrientes con los activos corrientes disponibles"]], ["Razón de cobertura de intereses", "EBIT / gastos financieros (ABC: 6); mínimo aceptable ~1,5", ["EBITDA / ingresos, que mide el margen de generación de caja operativa sobre las ventas", "Utilidad neta / gastos financieros (ABC: 4); mínimo aceptable de 3 veces para el prestamista", "Activos / pasivos, que mide la capacidad de respaldo de las deudas con los activos totales"]], ["Cobertura de intereses ajustada", "EBITDA / gastos financieros (ABC: 6,5)", ["EBIT / gastos financieros (ABC: 6,0), sin sumar la depreciación", "UN/intereses", "Ventas/intereses"]], ["Covenants", "Condiciones del prestamista que obligan a mantener razones financieras en ciertos niveles durante el crédito", ["Garantías reales que el deudor entrega al prestamista, como hipotecas y prendas sobre los activos, mientras dura el crédito y hasta su cancelación", "Tasas de usura que limitan el costo máximo de los créditos otorgados a la empresa deudora", "Calificaciones de riesgo que las agencias asignan a las deudas de la empresa en cada periodo"]]]}]}, {"id": "addp", "title": "Administración de Portafolios", "code": "ADDP", "sections": [{"name": "Proceso y política de inversión", "cards": [["Administración de portafolios (Bodie)", "Proceso de combinar activos en un portafolio ajustado a las preferencias del inversionista, monitorearlo y evaluar su desempeño", ["Comprar un solo activo líquido y mantenerlo hasta cumplir el objetivo del inversionista sin evaluarlo", "Seleccionar acciones individuales con el mejor retorno esperado del mercado, sin considerar las preferencias ni las restricciones del cliente que aporta los recursos", "Asesorar al cliente sobre productos de inversión una sola vez, sin monitoreo ni evaluación posterior"]], ["Cuatro etapas del proceso", "Conocimiento del cliente, generación del perfil, creación y ejecución de la estrategia de inversión y seguimiento", ["Compra, venta, custodia y reporte de los activos que componen el portafolio del cliente", "Perfil, venta, cobro y cierre de la operación, con entrega de la información al cliente", "Análisis, auditoría, cumplimiento y reporte de las operaciones realizadas por el administrador, y evaluación del desempeño de sus empleados en cada trimestre"]], ["IPS (Investment Policy Statement)", "Documento acordado entre cliente y administrador que regula horizonte, retorno objetivo, liquidez, riesgo tolerable y restricciones; guía la estrategia y puede actualizarse en el seguimiento", ["Contrato de comisión que regula las tarifas y el alcance de los servicios del intermediario, y que se firma entre el cliente y la entidad al momento de vincularlo", "Reporte de rentabilidad que el administrador entrega al cliente al cierre de cada periodo", "Prospecto del FIC que describe la política de inversión, los riesgos y los costos del fondo"]], ["Restricciones de inversión comunes", "Necesidades de liquidez, horizonte de tiempo, consideraciones fiscales, factores legales/regulatorios y circunstancias únicas", ["Solo las necesidades de liquidez del inversionista, que condicionan los activos que puede mantener, y el horizonte de tiempo que defina su asesor financiero", "Solo los factores legales y regulatorios aplicables a la entidad que administra el portafolio", "Rentabilidad y comisión del administrador, que limitan el retorno neto del cliente"]], ["Perfil de riesgo", "Evaluación combinada de la voluntad (tolerancia) y la capacidad de un inversionista para asumir riesgos", ["Solo la capacidad financiera para asumir pérdidas, medida con sus ingresos, su patrimonio y su nivel de endeudamiento actual, sin considerar su voluntad", "Solo el horizonte de inversión, que define cuánto tiempo puede esperar para recuperarse", "Solo la edad del inversionista, que determina cuánto riesgo puede asumir en su portafolio"]], ["Perfiles de riesgo (de menor a mayor)", "Muy conservador, conservador, moderado, arriesgado y dinámico", ["Bajo, medio y alto, según la rentabilidad esperada que busca cada tipo de inversionista", "Pasivo, activo y agresivo, según el nivel de participación del cliente en las decisiones", "Defensivo, cíclico y especulativo, según el tipo de activos que predominan en el portafolio"]], ["Capacidad vs. tolerancia al riesgo", "Capacidad: factibilidad objetiva (horizonte, ingresos, liquidez); tolerancia: voluntad emocional de asumir pérdidas (más difícil de medir)", ["Capacidad: voluntad emocional de asumir pérdidas, difícil de medir; tolerancia: factibilidad objetiva según el horizonte, los ingresos y la liquidez", "Son lo mismo: ambos conceptos miden la voluntad del inversionista para aceptar pérdidas", "Ambas son objetivas y se miden con el horizonte, los ingresos y la liquidez del inversionista"]], ["Horizonte de inversión largo implica…", "Mayor capacidad de tolerar volatilidad; horizontes cortos requieren inversiones más estables y conservadoras", ["Menor tolerancia a la volatilidad, porque hay más tiempo para que ocurran pérdidas en el portafolio", "Solo permite invertir en renta fija, que es la única clase de activo con plazo predecible", "Elimina el riesgo, porque a largo plazo los retornos siempre superan a los de la inflación"]], ["Factores de riesgo tradicionales", "Mercado, crédito, liquidez, legal, operativo y reputacional", ["Solo riesgo de mercado, porque los demás riesgos se reflejan en el precio de los activos", "Inflación y desempleo, que son los factores macroeconómicos que afectan todas las inversiones", "Solo crédito y liquidez, que son los dos riesgos que se pueden medir con datos históricos"]], ["Factor investing: tipos de factores", "Macroeconómicos (crecimiento, tasas reales, inflación, mercados emergentes, liquidez) y de estilo (value, volatilidad mínima, momentum, calidad, tamaño)", ["Solo macroeconómicos, como el crecimiento, las tasas reales y la inflación de cada economía", "Solo de estilo, como value, volatilidad mínima, momentum, calidad y tamaño de las compañías", "Fiscales y legales, que dependen del régimen tributario y de la regulación de cada jurisdicción, y de estilo como el crecimiento, la liquidez y el tamaño de la empresa"]], ["Clases de activos", "Tradicionales (acciones, renta fija, equivalentes de efectivo) y alternativas (hedge funds, capital privado, commodities, finca raíz, infraestructura)", ["Solo acciones y bonos, que son los activos tradicionales que se negocian en las bolsas, junto con las divisas, los derivados y los productos estructurados", "Solo alternativas como hedge funds, capital privado, commodities y finca raíz", "Divisas y derivados, que se negocian en mercados organizados y de forma estandarizada"]], ["Características de inversiones alternativas", "Menor liquidez, menos regulación y transparencia, tarifas altas, datos históricos limitados y baja correlación con activos tradicionales", ["Alta liquidez, porque se pueden vender en cualquier momento a un precio de mercado visible", "Alta regulación y transparencia, con información de precios disponible de forma diaria", "Alta correlación con los activos tradicionales, lo que reduce los beneficios de diversificación, además de alta liquidez, alta regulación y tarifas bajas"]], ["Asignación estratégica de activos (SAA)", "Exposición de largo plazo según expectativas, objetivos, tolerancia y restricciones; sigue el IPS (inversión pasiva); enfoques: comprar y mantener y rebalanceo sistemático", ["Ajustes de corto plazo a los pesos del portafolio para aprovechar oportunidades del mercado, con base en las expectativas del gestor sobre cada clase de activo", "Elegir acciones individuales con mejor desempeño esperado, según el análisis fundamental", "Gestión activa que busca superar al mercado con cambios frecuentes en la composición"]], ["Asignación táctica de activos (TAA)", "Ajustes de corto plazo a las ponderaciones de la SAA para generar valor (método activo, mayor riesgo de desviación)", ["Exposición pasiva de largo plazo que sigue el IPS y no se modifica en función del mercado", "Es igual a comprar y mantener: no modifica las ponderaciones de la SAA y minimiza los costos de transacción, y es un método pasivo de largo plazo", "Selección de emisores dentro de cada clase de activo con base en el análisis fundamental"]], ["Comprar y mantener vs. rebalanceo sistemático", "Comprar y mantener no rebalancea (minimiza costos); rebalanceo compra/vende periódicamente o ante desviaciones (ej. ±10%)", ["Comprar y mantener rebalancea cada mes con los flujos que recibe; el rebalanceo sistemático nunca modifica los pesos y solo reinvierte los cupones recibidos", "El rebalanceo no cambia los pesos del portafolio: solo reinvierte los flujos recibidos", "Ambos son tácticos: modifican las ponderaciones según las expectativas de corto plazo"]], ["Security selection pasiva vs. activa", "Pasiva: indexar (replicar un índice); activa: análisis técnico, fundamental o información privada para superar al mercado", ["Pasiva: análisis técnico de los precios; activa: replicar un índice de referencia del mercado", "Activa: replicar índices con el menor costo; pasiva: análisis fundamental, técnico o información privada para superar al mercado de forma sistemática", "Ambas indexan: la única diferencia es el costo de transacción en que incurre cada estrategia"]], ["Objetivos de inversión del individuo", "Reserva de capital, preservación, ingreso corriente, financiación del retiro, crecimiento y especulación", ["Solo el retiro: financiar el ingreso del inversionista después de terminar su vida laboral", "Solo el crecimiento del capital, medido por el aumento del valor del portafolio en el tiempo", "Liquidez y deuda: cubrir el flujo de caja de corto plazo y cancelar las obligaciones pendientes"]], ["Capital humano", "Valor económico de la experiencia y habilidades de una persona; su riesgo principal (incapacidad) se cubre con seguro de invalidez/vida", ["Valor de sus inversiones financieras y de su patrimonio inmobiliario, que son su principal activo, y se cubre con un portafolio diversificado de largo plazo", "Patrimonio financiero total del individuo, que se cubre con diversificación de su portafolio", "Ingresos pasivos que recibe por rentas y dividendos, que se protegen con renta fija"]], ["Retorno requerido (RRR)", "Rendimiento mínimo que acepta el inversionista por un nivel de riesgo (costo de oportunidad); se estima con descuento de dividendos o CAPM", ["Rendimiento máximo que puede obtener el inversionista por un nivel de riesgo determinado", "Tasa de inflación esperada, que es el rendimiento mínimo para conservar el poder adquisitivo, y se estima con la tasa libre de riesgo del mercado", "Tasa libre de riesgo, que es lo que exige el inversionista por invertir sin asumir riesgo"]], ["RRR con descuento de dividendos", "RRR = E(D)/P + g", ["RRR = E(D) × P, el dividendo esperado multiplicado por el precio", "RRR = P/E(D)", "RRR = g − E(D)"]], ["Inversionista institucional", "Grandes entidades que invierten dinero de otros (fondos de pensiones, FIC, bancos, aseguradoras); más experiencia e información", ["Personas naturales con patrimonio alto, que invierten con asesoría de un administrador profesional y cuentan con mayor experiencia e información que un ahorrador", "Solo el Estado y sus entidades, que invierten los recursos públicos en TES y otros valores", "Pequeños ahorradores que agrupan sus recursos para invertir de manera colectiva con bajos montos"]], ["Asset only vs. ALM", "Asset only: optimiza activos sin pasivos (media-varianza); ALM: gestiona activos y pasivos conjuntamente (riesgo real: no poder financiar el pasivo)", ["ALM ignora los pasivos: optimiza solo el rendimiento y el riesgo de los activos del portafolio", "Asset only incluye los pasivos: gestiona activos y pasivos de manera conjunta con un mismo modelo; ALM optimiza solo los activos con media-varianza", "Son iguales: ambos enfoques consideran los pasivos de la entidad en la asignación de activos"]], ["Etapas del proceso de inversión (CFA)", "Planeación (IPS), ejecución (asset allocation y security selection) y retroalimentación (monitoreo, rebalanceo, desempeño)", ["Compra, venta y cierre de las operaciones, con liquidación y reporte al cliente", "Perfil, venta y custodia de los valores, con valoración diaria y rendición de cuentas", "Solo ejecución: asset allocation y security selection, sin planeación ni retroalimentación, y el IPS se elabora una vez al final del proceso de inversión"]]]}, {"name": "Teoría de portafolios", "cards": [["Padre de la teoría moderna de portafolios", "Harry Markowitz (Portfolio Selection, 1952; Nobel 1990)", ["William Sharpe (CAPM, 1964; Nobel 1990), que formuló el modelo de valoración de activos", "Eugene Fama (hipótesis de mercados eficientes, 1970; Nobel 2013), que estudió el comportamiento de precios", "Stephen Ross (APT, 1976), que desarrolló la teoría de valoración por arbitraje de activos"]], ["Aporte de Tobin (1958)", "Los inversionistas son aversos al riesgo y exigen mayor retorno por mayor riesgo", ["Creó el CAPM, que relaciona el retorno esperado de un activo con su beta frente al mercado", "Creó el VaR, que mide la máxima pérdida posible con un nivel de confianza en un periodo", "Formuló la hipótesis de mercados eficientes, según la cual los precios reflejan toda la información"]], ["Riesgo sistémico vs. no sistémico", "Sistémico (de mercado, no diversificable) afecta a toda la economía; no sistémico (idiosincrático) es de una empresa y se elimina diversificando", ["Sistémico es de una empresa y se elimina diversificando; no sistémico es de mercado, afecta a toda la economía y no se puede diversificar entre emisores", "No sistémico es de mercado y no se diversifica; sistémico es idiosincrático de cada emisor", "Ambos se eliminan con una adecuada diversificación entre emisores, sectores y clases de activo"]], ["¿Cuántas acciones aprox. eliminan el riesgo no sistémico (Statman)?", "Alrededor de 30", ["5", "100 acciones", "500"]], ["Retorno por periodo de tenencia (HPR)", "(Valor final − valor inicial + flujos) / valor inicial", ["Valor final / valor inicial, sin incluir los flujos recibidos durante el periodo de tenencia", "Flujos recibidos / valor final del activo, expresado como porcentaje del precio de venta", "(Valor final − flujos) / flujos recibidos, que mide el retorno sobre los ingresos del periodo"]], ["Acción de $2.500 pasa a $2.650 y paga $150 de dividendo: HPR", "12%", ["6%", "10%", "18%"]], ["Retorno esperado de un activo", "E(r) = Σ P(s) × r(s) (promedio ponderado por probabilidades)", ["Promedio simple de los retornos observados, sin ponderarlos por la probabilidad de cada escenario", "Retorno máximo posible entre los escenarios, que se alcanza con la probabilidad más alta", "Retorno del mercado en el periodo, ajustado por la beta del activo frente al índice de referencia"]], ["Retorno esperado de un portafolio", "Σ Xi × E(ri): promedio ponderado de los retornos", ["Suma de los retornos de cada activo, sin ponderar por su participación en el portafolio", "Producto de los retornos de los activos, porque los rendimientos se acumulan de forma geométrica", "Mayor retorno entre los activos del portafolio, porque el administrador busca maximizarlo"]], ["Portafolio 40% a 12% y 60% a 18%: retorno", "15,6%", ["15%", "14,4%", "16,8%"]], ["Escenarios: optimista 25% con 35%, moderado 40% con 10%, negativo 25% con −5%: E(r)", "11,5% (0,25·35 + 0,40·10 + 0,25·(−5))", ["13,3% (0,25·35 + 0,40·10 + 0,25·(−5) + 5, sumando un efecto de reinversión)", "10%", "20%"]], ["Desviación estándar", "Raíz de la varianza; principal medida de riesgo (dispersión de rendimientos)", ["Promedio de los rendimientos observados, que mide el retorno típico del activo en el periodo", "Covarianza entre los rendimientos del activo y los del mercado, dividida entre su varianza", "Beta del activo frente al mercado, que mide su sensibilidad a los movimientos del índice"]], ["Riesgo de portafolio vs. promedio ponderado", "El riesgo NO es promedio ponderado: depende de covarianzas; puede ser menor por diversificación", ["Siempre es el promedio ponderado de los riesgos de cada activo, según sus pesos en el portafolio", "Es la suma de las desviaciones estándar de los activos, sin considerar sus correlaciones", "Es independiente de los pesos: depende únicamente de las desviaciones de cada activo"]], ["Efecto de la correlación", "ρ = +1 no hay diversificación (línea recta); ρ < 1 reduce volatilidad; ρ = −1 máxima diversificación (puede llegar a 0)", ["ρ = −1 no hay diversificación; ρ = +1 permite eliminar por completo el riesgo del portafolio", "ρ = +1 es la máxima diversificación: el riesgo del portafolio es el promedio de los activos", "La correlación no importa: el riesgo del portafolio solo depende de las desviaciones y los pesos de cada activo, sin considerar su relación de movimiento"]], ["Covarianza positiva / negativa / cero", "Positiva: se mueven igual; negativa: en sentido opuesto; cercana a 0: sin relación lineal", ["Positiva: se mueven en sentido opuesto; negativa: se mueven igual; cero: se mueven al mismo ritmo", "Positiva: sin relación lineal; negativa: se mueven igual; cero: se mueven en sentido opuesto", "Es una medida del tamaño del riesgo: positiva es alta, negativa es baja y cero es riesgo nulo"]], ["VaR (valor en riesgo)", "Máxima pérdida posible en un periodo con un nivel de confianza dado; aumenta con volatilidad, ventana de tiempo y nivel de confianza", ["Pérdida mínima esperada en un periodo con un nivel de confianza dado por el administrador", "Pérdida promedio esperada en el periodo, calculada sobre todos los escenarios históricos", "Ganancia máxima esperada en el periodo, con un nivel de confianza dado por el administrador, y calculada sobre el valor del portafolio al inicio del horizonte"]], ["VaR: métodos", "Paramétrico (supone normalidad) e histórico", ["Solo Monte Carlo, que simula miles de escenarios con base en la distribución de los retornos", "Solo paramétrico, que supone normalidad en los retornos de los activos del portafolio", "Solo escenarios de estrés, definidos por el administrador a partir de crisis pasadas"]], ["Supuestos de Markowitz", "Riesgo = volatilidad, inversionistas racionales que maximizan utilidad, deciden por retorno y riesgo, prefieren más retorno y menos riesgo", ["Los mercados son irracionales y los inversionistas deciden con base en sesgos de comportamiento, y el riesgo se mide por la liquidez y no por la volatilidad", "Los inversionistas deciden por los impuestos de cada activo y no por el retorno ni el riesgo", "El riesgo equivale a la iliquidez del activo y no a la volatilidad de sus rendimientos"]], ["Frontera eficiente", "Portafolios que maximizan retorno para cada nivel de riesgo (o minimizan riesgo para cada retorno)", ["Todos los portafolios posibles que se pueden construir con los activos disponibles en el mercado", "El portafolio de mayor riesgo, que ofrece el retorno esperado más alto de toda la frontera", "El portafolio de menor retorno esperado, que tiene la menor desviación estándar posible"]], ["Portafolio dominante", "Mismo riesgo con mayor retorno, o mismo retorno con menor riesgo", ["Mayor riesgo y mayor retorno que otro portafolio, lo que lo hace preferible para el inversionista", "Más activos que otro portafolio, lo que mejora su diversificación y reduce su riesgo total", "El portafolio más líquido de los disponibles, por poder venderse con rapidez sin perder valor"]], ["Optimización media-varianza (MVO)", "Hallar el portafolio de mayor retorno dada una restricción de varianza (o menor varianza dado un retorno)", ["Maximizar el número de activos del portafolio, con el fin de eliminar todo el riesgo no sistémico", "Minimizar los costos de transacción del portafolio, sin considerar el riesgo ni el retorno esperado", "Maximizar la liquidez del portafolio, restringiendo la participación de los activos de menor volumen"]], ["Capital Market Line (CML)", "Combinaciones del activo libre de riesgo y el portafolio de mercado (retorno vs. desviación estándar); permite prestar o tomar prestado", ["Retorno esperado vs. beta de cada activo, que permite valorar si un activo está caro o barato", "Línea de oferta de los activos libres de riesgo en función de los plazos de vencimiento", "Frontera de los portafolios compuestos únicamente por activos riesgosos, sin activo libre de riesgo, que relaciona su retorno esperado con la beta del portafolio"]], ["Black-Litterman (1990)", "Incorpora las perspectivas (views) del administrador al modelo de media-varianza usando retornos implícitos del benchmark", ["Ignora las expectativas del administrador y usa solo los retornos históricos del benchmark", "Es más simple que Markowitz porque elimina las covarianzas entre los activos del portafolio", "Usa el CAPM sin incluir las perspectivas del administrador sobre los retornos de los activos, y reemplaza las covarianzas por las betas de cada activo"]], ["CAPM: autores y fórmula", "Sharpe, Lintner y Black: E(r) = Rf + β (Rm − Rf)", ["Sharpe, Lintner y Black: E(r) = Rf + Rm, es decir, la tasa libre de riesgo más el retorno del mercado", "Sharpe, Lintner y Black: E(r) = β × Rf, es decir, la beta multiplicada por la tasa libre de riesgo", "Markowitz, Tobin y Fama: E(r) = Rm − β, el retorno del mercado menos la beta del activo"]], ["Supuestos del CAPM", "Inversionistas racionales, un periodo, expectativas homogéneas, sin impuestos ni costos de transacción, préstamo a tasa libre de riesgo común", ["Hay impuestos y costos de transacción, que afectan de forma distinta a cada inversionista", "Los inversionistas tienen expectativas distintas y toman decisiones en varios periodos", "Los costos de transacción son altos y las tasas de endeudamiento varían entre inversionistas, que además tienen expectativas distintas y pagan impuestos diferentes"]], ["Beta", "Unidades de riesgo sistémico frente al mercado (pendiente de regresión); mercado = 1; ~0 defensivo; >1 cíclico", ["Riesgo no sistémico del activo, que se elimina diversificando el portafolio entre emisores", "Volatilidad total del activo, medida con su desviación estándar frente al promedio histórico", "Retorno esperado del activo, calculado con la prima de riesgo del mercado y la tasa libre de riesgo, y que mide su volatilidad total en el periodo"]], ["Beta de un portafolio", "Promedio ponderado de los betas de sus activos", ["Suma de los betas de sus activos, sin ponderar por la participación de cada uno", "El mayor beta entre los activos que componen el portafolio, porque domina el riesgo", "Beta del mercado, que siempre es igual a 1 sin importar la composición del portafolio"]], ["Ejemplo: Rf 6,99%, MRP 7,2%, β 1,2 → retorno esperado", "≈15,6%", ["9,08% aproximadamente, según la fórmula", "8,64%", "7,2%"]], ["Security Market Line (SML)", "Retorno esperado vs. beta (CAPM); beta 0 rinde la tasa libre de riesgo, beta 1 el mercado", ["Retorno esperado vs. volatilidad: relaciona el riesgo total con el retorno de los portafolios", "Es la misma CML: ambas rectas relacionan el retorno esperado con la desviación estándar", "Frontera eficiente de los portafolios de activos riesgosos, sin activo libre de riesgo"]], ["CML vs. SML", "CML: retorno vs. desviación estándar (Markowitz); SML: retorno vs. beta (CAPM)", ["CML: retorno vs. beta (CAPM); SML: retorno vs. desviación estándar (Markowitz)", "Son iguales: ambas representan la misma relación entre retorno esperado y riesgo sistémico", "Ambas usan la beta como medida de riesgo, y solo difieren en el activo libre de riesgo usado"]], ["APT (Ross, 1976)", "Retorno esperado como función de varios factores; sin arbitraje; base de los modelos multifactoriales", ["Retorno esperado como función de un solo factor, que es el retorno del portafolio de mercado", "Usa solo la beta del activo frente al mercado y no admite otros factores de riesgo", "Ignora el arbitraje: supone que los precios pueden desviarse de su valor sin corrección"]], ["Modelo de tres factores Fama-French", "Mercado + tamaño (SMB) + razón valor en libros/mercado (HML)", ["Mercado + inflación + PIB, que son los tres factores macroeconómicos que explican el retorno", "Beta + alfa + Sharpe, que son las tres medidas de desempeño de un portafolio gestionado", "Mercado + liquidez + crédito, que son los tres factores de riesgo de un portafolio de renta fija"]], ["Hipótesis de mercados eficientes (Fama, 1970)", "Los precios reflejan siempre toda la información disponible", ["Los precios son predecibles con base en su comportamiento histórico y en las noticias", "El mercado ignora las noticias nuevas y ajusta los precios con un rezago de varios meses", "Solo aplica a los bonos, cuyos precios dependen únicamente de la tasa de interés"]], ["Formas de eficiencia", "Débil (precios pasados), semifuerte (información pública) y fuerte (incluye privilegiada)", ["Débil: información privada; semifuerte: información pública; fuerte: solo precios pasados", "Fuerte: solo precios pasados; débil: toda la información, incluida la privilegiada", "Solo hay una forma de eficiencia: la semifuerte, que incluye toda la información pública"]], ["Aplicaciones de la HME", "Diversificar, comprar y mantener (menor rotación) y escepticismo con analistas", ["Rotar activamente el portafolio, para aprovechar las ineficiencias que genera el mercado", "Concentrar el portafolio en pocos activos que el administrador considere subvalorados", "Seguir las recomendaciones del analista, que tiene acceso a información que otros no tienen"]]]}, {"name": "Finanzas conductuales", "cards": [["Heurística y teoría de la perspectiva", "Heurística: atajos mentales (ensayo y error); teoría de la perspectiva (Kahneman y Tversky, 1979): las personas valoran pérdidas y ganancias de forma asimétrica", ["Teoría de la utilidad esperada, que supone que los inversionistas evalúan pérdidas y ganancias de forma simétrica y toman decisiones plenamente racionales", "CAPM: relaciona el retorno esperado con la beta de cada activo frente al portafolio de mercado", "Hipótesis de mercados eficientes: los precios reflejan toda la información disponible"]], ["Heurísticas de Tversky y Kahneman", "Disponibilidad, confirmación y representatividad", ["Anclaje, manada y status quo, que son sesgos propios de la inversión en grupo", "Solo disponibilidad: la tendencia a usar la información más fácil de recordar al decidir", "Alfa, beta y gamma, que son medidas de sensibilidad del precio de un activo al mercado"]], ["Aversión a las pérdidas", "El impacto psicológico de una pérdida es ~2,5 veces el de una ganancia igual; se mantienen perdedoras y se venden ganadoras muy pronto", ["Se vende rápido lo que pierde y se conserva lo que gana, porque las pérdidas pesan poco", "Se aman las pérdidas: el inversionista busca más riesgo cuando el portafolio está en ganancia", "El impacto psicológico es igual entre pérdidas y ganancias, y se corrigen con la diversificación, vendiendo de inmediato las perdedoras para no cargar con ellas"]], ["Exceso de confianza", "Sobreestimar capacidades propias; más transacciones y menores rendimientos", ["Subestimar las habilidades propias; se opera menos y se obtienen mejores rendimientos", "Evitar riesgos de forma excesiva; el portafolio queda concentrado en activos de bajo riesgo", "Seguir al grupo sin analizar la información, por la presión social de los demás inversionistas"]], ["Sesgo de status quo", "Preferir mantener las cosas como están; portafolios inadecuados", ["Cambiar el portafolio sin análisis alguno, solo por el movimiento de corto plazo del mercado", "Seguir a la manada, imitando las decisiones de los demás inversionistas del mercado", "Sobrerreaccionar a las noticias recientes y ajustar el portafolio de manera excesiva"]], ["Comportamiento de manada", "Imitar a un grupo sin análisis (ej. auge de criptomonedas)", ["Contrarian: actuar en sentido opuesto al del mercado, comprando lo que los demás venden", "Sobrestimar las habilidades propias y hacer más transacciones de las que son convenientes", "Conservadurismo: no incorporar la información nueva y mantener pronósticos desactualizados"]], ["Conservadurismo", "No incorporar (o subestimar) información nueva; pronósticos desactualizados", ["Sobrerreaccionar a las noticias recientes, ajustando de forma excesiva los pronósticos", "Confirmar las creencias previas, buscando solo la información que las valida", "Anclarse en la forma de presentar la información y decidir según el marco que se plantea"]], ["Representatividad", "Inferir tendencias de muestras recientes pequeñas; sobrerreacción a noticias", ["Ignorar las noticias recientes y mantener los pronósticos desactualizados del pasado", "Buscar solo la información que confirme las creencias, subestimando la información contraria", "No actualizar las creencias ante información nueva y aferrarse al precio de compra del activo"]], ["Confirmación", "Buscar información que valide las creencias y subestimar la contraria", ["Aceptar toda la información por igual, sin dar más peso a la que respalda las creencias previas", "Rechazar las creencias propias cuando aparece información contraria, aunque sea poco confiable", "Seguir la manada: imitar las decisiones de otros inversionistas sin analizar la información"]], ["Dependencia de la forma (framing)", "La forma de presentar la situación cambia la decisión (ej. pérdida segura vs. probabilidad de pérdida mayor)", ["Siempre se decide igual, sin importar cómo se presenta el problema de inversión al individuo, porque las personas evalúan solo el resultado final esperado", "Solo afecta a los inversionistas institucionales, que reciben informes con distinto formato", "Evita el riesgo en todos los casos, porque las personas prefieren la certeza a las apuestas"]]]}, {"name": "Estrategias, benchmark y desempeño", "cards": [["Estrategia pasiva", "Comprar y mantener a largo plazo, típicamente replicando índices (fondos indexados, ETF); más barata y sencilla", ["Rotación constante del portafolio para capturar las oportunidades que aparecen en el mercado, con más costos de transacción que la gestión de tipo activo", "Busca superar al índice mediante la selección de valores y el momento de la compra", "Se basa en el market timing: entrar y salir del mercado según las señales técnicas"]], ["Gestión activa", "Busca superar al benchmark; flexibilidad, trading ampliado, gestión fiscal; mayores tarifas, riesgo y exposición a modas", ["Replicar índices con la menor desviación posible, por medio de fondos indexados y ETF", "Menor costo siempre: no exige análisis y evita las comisiones por gestión del portafolio", "Sin riesgo de desviación frente al benchmark, porque el gestor sigue las ponderaciones del índice, con menores tarifas que la gestión pasiva tradicional"]], ["Índice bursátil", "Conjunto de valores que representa el desempeño de un mercado, sector o estrategia; sirve de benchmark", ["Tasa de interés de referencia que sirve para descontar los flujos de los activos del mercado", "Precio de una acción, que se publica diariamente y sirve de referencia para los demás valores", "Calificación de riesgo que se asigna a un grupo de emisores del mismo sector de la economía"]], ["Ponderación de índices", "Por capitalización bursátil, por capitalización ajustada por flotante (la más usada) y equitativa (mismo peso)", ["Solo equitativa: todos los valores del índice tienen el mismo peso en el cálculo", "Por volumen de negociación de cada valor, que mide su liquidez en el mercado", "Por precio unitario de cada acción, de modo que las más caras pesan más en el índice, sin considerar su capitalización ni su flotante en el mercado"]], ["MSCI COLCAP", "Índice de las acciones más representativas de la BVC, ponderado por capitalización ajustada; base 1.000 el 15-ene-2008; cambios en enero, abril, julio y octubre", ["Índice de TES de tasa fija que pondera por monto en circulación; base 1.000 el 15-ene-2008, con cambio ide el VaR del portafolio, es decir, la pérdida máxima esperada con un nivel de confianza", "Calcula la beta del portafolio con una regresión frente al índice de referencia del mercado"]], ["Alfa por asset allocation: benchmark 50/50, portafolio 60/40, retornos 15% y 10%", "0,5% (portafolio 13% vs. benchmark 12,5%)", ["2% (portafolio 15% vs. benchmark 13%): efecto de la mayor exposición a la clase de mayor retorno", "−0,5% (portafolio 12% vs. benchmark 12,5%): efecto negativo de la mayor ponderación en renta variable", "5% (portafolio 15% vs. benchmark 10%): diferencia total de retorno atribuible a la asignación"]], ["Alfa por security selection", "Suma de (peso portafolio − peso benchmark) × (rendimiento del activo − rendimiento del benchmark)", ["Suma de los pesos del portafolio y del benchmark, ponderados por su desviación estándar", "Retorno del portafolio multiplicado por su beta, menos el retorno del benchmark del periodo", "Sharpe del portafolio multiplicado por su desviación estándar, menos el retorno de referencia"]]]}]}, {"id": "addr", "title": "Administración y Control de Riesgos", "code": "ADDR", "sections": [{"name": "Conceptos y tipos de riesgo", "cards": [["Riesgo: dos perspectivas", "Probabilidad de ocurrencia de un evento inesperado y el impacto (generalmente negativo) de dicho evento", ["Solo la pérdida máxima que puede sufrir una entidad en un periodo, sin considerar su probabilidad", "Solo la probabilidad de que ocurra un evento, sin considerar el impacto que produce en la entidad", "Solo la volatilidad histórica de los rendimientos de los activos, medida con la desviación estándar"]], ["Acuerdos de Basilea", "Basilea I (1998), Basilea II (2004) y Basilea III (2010), del Comité de Supervisión Bancaria del BIS", ["Basilea I (2004), Basilea II (2010) y Basilea III (2018), del Comité de Supervisión Bancaria del BIS", "Solo Basilea III (2010), que reemplazó por completo a los acuerdos anteriores sin dejar ninguno vigente", "Basilea I (1998), Basilea  ASG (ESG)", "Ambiental, social y de gobernanza", ["Económico, social y legal", "Ambiental, sectorial y global, que evalúan el sector", "Gobierno, auditoría y riesgo"]], ["PRI: principios de inversión responsable", "Seis principios voluntarios para incorporar factores ASG en el análisis, la propiedad activa, la divulgación, la promoción, la colaboración y los reportes", ["Diez principios obligatorios para los intermediarios, que la SFC verifica en sus inspecciones", "Tres principios voluntarios para incorporar factores ASG, la propiedad activa y la divulgación", "Principios obligatorios de la SFC para las entidades vigiladas que administran recursos de terceros, que se verifican en las visitas de supervisión cada año"]], ["Agenda 2030 de la ONU", "17 Objetivos de Desarrollo Sostenible (ODS), inherentes a los factores ASG", ["10 Objetivos de Desarrollo Sostenible (ODS) de la ONU, ajenos a los factores ASG", "50 Objetivos de Desarrollo Sostenible (ODS) de la ONU, inherentes a los factores ASG", "8 Objetivos de Desarrollo del Milenio (ODM), que se cumplieron entre 2000 y 2015"]]]}, {"name": "Medición de riesgos", "cards": [["Desviación estándar como medida de volatilidad", "Estima la variación promedio de una variable respecto a su media; pondera más las desviaciones grandes; requiere ventana de tiempo", ["Mide solo las caídas del precio respecto al máximo observado en una ventana de tiempo", "No depende de la media: mide la dispersión absoluta de los rendimientos en cada periodo y pondera por igual todas las desviaciones, grandes o pequeñas", "Es igual al VaR: ambas medidas estiman la pérdida máxima con un nivel de confianza dado"]], ["Coeficiente de correlación", "Entre −1 (inversa total) y 1 (directa total); mide relación lineal", ["Entre 0 y 1: mide la relación directa entre dos variables, sin considerar la relación inversa", "Entre −10 y 10: mide la relación entre las variaciones de dos activos de un portafolio", "Mide la sensibilidad de un activo frente al benchmark, con base en una regresión lineal"]], ["Máximo drawdown", "Máxima pérdida observada entre un precio máximo y el mínimo en una ventana de tiempo", ["Pérdida esperada de la inversión en el periodo, calculada con la probabilidad de cada escenario", "Volatilidad promedio de los rendimientos en una ventana de tiempo de 252 días hábiles", "Beta del portafolio frente al benchmark en la ventana de tiempo que defina la entidad"]], ["Beta del activo", "Sensibilidad frente a un benchmark: <1 menos volátil, >1 más riesgoso, 0 sin relación lineal", ["Beta mayor que 1: el activo es menos riesgoso que el mercado, porque se mueve menos que él", "Es la correlación entre el activo y el benchmark, que mide la relación lineal entre ambos", "Es la volatilidad total del activo, que incluye tanto el riesgo sistémico como el específico"]], ["Volatilidad implícita", "Desviación estándar esperada por el mercado a futuro (se deriva de precios de opciones)", ["Volatilidad histórica calculada con las desviaciones de los precios observados en el pasado", "Desviación pasada de los retornos respecto de la media en una ventana de tiempo definida", "Volatilidad móvil calculada con una ventana de tiempo que se desplaza todos los días"]], ["Modelos ARCH, EWMA y GARCH", "ARCH: volatilidad revierte a media de largo plazo; EWMA: más peso a observaciones recientes; GARCH: combina ambos", ["Todos asignan el mismo peso a las observaciones, sin importar su fecha en la ventana de datos, y suponen que la volatilidad es constante en el tiempo", "EWMA ignora las observaciones recientes y asigna mayor peso a los datos más antiguos", "GARCH no usa la media de largo plazo: solo pondera de forma exponencial las observaciones"]], ["VaR (definición)", "Pérdida máxima estimada para un horizonte y nivel de confianza dados; Prob(ΔP ≤ −VaR) = 1 − c", ["Pérdida mínima estimada para un horizonte y nivel de confianza dados: Prob(ΔP ≤ −VaR) = c", "Pérdida promedio esperada en el horizonte, calculada sobre todos los escenarios posibles", "Ganancia máxima estimada para un horizonte y nivel de confianza dados por la entidad"]], ["Niveles de confianza y horizonte del VaR en Colombia", "Se usa 95%, 97,5% y 99%; la regulación de la SFC estima el horizonte en 10 días", ["Se usa 80% y la regulación estima el horizonte en 1 día, porque mide el riesgo diario", "Se usa 50% y la regulación estima el horizonte en 30 días, porque mide el riesgo mensual", "Se usa 99,9% y la regulación estima el horizonte en un año, porque mide el riesgo anual"]], ["VaR paramétrico", "VaR = −P × (σ√T) × Z, supone retornos normales", ["VaR = P × σ, sin ajustar por horizonte ni por el nivel de confianza escogido por la entidad", "Usa percentiles de la serie histórica de retornos, sin suponer ninguna distribución", "Genera escenarios aleatorios bajo una distribución y estima el percentil de las pérdidas"]], ["Valores Z de la normal", "99%: −2,3263; 98%: −2,0537; 97%: −1,8808; 96%: −1,7507; 95%: −1,6448", ["99%: −1,64; 98%: −1,88; 97%: −2,05; 96%: −2,33; 95%: −1,75 (valores en otro orden)", "95%: −2,33; 96%: −2,05; 97%: −1,88; 98%: −1,75; 99%: −1,64 (valores invertidos)", "99%: −1,28; 98%: −1,41; 97%: −1,55; 96%: −1,64; 95%: −1,75 (valores de una cola distinta)"]], ["VaR 10 días, $1.000.000, vol. 10% anual, 99%", "≈ $46.341 (1.000.000 × 0,10 × √(10/252) × 2,3263)", ["$100.000: igual al producto del valor de la inversión y la volatilidad anual sin ajustar", "$23.263: se calcula con la raíz de 10 días y un valor Z de 2,3263 sin ajustar por volatilidad", "$4.634: se calcula con la volatilidad diaria y un valor Z de 2,3263 sin la raíz del horizonte"]], ["VaR por simulación histórica", "Percentil (1−c) de la serie de retornos históricos × valor de la inversión, sin suponer distribución", ["Supone que los retornos se distribuyen normal y calcula el percentil con la media y la desviación", "Genera números aleatorios con una distribución y estima el percentil de las pérdidas simuladas", "Usa solo la media de los retornos históricos y el valor de la inversión, sin percentiles"]], ["VaR por Monte Carlo", "Genera escenarios aleatorios bajo una distribución (normal) y estima el percentil; útil con opciones en el portafolio", ["Usa solo datos históricos de los retornos, sin simulación de escenarios de los factores de riesgo, y por eso no sirve para portafolios con opciones", "Supone volatilidad constante y no admite portafolios con opciones ni activos no lineales", "No usa percentiles: calcula la pérdida máxima como el valor extremo de la serie simulada"]], ["DV01 (renta fija)", "Cambio en el valor del bono ante 1 punto básico de la tasa: P(r+0,01%) − P(r)", ["Cambio en el valor del bono ante un cambio de 1% (100 puntos básicos) en la tasa de interés", "Duración del bono expresada en años, que mide el plazo promedio de recuperación de la inversión", "Convexidad del bono, que mide el cambio de la duración ante variaciones en la tasa de interés"]], ["Bono cero cupón a 1 año, VN 100, 5% E.A.: duración y DV01", "Duración 1 año; DV01 ≈ −0,0090694", ["Duración 5 años; DV01 −0,5, porque el título es de un solo flujo y su sensibilidad es igual al plazo", "Duración 0,5", "DV01 −1"]], ["Duración modificada", "DM = Duración / (1 + r) (aprox. 0,9523 en el ejemplo)", ["DM = Duración × (1 + r): se multiplica la duración por uno más la tasa (aprox. 1,0500)", "DM = Duración − r: se resta la tasa a la duración de Macaulay (aprox. 0,9000 en el ejemplo)", "DM = Duración + 1: se suma una unidad a la duración de Macaulay del bono (aprox. 2,0000)"]], ["Convexidad", "Cambio de la duración modificada ante cambios de tasa; corrige el error de la aproximación lineal", ["Medida de liquidez del bono, que mide el cambio del precio ante variaciones del volumen negociado", "Es la duración elevada al cuadrado, que mide el plazo promedio ponderado de los flujos", "Medida del riesgo de crédito del bono, que cambia cuando varía la calificación del emisor"]], ["VaR de un portafolio", "No es la suma de los VaR individuales: la baja correlación reduce el VaR (diversificación)", ["Es la suma de los VaR individuales, porque los riesgos de los activos se acumulan en el portafolio", "Siempre es mayor que la suma de los VaR individuales, porque las pérdidas se potencian entre sí", "Es independiente de las correlaciones: solo depende del valor total del portafolio y del Z"]], ["Desviación estándar del portafolio", "σ = √(ΣΣ wi wj σi σj ρij)", ["σ = Σ wi σi", "σ = Σ σi²", "σ = promedio de las correlaciones multiplicado por la suma de las desviaciones estándar individuales de los activos"]], ["Tracking error", "Desviación estándar de la diferencia de retornos entre portafolio y benchmark; los gestores indexados quieren minimizarlo", ["Retorno del benchmark en el periodo, que sirve de referencia para evaluar al gestor", "Alfa promedio del portafolio frente al benchmark, medido durante la ventana de evaluación", "Beta del portafolio frente al benchmark, que mide su sensibilidad a los movimientos del índice, y que los gestores indexados buscan mantener en uno"]], ["Relative VaR (tracking error VaR)", "VaR de un portafolio teórico con peso +1 en el portafolio y −1 en el benchmark", ["VaR del benchmark solo, calculado con la volatilidad del índice de referencia en el periodo", "VaR absoluto del portafolio, calculado sin considerar el benchmark ni el peso de los activos", "VaR de un portafolio teórico con peso 0 en el portafolio y +1 en el benchmark de referencia"]], ["Bid-ask spread", "Diferencia entre precio de compra y venta; mide costos de transacción e iliquidez; se amplía con costos de gestión de órdenes, inventario, nueva información y asimetría", ["Diferencia de precio entre dos activos distintos del mismo emisor y con el mismo vencimiento", "Volatilidad del precio del activo en un periodo, medida con la desviación estándar de los retornos, y que se amplía con los costos de gestión de órdenes", "Duración del activo, que mide el plazo promedio ponderado de recuperación de la inversión"]], ["IRL (indicador de riesgo de liquidez)", "IRL = ALM − RLN (activos líquidos ajustados menos requerimientos de liquidez netos); como razón ALM/RLN; en FIC sin pacto, liquidez mínima 10%", ["IRL = RLN − ALM: requerimientos de liquidez netos menos activos líquidos ajustados", "IRL = EBITDA / intereses: la capacidad de la generación operativa para cubrir los gastos financieros, que no puede ser menor a 1 en ningún periodo", "IRL = Pasivo / activo: la proporción de los activos que se financia con deuda de corto plazo"]], ["CFEN (coeficiente de fondeo estable neto)", "FED / FER ≥ 100%; mide el desajuste de fondeo; reporte mensual a la SFC", ["CFEN = FER / FED ≥ 100%: fondeo requerido sobre fondeo disponible; reporte trimestral", "CFEN = Activo / pasivo ≥ 100%: mide la cobertura de las obligaciones con los activos totales", "CFEN = Patrimonio / activo ≥ 100%: mide la solvencia de la entidad frente a sus activos"]], ["Pérdida esperada por riesgo de crédito", "RC = (1 − R) × Exposición × PD (R = recuperación, PD = probabilidad de incumplimiento)", ["RC = R × Exposición × PD: la recuperación multiplicada por la exposición y la probabilidad", "RC = PD / Exposición: la probabilidad de incumplimiento dividida entre el monto expuesto", "RC = (1 + R) × PD: uno más la tasa de recuperación, multiplicado por la probabilidad"]], ["Score cards de crédito", "Calificación de clientes con variables propias; reactiva (por contrato), de comportamiento (seguimiento) y proactiva (general)", ["Solo de comportamiento, que se aplica a los clientes que ya tienen un producto con la entidad y se calcula cada mes con su historial de pagos", "Solo reactiva, que se aplica cuando el cliente solicita un contrato o una línea de crédito", "Solo para empresas, porque las personas naturales se evalúan con otro tipo de modelos"]]]}, {"name": "Gestión del riesgo y herramientas", "cards": [["Ciclo de gestión del riesgo", "Identificación, medición, control y monitoreo", ["Medición, venta, control y cierre del riesgo, eros mediante coberturas o seguros contratados por la entidad"]], ["SIAR", "Sistema Integral de Administración de Riesgos: políticas, estrategias, procedimientos, metodologías, controles y límites que gestionan todos los riesgos; exigido por la SFC (Cap. XXXI CBCF)", ["Sistema contable que registra las operaciones y genera los estados financieros de la entidad, y que exige la SFC en el Capítulo XXXI de la Circular Básica", "Sistema de pagos que compensa y liquida las operaciones cerradas por los intermediarios", "Sistema de reporte a la bolsa con las operaciones propias y de terceros de cada comisionista"]], ["Horizonte mínimo para probabilidad de riesgo operacional", "Un año", ["Un mes", "Cinco años", "Un día"]], ["Ciclo de crédito", "Otorgamiento (conocer al sujeto, capacidad de pago, garantías), control y monitoreo (calificación y recalificación) y recuperación (cobranza, reestructuración, dación en pago, castigo)", ["Solo otorgamiento: conocer al sujeto, su capacidad de pago y las garantías que respaldan el crédito", "Venta y cobro: promoción del crédito, desembolso y recaudo de las cuotas durante el plazo pactado", "Provisión y cierre: constitución de las provisiones, castigo de la cartera al vencimiento del plazo y reporte de la información a las centrales de riesgo"]], ["Modalidades de crédito (CBCF)", "Comerciales, consumo, vivienda y microcrédito", ["Solo comercial y consumo, que son las dos modalidades que se calificaban antes de la reforma", "Hipotecario y prendario, según el tipo de garantía que respalda cada una de las obligaciones", "Corto y largo plazo, según el plazo en que el deudor debe cancelar cada una de las obligaciones"]], ["Control del riesgo de liquidez: independencia", "El control de límites debe hacerlo un área distinta a las de tesorería, captaciones y colocaciones", ["Lo hace la tesorería, que conoce mejor las posiciones y las necesidades de liquidez de la entidad", "Lo hace el área comercial, que es la que más interactúa con los cliente se beneficia de las caídas del precio", "Sin cobertura: el contrato a US$59 no se protege con futuros por tener precio fijo"]]]}, {"name": "Capital regulatorio y control interno", "cards": [["Pilares de Basilea", "Pilar I: requerimientos mínimos de capital; Pilar II: proceso de revisión del supervisor; Pilar III: disciplina de mercado (divulgación)", ["Pilar I: divulgación de información al mercado; Pilar II: capital mínimo exigido; Pilar III: supervisión del regulador sobre la gestión de riesgos de cada banco", "Pilar I: supervisión del regulador; Pilar II: disciplina de mercado; Pilar III: capital mínimo", "Pilar I: gobierno corporativo; Pilar II: capital mínimo; Pilar III: supervisión del regulador"]], ["Capital regulatorio vs. económico", "Regulatorio: mínimo exigido por el regulador; económico: el que eligen los accionistas sin regulación", ["Regulatorio: el que eligen los accionistas sin regulación; económico: el mínimo que exige el regulador", "Son iguales: ambos conceptos designan el capital mínimo que exige el supervisor a las entidades", "Ambos son exigidos por el regulador y se calculan con la misma metodología y las mismas variables"]], ["Patrimonio técnico", "Patrimonio básico ordinario neto de deducciones + básico adicional + patrimonio adicional − deducciones", ["Solo el patrimonio básico ordinario, es decir, el capital suscrito y pagado y las reservas", "Activo menos pasivo de la entidad, que se registra en el balance sin deducciones ni ajustes", "Solo el capital pagado, que es el aporte inicial de los accionistas en el momento de constituirla"]], ["Criterios del patrimonio básico ordinario", "Suscrito y pagado, subordinación calificada, perpetuidad, dividendo convencional, no financiado por la entidad y absorción de pérdidas", ["Vencimiento a 5 años, para asegurar su disponibilidad durante el periodo de absorción de pérdidas, y dividendo fijo obligatorio pagado a los accionistas", "Dividendo fijo obligatorio, que se paga a los accionistas aun cuando
