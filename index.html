lo remoción de administradores o revisores fiscales, sin posibilidad de multas", "Cárcel para los administradores que incurran en la infracción, por decisión de la SFC"]], ["Multas del EOSF (valores de 2002)", "Art. 209: hasta COP 110 millones; art. 211 sin norma especial: hasta COP 550 millones; se ajustan por IPC y pueden ser sucesivas", ["Art. 209: hasta COP 1.000 millones; art. 211: hasta COP 5.000 millones, ajustables por IPC", "Art. 209: hasta COP 10 millones; art. 211: hasta COP 50 millones, sin ajuste por IPC", "Sin tope: la SFC fija la cuantía de la multa según la gravedad de la infracción y el beneficio obtenido, y no se ajusta por IPC ni puede ser sucesiva"]], ["Responsabilidad civil de administradores (art. 210 EOSF)", "Quien viole a sabiendas la ley o permita violarla responde personalmente por las pérdidas que sufra cualquier persona", ["Responde solo la entidad, que debe indemnizar a las personas que sufran las pérdidas", "No hay responsabilidad: el administrador responde únicamente ante la sociedad y sus socios", "Solo responsabilidad penal, que determina la justicia ordinaria luego de la sanción de la SFC, sin que haya lugar a reclamar perjuicios a título personal"]], ["Conglomerados financieros: Ley 1870 de 2017", "Regula supervisión comprensiva y consolidada de conglomerados y holdings financieros; capital, límites de exposición, conflictos de interés y gobierno corporativo", ["Regula el mercado de divisas y el régimen cambiario aplicable a los intermediarios del mercado, y fija los topes de las posiciones propias en moneda extranjera", "Regula las pensiones obligatorias y voluntarias, con el régimen de inversión de los fondos", "Regula la bolsa de valores y los sistemas de negociación y de registro de operaciones"]], ["Conglomerado financiero (CF) y holding financiero (HF)", "CF: entidades con controlante común que incluye dos o más vigiladas o del exterior (al menos una en Colombia); HF: persona jurídica/vehículo que ejerce el primer nivel de control", ["CF: una sola entidad vigilada que tiene participación en el capital de otras entidades", "HF: cualquier accionista persona natural que tenga participación en una entidad vigilada; CF: una entidad que ejerce el control sobre otra entidad financiera", "Son sinónimos: ambos términos designan al conjunto de entidades con un controlante común"]], ["No forman parte de los CF (ejemplos)", "Fondos de pensiones, cesantías y voluntarios, FIC (salvo FCP), fondos mutuos, titularizadoras, proveedores de infraestructura y multilaterales", ["Bancos y compañías de financiamiento, que captan recursos del público y son vigiladas por la SFC", "Aseguradoras y sociedades de capitalización, que administran reservas técnicas y vigilan sus riesgos, junto con los bancos y las fiduciarias vigiladas por la SFC", "Fiduciarias y comisionistas de bolsa, que administran recursos de terceros y realizan intermediación"]]]}, {"name": "SARLAFT", "cards": [["Riesgo de LA/FT", "Posibilidad de pérdida o daño de una entidad por ser usada para lavar activos o canalizar recursos al terrorismo; se materializa en riesgos asociados: reputacional, legal, operativo y de contagio", ["Riesgo de mercado: pérdida por movimientos de las tasas, de los precios y de la tasa de cambio, que se materializa en los riesgos legal y reputacional", "Riesgo de crédito: pérdida por incumplimiento de un deudor o de una contraparte de la entidad", "Riesgo de liquidez: pérdida por no poder atender las obligaciones en las fechas de vencimiento"]], ["Riesgo de contagio", "Pérdida por una acción o experiencia de un vinculado (relacionado o asociado con posibilidad de influir en la entidad)", ["Pérdida por los movimientos de los precios de mercado de las posiciones de la entidad", "Pérdida por los cambios en la tasa de interés que afectan el valor de sus inversiones", "Pérdida por insuficiencia de liquidez de la entidad para cumplir sus obligaciones de corto plazo, ante el retiro simultáneo de los recursos de sus clientes"]], ["Fases del SARLAFT", "Prevención (evitar que ingresen recursos ilícitos) y control (detectar y reportar operaciones)", ["Medición y cierre, que son las dos actividades que se ejecutan una vez identificado el riesgo", "Compra y venta de valores, que se realizan con recursos de procedencia lícita comprobada", "Solo reporte: la entidad se limita a enviar a la UIAF los datos de sus operaciones"]], ["Etapas del SARLAFT", "Identificación, medición/evaluación, control y monitoreo; con matriz de riesgo (inherente y residual)", ["Registro y reporte de operaciones, con matriz de riesgo inherente y matriz de riesgo residual", "Solo control de operaciones, que se ejecuta luego de identificar y medir los riesgos de la entidad", "Identificación y sanción de las operaciones sospechosas que detecta el oficial de cumplimiento"]], ["Elementos del SARLAFT", "Políticas, procedimientos, órganos de control, documentación, estructura organizacional, estructura tecnológica, divulgación y capacitación", ["Solo políticas escritas, aprobadas por la junta directiva y divulgadas a los empleados", "Solo tecnología, que permita detectar y monitorear las operaciones inusuales de los clientes, y las políticas que apruebe la junta directiva de la entidad", "Solo capacitación periódica de los empleados sobre las normas y las señales de alerta"]], ["Oficial de cumplimiento: requisitos", "Título profesional, conocimiento en LA/FT y mínimo 24 meses de experiencia en riesgos, segundo nivel jerárquico, capacidad decisoria, sin pertenecer a órganos de control y posesionado ante la SFC", ["Sin experiencia: basta con tener título profesional y conocimiento en LA/FT para ejercer el cargo", "Pertenecer a la auditoría interna o a la revisoría fiscal, para garantizar su independencia", "Nivel operativo dentro de la entidad, con dependencia del área comercial que vincula a los clientes y sin necesidad de posesión ante la Superfinanciera"]], ["Funciones del oficial de cumplimiento (ejemplos)", "Diseñar procedimientos y manuales, velar por el SARLAFT, informes a la junta (mínimo semestrales), criterios de operaciones sospechosas, reportes a la UIAF y consulta de listas vinculantes", ["Auditar los estados financieros de la entidad y emitir el dictamen sobre sus cuentas anuales", "Fijar las tarifas y comisiones que cobra la entidad por los servicios que presta a sus clientes, y aprobar las emisiones de valores de los clientes vinculados", "Aprobar las emisiones de valores y autorizar las ofertas públicas que realicen los clientes"]], ["Conocimiento del cliente (KYC)", "Procedimientos para conocer clientes actuales y potenciales (identificación, actividad, ingresos, PEP); actualizar datos al menos anualmente; el formulario electrónico no sustituye la entrevista", ["Basta con la cédula del cliente: los demás datos se obtienen luego de la primera operación", "Solo para clientes extranjeros, que son los que presentan mayor riesgo de lavado de activos, y se actualiza únicamente cuando el cliente cambia de producto", "No requiere actualización: los datos del cliente se recogen una sola vez, al vincularlo"]], ["Personas públicamente expuestas (PEP)", "Exigen procedimientos más estrictos y aprobación de un empleado de jerarquía superior", ["Se vinculan igual que los demás clientes, sin procedimientos adicionales ni aprobación especial", "No pueden ser clientes de la entidad, por el riesgo de corrupción que representan", "La vinculación la aprueba el asesor que los atiende, sin intervención de un superior"]], ["Operación inusual vs. sospechosa", "Inusual: no guarda relación con la actividad o no tiene explicación razonable; si se concluye que es sospechosa, el oficial la reporta a la UIAF", ["Son lo mismo: toda operación inusual debe reportarse de inmediato a la UIAF por el oficial, sin necesidad de analizar si tiene una explicación razonable", "Sospechosa: se reporta a la bolsa de valores y al AMV para que investiguen la operación", "Inusual: siempre se reporta a la UIAF, aunque tenga una explicación razonable en el perfil"]], ["Segmentación de factores de riesgo", "Clientes, productos, canales de distribución y jurisdicciones", ["Solo clientes, porque son quienes realizan las operaciones susceptibles de lavado de activos", "Mercado y crédito, que son los riesgos propios de la actividad de los intermediarios", "Plazo y tasa, que determinan el valor de las operaciones que realizan los clientes"]], ["Evaluación independiente del SARLAFT", "Revisoría fiscal evalúa anualmente su efectividad; auditoría interna elabora reporte anual a la junta y revisa exoneraciones y parametrizaciones", ["Solo la junta directiva, que evalúa cada año el SARLAFT con base en los reportes del oficial", "Solo el oficial de cumplimiento, que evalúa la efectividad del sistema que él mismo administra, con un informe trimestral dirigido a la junta directiva", "El cliente, que verifica si sus operaciones se registraron y reportaron de manera adecuada"]], ["UIAF", "Unidad de Información y Análisis Financiero (MinHacienda): inteligencia financiera contra el LA; recibe reportes (arts. 102–107 EOSF)", ["Unidad del Banco de la República que supervisa las operaciones cambiarias de los intermediarios", "Unidad de AMV que investiga a los intermediarios por incumplimientos al SARLAFT", "Unidad de la Fiscalía que investiga los delitos de lavado de activos y financiación del terrorismo, y que judicializa a los responsables de las operaciones"]]]}, {"name": "Administradores y defensor del consumidor", "cards": [["Administradores (art. 22 Ley 222/1995)", "Representante legal, liquidador, factor, miembros de junta y quienes ejerzan esas funciones; también miembros de comités de inversión de FIC/AFP y gerente de FCP", ["Solo el gerente de la sociedad, que es quien ejerce la representación legal ante terceros, junto con los accionistas que tengan más del 10% del capital", "Solo los accionistas con participación mayoritaria, que son quienes controlan la sociedad", "Solo el revisor fiscal, que verifica el cumplimiento de la ley y de los estatutos"]], ["Deberes de los administradores (art. 23 Ley 222)", "Obrar de buena fe, con lealtad y diligencia de un buen hombre de negocios; velar por la ley y estatutos, reserva, trato equitativo a socios y no competir ni actuar en conflicto sin autorización", ["Maximizar su bonificación anual con base en los resultados que obtenga la sociedad", "Revelar a terceros los secretos de la sociedad cuando ello favorezca a un socio", "Competir con la sociedad en actividades similares, siempre que informe a la junta directiva, y obtener provecho personal de las oportunidades de negocio de la entidad"]], ["Responsabilidad de administradores (art. 200 C.Co.)", "Solidaria e ilimitada por perjuicios por dolo o culpa; se presume la culpa en violación de ley o estatutos; no responden quienes votaron en contra o no conocieron", ["Limitada a la caución que hayan constituido al posesionarse en el cargo ante la SFC", "Solo penal: responden por el delito que cometan, pero no por los perjuicios que causen", "No responden: la responsabilidad por los actos de administración es siempre de la sociedad, que debe indemnizar a los terceros y a los accionistas perjudicados"]], ["Representantes legales de emisores (art. 47 Ley 964)", "Responsables de sistemas de revelación y control de información financiera; deben reportar deficiencias y fraudes al comité de auditoría, revisor y junta", ["No tienen responsabilidad: los sistemas de control de la información los diseña la revisoría fiscal, que responde ante la SFC por su funcionamiento y sus fallas", "Solo informar a la SFC cuando se cierra el ejercicio, con los estados financieros auditados", "Delegan en auditoría el reporte de las deficiencias, sin que respondan por su divulgación"]], ["Acción social de responsabilidad (art. 25 Ley 222)", "La decide la asamblea (mitad más una), convocada con al menos 20% de acciones; si no se inicia en 3 meses, la ejercen administradores, revisor o socios; acreedores con 50% del pasivo externo", ["La ejerce la SFC de oficio, cuando conozca de la violación de los deberes por un administrador, sin necesidad de convocar a la asamblea ni a los accionistas", "Solo la pueden ejercer los accionistas minoritarios, sin intervención de la asamblea", "No tiene plazos: cualquier accionista la puede iniciar en cualquier momento sin convocar"]], ["Defensor del consumidor financiero (DCF)", "Vocero del cliente ante la entidad, independiente; designado por la asamblea de accionistas por 2 años prorrogables; requiere posesión ante la SFC y RDCF; debe ser conciliador certificado", ["Lo designa la SFC entre una lista de candidatos que le presentan las entidades vigiladas, por periodos de 4 años, y no requiere posesión ante el supervisor", "Es empleado de la entidad vigilada, que le paga un salario y le asigna oficina", "Periodo de 5 años, no prorrogable, con posesión ante la junta directiva de la entidad"]], ["Requisitos del DCF", "Independiente (sin vínculo en el año anterior), conocimiento, 5 años de experiencia o estudios especializados, solvencia moral y certificación de conciliador (Ley 640/2001)", ["Sin experiencia: basta con ser abogado titulado y haber hecho el curso de conciliación", "Empleado de la entidad, con dedicación parcial a sus funciones de defensor del consumidor, que reporta al gerente general y no requiere certificación de conciliador", "Sin certificación: no se exige ser conciliador certificado para ejercer el cargo"]], ["Funciones del DCF", "Resolver quejas objetiva y gratuitamente, conciliar (acta con mérito ejecutivo y cosa juzgada), recomendar, revisar contratos de adhesión (cláusulas abusivas), informar a la SFC", ["Sancionar a las entidades que incumplan la ley, previa decisión de la SFC", "Cobrar a los consumidores por la atención de sus quejas, según una tarifa aprobada", "Fijar las tasas de interés y las comisiones de los productos de las entidades vigiladas, y sancionar a las entidades que incumplan las normas de protección"]], ["Materias que NO conoce el DCF (ejemplos)", "Fuera del giro ordinario, laborales, calidad de accionista, pensiones de invalidez/sobrevivencia (salvo calidad del servicio), asuntos judiciales, hechos de 3 o más años, cuantías > 100 SMMLV, decisión de prestar o no un producto", ["Cuantías de 5 SMMLV o menos, que se consideran asuntos de menor cuantía y se atienden aparte, y los hechos ocurridos dentro del último año calendario", "Hechos ocurridos en el último año, que se tramitan por el procedimiento abreviado", "Quejas sobre la calidad del servicio, que son la materia principal de su competencia"]], ["Efecto de las decisiones del DCF", "Obligatorias solo si las partes lo pactan previamente o la entidad lo prevé en su reglamento; si es desfavorable, el consumidor puede acudir a otros medios", ["Siempre obligatorias para las dos partes, aunque no se hubiera pactado previamente su efecto, y el consumidor pierde cualquier otro medio de reclamación posterior", "Nunca obligatorias: son solo una recomendación que cada parte puede aceptar o rechazar", "Obligatorias solo para el consumidor, que pierde otros medios de reclamación si la acepta"]], ["SAC", "Sistema de Atención al Consumidor Financiero: obligación de las vigiladas; el DCF es complemento", ["Sistema de pagos que compensa y liquida las operaciones de los consumidores financieros", "Sistema contable que registra las quejas recibidas por la entidad vigilada y su trámite", "Sistema de custodia que guarda los documentos de los consumidores financieros en la entidad"]]]}, {"name": "Asesoría y distribución", "cards": [["Asesoría en el mercado de valores (art. 2.40.1.1.1)", "Actividad solo de entidades vigiladas por la SFC, a través de personas naturales inscritas en el RNPMV y certificadas", ["Cualquier persona natural o jurídica, siempre que cobre por el servicio y tenga experiencia", "Solo AMV, que es la entidad autorizada para prestar el servicio de asesoría a los inversionistas, a través de las personas naturales que están certificadas", "Solo los bancos, a través de sus asesores comerciales y sus áreas de inversión"]], ["Entidades obligadas al deber de asesoría", "Quienes tienen asesoría como actividad principal, comisión y corretaje, APT, distribución de FIC, FVP, fiducia de inversión, cuentas de margen y distribución de productos del exterior", ["Solo comisionistas de bolsa, que son las únicas entidades obligadas a asesorar a los clientes", "Solo las que distribuyen FIC, porque son los únicos productos colectivos sujetos al deber", "Solo los emisores de valores, que deben asesorar a los inversionistas que adquieren sus títulos, y las entidades que distribuyen productos del exterior"]], ["El deber de asesoría NO aplica a…", "Gestores de FCP, estructuradores/asesores de banca de inversión y ofrecimiento de servicios financieros del exterior en Colombia", ["Comisionistas de bolsa, que ejecutan órdenes de clientes inversionistas por su cuenta, y las fiduciarias que administran negocios de inversión para sus clientes", "Fiduciarias que administran negocios de inversión por cuenta de sus clientes", "Distribuidores de FIC que vinculan a los inversionistas a los fondos de la familia"]], ["Consejo profesional", "Opinión accesoria de abogados, contadores, etc. con base en su profesión; no requiere RNPMV si no se promueve como asesor ni se cobra por asesoría de inversión", ["Es asesoría de valores, por lo que debe prestarla una persona inscrita en el RNPMV", "Requiere certificación ante AMV, aun si el profesional no se presenta como asesor", "Se cobra como asesoría de inversión, con tarifa publicada en la página web de la entidad, y requiere que el profesional se inscriba en el RNPMV como asesor"]], ["Recomendación profesional", "Opinión idónea individual y personalizada a un inversionista identificado según su perfil y el del producto, para comprar, vender, suscribir, conservar, etc.", ["Opinión general dirigida al público, sin considerar el perfil de ningún inversionista en particular, y que puede difundirse en informes de investigación y boletines", "Boletín de mercado con análisis de los emisores, publicado para todos los clientes", "Información sobre precios y tasas de los valores, que se entrega a los inversionistas del sistema"]], ["Renuncia a la recomendación profesional", "Solo cliente inversionista y productos simples; previa información, manifestación expresa en formato especial (no vale cláusula del contrato de adhesión); se hace análisis de conveniencia igualmente", ["Los productos complejos: el cliente inversionista puede renunciar siempre que lo solicite, mediante una cláusula incluida en el contrato de adhesión de la entidad", "Una cláusula del contrato de adhesión, que el cliente firma al vincularse a la entidad", "Sin análisis de conveniencia: al renunciar, el intermediario queda eximido de este deber"]], ["Naturaleza de la recomendación", "No vinculante: el cliente puede actuar diferente; si asume más riesgo, debe quedar registro previo en medio verificable", ["Vinculante: el cliente debe seguirla, y la entidad queda eximida de su cumplimiento", "Obligatoria para el cliente en productos complejos, que no puede asumir mayor riesgo", "Sin registro: el cliente puede actuar de manera diferente sin dejar ninguna constancia, porque la recomendación es una opinión de carácter meramente informativo"]], ["Leyenda en informes de investigación y comunicaciones generales", "«El contenido de la presente comunicación no constituye una recomendación profesional…» (art. 2.40.1.1.2 Decreto 2555); no requieren ser entidad vigilada", ["No requieren leyenda, porque son documentos de carácter general dirigidos al público", "Son asesoría profesional y deben cumplir las reglas de perfilamiento y recomendación", "Deben ser personalizadas, con el perfil de un inversionista identificado como destinatario, y su emisión solo está permitida a entidades vigiladas por la SFC"]], ["Etapas de la asesoría", "Perfilamiento del inversionista, perfilamiento del producto, análisis de conveniencia, recomendación profesional y entrega de información", ["Venta y cobro: el intermediario ofrece el producto, recauda su comisión por la operación y entrega la información al cliente luego de la vinculación", "Solo perfil del inversionista, porque el resto de las etapas las define el cliente", "Solo recomendación profesional, que se emite una vez el cliente solicita una operación"]], ["Perfil del inversionista", "Conocimiento, experiencia, tolerancia al riesgo, horizonte, situación financiera e intereses; clasificar cliente inversionista o profesional", ["Solo la edad del inversionista, que determina su horizonte y su tolerancia al riesgo", "Solo los ingresos mensuales, que definen su capacidad para asumir pérdidas en inversiones, sin considerar su conocimiento, su experiencia ni su horizonte", "Solo el patrimonio total del inversionista, que define su capacidad de inversión"]], ["Análisis de conveniencia", "Evaluación (previa e interna) de si el perfil del producto es adecuado al del cliente; no es la recomendación profesional", ["Es la recomendación profesional: la opinión personalizada para el inversionista identificado, que se entrega luego de que el cliente solicita la operación", "Lo hace el cliente, que evalúa si el producto es adecuado para sus intereses y objetivos", "Es opcional: el intermediario decide si lo realiza según el valor de la operación"]], ["Productos simples (criterios)", "Fácilmente comprensibles, información transparente, precio disponible o negociación en sistemas, salida razonable (limitaciones temporales no los hacen complejos)", ["De alto riesgo: su rentabilidad es incierta y exige conocimientos avanzados del inversionista, y no tienen precio disponible ni salida razonable al vencimiento", "Opacos: no tienen información disponible sobre su precio ni sobre sus condiciones", "Sin liquidez: no tienen una forma razonable de salida para el inversionista antes del plazo"]], ["Productos complejos (ejemplos)", "Derivados estandarizados sin valor razonable diario, estructurados, deuda subordinada o sin vencimiento, FCP, inmobiliarios no negociados, apalancados, ETF con índices no reconocidos", ["CDT emitidos por establecimientos de crédito, de plazo y rentabilidad conocidos", "TES de tasa fija, que se negocian en sistemas con precio disponible a lo largo del día", "FIC del mercado monetario, que invierten en valores de corto plazo y alta calidad crediticia, y los TES de tasa fija que se negocian en sistemas con precio"]], ["FIC y portafolios estandarizados de FVP universales", "Pueden clasificarse como universales (para cualquier inversionista); no requieren perfilamiento ni recomendación", ["Siempre son productos complejos, que requieren recomendación profesional por su tipo", "Solo para inversionistas profesionales, que cuentan con experiencia y conocimiento suficientes, y su distribución exige perfilamiento y recomendación previa", "Requieren recomendación profesional en todos los casos, aunque el cliente la rechace"]], ["Distribución de productos complejos a clientes inversionistas", "Información suficiente, perfil adecuado, relación riesgo-remuneración conveniente, ofrecer alternativas menos complejas; entregar el soporte de la recomendación si se solicita", ["No requiere recomendación profesional, porque basta con entregar la información del producto, y el cliente puede decidir sin análisis de conveniencia previo", "Sin información adicional: el cliente decide con base en lo que le indique el promotor", "Ofrecer solo productos complejos, que son los que generan mayor rentabilidad a la entidad"]], ["Contraparte en OTC con cliente inversionista", "Análisis de conveniencia (no aplica en solo ejecución), explicar que actúa en posición propia, informar condiciones, condiciones de mercado razonables, libro de instrucciones internas el mismo día y, si es complejo, recomendación previa de asesor", ["No debe informar al cliente que actúa en posición propia, para no afectar la negociación", "Sin libro de instrucciones internas: basta con el registro de la operación en el sistema", "Sin condiciones de mercado: puede pactar el precio que considere conveniente con el cliente, y no debe llevar libro de instrucciones internas ni informar su posición"]], ["Libro de instrucciones internas", "Registra instrucciones de clientes inversionistas que se cruzan contra posición propia (identificación, hora, comprobante de registro, información entregada); se diligencia el mismo día", ["Es el LEO, que registra las órdenes que recibe la entidad por cuenta de sus clientes", "Es opcional: la entidad decide si lo lleva según el volumen de operaciones con clientes", "Registra órdenes de terceros que la entidad ejecuta por cuenta de sus clientes en el mercado, con la hora y el comprobante de ejecución en el sistema de negociación"]], ["Tarifas y comisiones de asesoría", "Deben ser transparentes y publicarse en la web; reflejar las actividades realizadas (incl. solo ejecución)", ["Son confidenciales: la entidad solo las informa al cliente en el momento de la vinculación, y no tienen que reflejar las actividades realizadas por el asesor", "Se pactan verbalmente con cada cliente, según el monto y la complejidad de las operaciones", "No se publican: la entidad las comunica a la SFC pero no a sus clientes ni al público"]], ["Informes de investigación como recomendación profesional (excepción)", "Solo si el inversionista aceptó expresamente, va a inversionistas identificados, se avisa que es recomendación, hay acceso a asesor certificado, sin productos complejos y sin la leyenda", ["Siempre son recomendación profesional, y deben cumplir las reglas de perfilamiento del cliente, aunque se dirijan al público en general y no a un inversionista", "Nunca son recomendación profesional, aunque cumplan todas las condiciones de la norma", "Solo si se envían por correo electrónico al inversionista, con la leyenda de advertencia"]], ["Personas autorizadas para asesorar", "Las entidades deben publicar en su web quiénes están autorizados y sobre qué productos; el contrato de uso de red debe garantizar atención por personas del RNPMV certificadas", ["Es confidencial: la entidad solo informa quiénes son sus asesores a los clientes que lo piden, y no tiene que indicar sobre qué productos están autorizados", "Cualquier empleado de la entidad, aunque no esté inscrito en el RNPMV ni certificado", "No se publican: la entidad solo reporta a AMV la lista de asesores autorizados cada año"]]]}]}];
const KEY="amv-estudio-v1";
let S={box:{},seen:{},fail:{},size:20,theme:""};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function hash(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(36)}
const ALL=[];
DECKS.forEach(d=>d.sections.forEach(s=>s.cards.forEach(c=>{const x={id:d.id+":"+hash(c[0]),deck:d.id,sec:s.name,q:c[0],a:c[1],d:c[2]};c.x=x;ALL.push(x)})));
const byDeck=id=>ALL.filter(c=>c.deck===id);
const box=c=>S.box[c.id]||0;
const mastered=cs=>cs.filter(c=>box(c)>=3).length;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function pick(pool,n){ // prioriza cajas bajas, con azar dentro de cada caja
  const g=[[],[],[],[],[]];shuffle(pool).forEach(c=>g[Math.min(box(c),4)].push(c));
  const out=[].concat(...g);return shuffle(out.slice(0,n||out.length));
}
function mark(c,ok){
  S.seen[c.id]=1;
  if(ok)S.box[c.id]=Math.min(4,box(c)+1);else{S.box[c.id]=0;S.fail[c.id]=1}
  if(ok&&box(c)>=3)delete S.fail[c.id];
  save();
}
let sess=null;
const view=h=>{$("#app").innerHTML=h;window.scrollTo(0,0)};
function topbar(title,back){return `<div class="top"><h1>${title}</h1>${back?`<button class="sm" data-a="${back}">‹ Volver</button>`:`<button class="sm" data-a="theme">Tema</button>`}</div>`}

function home(){
  const seen=ALL.filter(c=>S.seen[c.id]).length,fails=ALL.filter(c=>S.fail[c.id]).length;
  view(topbar("Estudio AMV · Operador")+
  `<div class="mono mute" style="margin-bottom:10px">${ALL.length} tarjetas · ${seen} vistas · ${mastered(ALL)} dominadas · ${fails} falladas</div>
  <div class="row"><button class="pri" data-a="sim">Simulacro (todo)</button><button data-a="fails" ${fails?"":"disabled"}>Repasar falladas (${fails})</button></div>
  <div class="sec">Mazos</div><div class="list">`+
  DECKS.map(d=>{const cs=byDeck(d.id),m=mastered(cs);return `<button class="item" data-a="deck" data-id="${d.id}"><span class="t">${esc(d.title)}</span><span class="mono mute">${m}/${cs.length}</span><span class="code">${d.code}</span><span></span><div class="bar"><i style="width:${cs.length?100*m/cs.length:0}%"></i></div></button>`}).join("")+`</div>
  <div class="sec">Tarjetas por sesión</div>
  <select id="size">${[10,20,40,0].map(n=>`<option value="${n}" ${S.size===n?"selected":""}>${n||"Todas"}</option>`).join("")}</select>
  <p class="mute" style="font-size:12px;margin-top:20px">Las tarjetas se generaron a partir de las guías y pueden tener errores: confirma en el material oficial. Cajas: acertar sube la tarjeta de caja (0–4), fallar la devuelve a 0. Dominada = caja 3 o más.</p>`);
  $("#size").onchange=e=>{S.size=+e.target.value;save()};
}
function deck(id){
  const d=DECKS.find(x=>x.id===id);
  view(topbar(d.code+" · "+esc(d.title),"home")+
  `<div class="row"><button class="pri" data-a="go" data-m="flash" data-id="${id}">Tarjetas</button><button class="pri" data-a="go" data-m="quiz" data-id="${id}">Quiz</button></div>
  <div class="sec">Secciones (marca las que quieres)</div><div class="list">`+
  d.sections.map((s,i)=>{const cs=s.cards.map(c=>c.x);return `<label class="chk"><input type="checkbox" checked data-i="${i}"><span>${esc(s.name)}</span><span class="mono mute">${mastered(cs)}/${cs.length}</span></label>`}).join("")+`</div>`);
}
function startFrom(pool,mode,title,back){
  const n=S.size||pool.length;
  sess={mode,title,back,q:pick(pool,n),i:0,ok:0,bad:0,shown:false,miss:[]};
  if(!sess.q.length){home();return}
  next();
}
function next(){
  if(sess.i>=sess.q.length)return result();
  sess.mode==="flash"?flash():quiz();
}
function head(){return topbar(esc(sess.title),sess.back)+`<div class="prog"><span>${sess.i+1} / ${sess.q.length}</span><span>OK ${sess.ok} · NO ${sess.bad}</span></div>`}
function flash(){
  const c=sess.q[sess.i];
  view(head()+`<div class="card" data-a="flip"><div class="lab">PREGUNTA <span class="box">caja ${box(c)}</span></div><div class="q">${esc(c.q)}</div>${sess.shown?`<div class="a">${esc(c.a)}</div>`:`<div class="mute" style="font-size:13px">Toca para ver la respuesta</div>`}</div>`+
  (sess.shown?`<div class="row" style="margin-top:10px"><button data-a="rate" data-v="0" style="border-color:var(--bad)">No la sabía</button><button data-a="rate" data-v="1" style="border-color:var(--ok)">La sabía</button></div>`:""));
}
function quiz(){
  const c=sess.q[sess.i];
  if(!c.opts)c.opts=shuffle([c.a,...c.d]);
  const done=sess.picked!=null;
  view(head()+`<div class="card" style="min-height:0;cursor:default"><div class="lab">${esc(c.sec)}</div><div class="q">${esc(c.q)}</div></div><div class="opts">`+
  c.opts.map((o,k)=>{let cl="";if(done){if(o===c.a)cl="ok";else if(k===sess.picked)cl="bad"}return `<button class="opt ${cl}" data-a="pick" data-k="${k}" ${done?"disabled":""}>${esc(o)}</button>`}).join("")+`</div>`+
  (done?`<div class="row" style="margin-top:10px"><button class="pri" data-a="nextq">${sess.i+1>=sess.q.length?"Ver resultado":"Siguiente"}</button></div>`:""));
}
function result(){
  const n=sess.q.length,p=Math.round(100*sess.ok/n);
  view(topbar("Resultado",sess.back||"home")+`<div class="score">${sess.ok}/${n} <span class="mute" style="font-size:18px">${p}%</span></div>
  ${sess.miss.length?`<div class="sec">Falladas en esta sesión</div><div class="list">${sess.miss.map(c=>`<div class="item"><span class="t">${esc(c.q)}</span><span></span><span class="mute" style="grid-column:1/-1">${esc(c.a)}</span></div>`).join("")}</div>`:`<p class="mute">Sin falladas.</p>`}
  <div class="row" style="margin-top:14px"><button class="pri" data-a="again">Otra sesión</button><button data-a="home">Inicio</button></div>`);
}
let cur=null; // contexto de la última sesión para repetir
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-a]");if(!t)return;
  const a=t.dataset.a;
  if(a==="home")return home();
  if(a==="theme"){const r=document.documentElement;const d=matchMedia("(prefers-color-scheme:dark)").matches;const now=r.dataset.theme||(d?"dark":"light");r.dataset.theme=now==="dark"?"light":"dark";return}
  if(a==="deck")return deck(t.dataset.id);
  if(a==="sim"){cur={pool:ALL,mode:"quiz",title:"Simulacro",back:"home"};return startFrom(cur.pool,cur.mode,cur.title,cur.back)}
  if(a==="fails"){cur={pool:ALL.filter(c=>S.fail[c.id]),mode:"flash",title:"Falladas",back:"home"};return startFrom(cur.pool,cur.mode,cur.title,cur.back)}
  if(a==="go"){
    const id=t.dataset.id,d=DECKS.find(x=>x.id===id);
    const idx=[...document.querySelectorAll(".chk input")].filter(i=>i.checked).map(i=>+i.dataset.i);
    const pool=idx.flatMap(i=>d.sections[i].cards.map(c=>c.x));
    if(!pool.length)return;
    cur={pool,mode:t.dataset.m,title:d.code+(t.dataset.m==="quiz"?" · Quiz":" · Tarjetas"),back:"deck:"+id};
    return startFrom(pool,cur.mode,cur.title,cur.back);
  }
  if(a==="again")return startFrom(cur.pool,cur.mode,cur.title,cur.back);
  if(a==="flip"){sess.shown=true;return flash()}
  if(a==="rate"){const c=sess.q[sess.i],ok=t.dataset.v==="1";mark(c,ok);ok?sess.ok++:(sess.bad++,sess.miss.push(c));sess.i++;sess.shown=false;return next()}
  if(a==="pick"){const c=sess.q[sess.i],k=+t.dataset.k,ok=c.opts[k]===c.a;sess.picked=k;mark(c,ok);ok?sess.ok++:(sess.bad++,sess.miss.push(c));return quiz()}
  if(a==="nextq"){sess.i++;sess.picked=null;return next()}
});
// el botón Volver de una sesión apunta a "deck:ID" o "home"
document.addEventListener("click",e=>{const t=e.target.closest('[data-a^="deck:"]');if(t)deck(t.dataset.a.slice(5))},true);
home();
</script>
<script>if('serviceWorker' in navigator)addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})</script>
